name: P1-J4-01 MCP lifecycle

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/harness_mcp.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-daemon/tests/p1_j4_01_mcp.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j4-01-mcp-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j4-01-mcp.yml"
  pull_request:
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/harness_mcp.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-daemon/tests/p1_j4_01_mcp.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j4-01-mcp-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j4-01-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run MCP boundary fixtures
        run: cargo test -p kiana-daemon --lib harness_mcp::tests:: --locked -- --test-threads=1
      - name: Run MCP lifecycle contract guard
        run: cargo test -p kiana-daemon --test p1_j4_01_mcp --locked -- --test-threads=1
      - name: Compile P1-J4-01 targets
        run: cargo check --workspace --tests --locked

