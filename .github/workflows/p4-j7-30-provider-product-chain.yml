name: P4-J7-30 provider product chain

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/provider_product_chain.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_30_provider_product_chain.rs"
      - "kiana-domain/tests/fixtures/p4-j7-30-product-chain.json"
      - "kiana-client/src/surface_parity.rs"
      - "kiana-client/tests/p4_j7_30_surface_parity.rs"
      - "kiana-core/tests/p4_j7_30_provider_product_chain_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "kiana-entrypoints/src/web.rs"
      - "contrib/desktop/main.js"
      - "docs/roadmap/p4-j7-30-provider-product-chain-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-30-provider-product-chain.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/provider_product_chain.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_30_provider_product_chain.rs"
      - "kiana-domain/tests/fixtures/p4-j7-30-product-chain.json"
      - "kiana-client/src/surface_parity.rs"
      - "kiana-client/tests/p4_j7_30_surface_parity.rs"
      - "kiana-core/tests/p4_j7_30_provider_product_chain_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "kiana-entrypoints/src/web.rs"
      - "contrib/desktop/main.js"
      - "docs/roadmap/p4-j7-30-provider-product-chain-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-30-provider-product-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-product-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run product-chain domain fixtures
        run: cargo test -p kiana-domain --test p4_j7_30_provider_product_chain --locked -- --test-threads=1
      - name: Run four-surface parity fixtures
        run: cargo test -p kiana-client --test p4_j7_30_surface_parity --locked -- --test-threads=1
      - name: Run product-chain source guard
        run: cargo test -p kiana-core --test p4_j7_30_provider_product_chain_guard --locked -- --test-threads=1
      - name: Compile P4-J7-30 targets
        run: cargo check --workspace --tests --locked
