name: "DEP-05 · Operation lifecycle baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep05-operation-lifecycle:
    name: "DEP-05 · Operation lifecycle baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep05_operation_lifecycle_guard
        run: cargo test -p kiana-core --test dep05_operation_lifecycle_guard --locked -- --test-threads=1
      - name: Run kiana-domain dep05_operation_lifecycle
        run: cargo test -p kiana-domain --test dep05_operation_lifecycle --locked -- --test-threads=1
