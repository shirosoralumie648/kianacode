name: H22 compaction diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compaction:
    name: H22 working-state compaction fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt -p kiana-domain -p kiana-runner --check
      - name: Run domain compact summary fixtures
        run: cargo test -p kiana-domain --test h22_compact_summary --locked -- --test-threads=1
      - name: Run runner compaction guard
        run: cargo test -p kiana-runner --test h22_compact_guard --locked -- --test-threads=1
      - name: Run runner compaction behavior fixtures
        run: cargo test -p kiana-runner --test h22_compaction_behavior --locked -- --test-threads=1
      - name: Run named H22 behavior fixtures
        run: |
          for fixture in \
            h22_summary_cannot_forge_completed_tool_or_approval \
            h22_compaction_keeps_pending_pairs_and_latest_goal \
            h22_agent_continues_task_after_two_compactions_without_repeating_completed_edit; do
            cargo test -p kiana-runner --test h22_compaction_behavior "$fixture" --locked -- --exact --test-threads=1 || exit 1
          done
      - name: Compile domain compact summary target
        run: cargo test -p kiana-domain --test h22_compact_summary --no-run --locked
      - name: Compile runner compaction guard target
        run: cargo test -p kiana-runner --test h22_compact_guard --no-run --locked
      - name: Compile runner compaction behavior target
        run: cargo test -p kiana-runner --test h22_compaction_behavior --no-run --locked
