name: H22 compaction diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: H22 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: domain-summary
            package: kiana-domain
            target: h22_compact_summary
          - name: runner-compaction-guard
            package: kiana-runner
            target: h22_compact_guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run focused H22 target
        run: cargo test -p ${{ matrix.package }} --test ${{ matrix.target }} --locked -- --test-threads=1
