name: BQ-00 billing quota cost baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-baseline:
    name: BQ-00 billing quota cost baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-00 source guard
        run: cargo test -p kiana-core --test bq00_cost_capacity_guard --locked -- --test-threads=1
      - name: Compile BQ-00 source guard
        run: cargo test -p kiana-core --test bq00_cost_capacity_guard --no-run --locked
