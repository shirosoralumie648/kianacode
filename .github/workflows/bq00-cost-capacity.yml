name: BQ-00 billing quota cost baseline

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/usage.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/bq00_cost_capacity_guard.rs"
      - "docs/roadmap/billing-quota-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq00-cost-capacity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/usage.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/bq00_cost_capacity_guard.rs"
      - "docs/roadmap/billing-quota-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq00-cost-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run BQ-00 source guard
        run: cargo test -p kiana-core --test bq00_cost_capacity_guard --locked -- --test-threads=1
      - name: Compile BQ baseline targets
        run: cargo check --workspace --tests --locked
