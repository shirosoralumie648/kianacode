name: "UI-18 Web SSE reconnect, Last-Event-ID and gap"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui18-web-sse:
    name: "UI-18 Web SSE reconnect, Last-Event-ID and gap"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The runtime fixtures drive a real DaemonHost/Web router and stream real frames; the project
      # convention for daemon/entrypoint tests is a 32 MiB test-thread stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the reconnect/cursor/metric contract fixture
        run: cargo test -p kiana-entrypoints --test ui18_web_sse --locked -- --test-threads=1
      - name: Run the read-only display and completion-slice guard
        run: cargo test -p kiana-entrypoints --test ui18_web_sse_guard --locked -- --test-threads=1
      - name: Run the live loopback reconnect/cursor/lag fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui18_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
