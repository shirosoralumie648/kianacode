name: CP-15 cancellation state and barrier

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/cancellation.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp15_cancellation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/tests/cp15_cancellation_guard.rs"
      - "kiana-runner-protocol/src/lib.rs"
      - "docs/roadmap/control-plane-cancellation-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp15-cancellation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/cancellation.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp15_cancellation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/tests/cp15_cancellation_guard.rs"
      - "kiana-runner-protocol/src/lib.rs"
      - "docs/roadmap/control-plane-cancellation-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp15-cancellation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-15 cancellation fixtures
        run: cargo test -p kiana-domain --test cp15_cancellation --locked -- --test-threads=1
      - name: Run CP-15 source guard
        run: cargo test -p kiana-core --test cp15_cancellation_guard --locked -- --test-threads=1
      - name: Compile CP-15 targets
        run: cargo check --workspace --tests --locked
