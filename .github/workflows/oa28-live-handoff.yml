name: oa28-live-handoff

on:
  push:
    paths:
      - "kiana-domain/src/live_handoff.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/oa28_live_handoff.rs"
      - "scripts/oa28-live-handoff-preflight.sh"
      - "docs/roadmap/oa28-live-handoff.md"
      - ".github/workflows/oa28-live-handoff.yml"
  pull_request:
    paths:
      - "kiana-domain/src/live_handoff.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/oa28_live_handoff.rs"
      - "scripts/oa28-live-handoff-preflight.sh"
      - "docs/roadmap/oa28-live-handoff.md"
      - ".github/workflows/oa28-live-handoff.yml"

permissions:
  contents: read

jobs:
  oa28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa28-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - run: bash -n scripts/oa28-live-handoff-preflight.sh
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test oa28_live_handoff --locked -- --test-threads=1
