name: co29-rework

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/rework_contract.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_attempt.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co29_rework_contract.rs"
      - "kiana-core/src/rework_contract.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co29_rework_guard.rs"
      - "docs/roadmap/co29-rework-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co29-rework.yml"
  pull_request:
    paths:
      - "kiana-domain/src/rework_contract.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_attempt.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co29_rework_contract.rs"
      - "kiana-core/src/rework_contract.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co29_rework_guard.rs"
      - "docs/roadmap/co29-rework-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co29-rework.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-29 rework fixtures
        run: cargo test -p kiana-domain --test co29_rework_contract --locked -- --test-threads=1
      - name: Run CO-29 rework source guard
        run: cargo test -p kiana-core --test co29_rework_guard --locked -- --test-threads=1
      - name: Compile CO-29 rework targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
