name: "CO-29 bounded rework and successor history baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co29-rework:
    name: "CO-29 bounded rework and successor history baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co29_rework_guard
        run: cargo test -p kiana-core --test co29_rework_guard --locked -- --test-threads=1
      - name: Run kiana-domain co29_rework_contract
        run: cargo test -p kiana-domain --test co29_rework_contract --locked -- --test-threads=1
