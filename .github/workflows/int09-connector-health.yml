name: int09-connector-health

on:
  push:
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int09_connector_health.rs"
      - "kiana-ports/src/connector.rs"
      - "kiana-policy/src/lib.rs"
      - "kiana-core/src/capability_scheduler.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-core/tests/int09_connector_health_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-query/src/connector_health.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/int09_connector_health.rs"
      - "kiana-protocol/src/ui_contracts.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "kiana-entrypoints/src/workbench_render.rs"
      - "kiana-entrypoints/tests/int09_connector_health_guard.rs"
      - ".github/workflows/int09-connector-health.yml"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap/int09-connector-health-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
  pull_request:
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int09_connector_health.rs"
      - "kiana-ports/src/connector.rs"
      - "kiana-policy/src/lib.rs"
      - "kiana-core/src/capability_scheduler.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-core/tests/int09_connector_health_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-query/src/connector_health.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/int09_connector_health.rs"
      - "kiana-protocol/src/ui_contracts.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "kiana-entrypoints/src/workbench_render.rs"
      - "kiana-entrypoints/tests/int09_connector_health_guard.rs"
      - ".github/workflows/int09-connector-health.yml"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap/int09-connector-health-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-09 domain health fixtures
        run: cargo test -p kiana-domain --test int09_connector_health --locked -- --test-threads=1
      - name: Run INT-09 query health fixtures
        run: cargo test -p kiana-query --test int09_connector_health --locked -- --test-threads=1
      - name: Run INT-09 core source guard
        run: cargo test -p kiana-core --test int09_connector_health_guard --locked -- --test-threads=1
      - name: Run INT-09 entrypoint source guard
        run: cargo test -p kiana-entrypoints --test int09_connector_health_guard --locked -- --test-threads=1
      - name: Compile connector health path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-policy -p kiana-core -p kiana-query -p kiana-protocol -p kiana-client -p kiana-daemon -p kiana-entrypoints --tests --locked
