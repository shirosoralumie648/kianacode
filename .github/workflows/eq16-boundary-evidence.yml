name: EQ-16 evaluation boundary evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-evidence:
    name: EQ-16 scrubbed boundary evidence fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EQ-16 daemon boundary fixtures
        run: cargo test -p kiana-daemon --test eq16_boundary_evidence --locked -- --test-threads=1
      - name: Run EQ-16 Core source guard
        run: cargo test -p kiana-core --test eq16_boundary_evidence_guard --locked -- --test-threads=1
      - name: Compile EQ-16 daemon target
        run: cargo test -p kiana-daemon --test eq16_boundary_evidence --no-run --locked
      - name: Compile EQ-16 Core guard target
        run: cargo test -p kiana-core --test eq16_boundary_evidence_guard --no-run --locked
