name: CM-01 source and memory scope contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/tests/cm01_sources.rs"
      - "docs/roadmap/context-scope-baseline.md"
      - ".github/workflows/cm01-sources.yml"
  pull_request:
    paths:
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/tests/cm01_sources.rs"
      - "docs/roadmap/context-scope-baseline.md"
      - ".github/workflows/cm01-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-01 source fixtures
        run: cargo test -p kiana-domain --test cm01_sources --locked -- --test-threads=1
