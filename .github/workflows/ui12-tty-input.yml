name: "UI-12 TTY input state machine"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui12-tty-input:
    name: "UI-12 TTY input state machine"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the PTY/Unicode/IME/paste/history/resize/EOF/SIGINT fixtures
        run: cargo test -p kiana-entrypoints --test ui12_tty_input --locked -- --test-threads=1
      - name: Run the entrypoint input boundary guard
        run: cargo test -p kiana-entrypoints --test ui12_tty_input_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
