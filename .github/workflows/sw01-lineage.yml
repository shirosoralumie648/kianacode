name: SW-01 typed swarm lineage

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_identity.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sw01_lineage.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/tests/sw01_lineage_guard.rs"
      - "docs/roadmap/swarm-lineage-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw01-lineage.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_identity.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sw01_lineage.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/tests/sw01_lineage_guard.rs"
      - "docs/roadmap/swarm-lineage-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw01-lineage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-01 lineage fixtures
        run: cargo test -p kiana-domain --test sw01_lineage --locked -- --test-threads=1
      - name: Run SW-01 source guard
        run: cargo test -p kiana-core --test sw01_lineage_guard --locked -- --test-threads=1
      - name: Compile lineage path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-protocol -p kiana-core --tests --locked
