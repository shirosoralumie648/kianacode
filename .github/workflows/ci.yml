name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiana-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-structure:
    name: Workflow structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ripgrep
          rg --version
      - name: Validate workflow YAML
        run: |
          bash scripts/ci/validate-workflows.sh
          bash scripts/ci/validate-doc-references.sh
          bash scripts/tests/eq49-eval-scripts-static.sh
          bash scripts/tests/eq50-ci-lanes-static.sh
          bash scripts/tests/eq51-evidence-archive-static.sh
          bash scripts/validate-dep41-release-gate.sh
          bash scripts/validate-sc28-supply-chain.sh
          bash scripts/validate-sc41-security-gate.sh
          bash scripts/validate-sc42-recovery-rehearsal.sh
          bash scripts/validate-sc43-security-closeout.sh
          bash scripts/validate-pd35-persistence-closeout.sh
          bash scripts/validate-evidence-manifest.sh scripts/fixtures/sc35-evidence-manifest.example.json
          bash scripts/verify-ui37-docs.sh
          find scripts -type f -name '*.sh' -exec bash -n {} +

  rust-gates:
    name: Rust gates (fmt/check/clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules/npm
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked
      - name: Run desktop contract tests
        run: node --test contrib/desktop/tests/*.js

  rust-tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard:
          - kiana-bootstrap
          - kiana-bridge
          - kiana-capability-broker
          - kiana-capability-governance-supervisor
          - kiana-chrome-mcp
          - kiana-client
          - kiana-commands
          - kiana-computer-mcp
          - kiana-constants
          - "kiana-core-s1/6"
          - "kiana-core-s2/6"
          - "kiana-core-s3/6"
          - "kiana-core-s4/6"
          - "kiana-core-s5/6"
          - "kiana-core-s6/6"
          - kiana-daemon
          - "kiana-domain-s1/4"
          - "kiana-domain-s2/4"
          - "kiana-domain-s3/4"
          - "kiana-domain-s4/4"
          - kiana-entrypoints
          - kiana-eventlog
          - kiana-gates
          - kiana-modifiers
          - kiana-policy
          - kiana-ports
          - kiana-protocol
          - kiana-provider
          - kiana-quality
          - kiana-query
          - kiana-remote
          - kiana-runner
          - kiana-runner-protocol
          - kiana-screens
          - kiana-services
          - kiana-skills
          - kiana-tasks
          - kiana-tools
          - kiana-types
          - kiana-url-handler
          - kiana-workflow
    env:
      # The workspace links ~1468 test binaries. Default debuginfo made them exceed the
      # runner disk (run 36408178011: "Free space left: 0 MB", ld killed by SIGBUS), and
      # even with stripped symbols the single `cargo test --workspace` job did not finish
      # within its 180-minute limit (run 36409955952 was cancelled mid-suite). Stripping
      # plus sharding fixes both: symbols only affect the test profile, so fmt/check/clippy
      # stay byte-identical.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules/npm
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
      - name: Run shard
        run: |
          python3 - "$SHARD" <<'PY' > .shard.env
          import json, sys
          d = json.load(open("scripts/ci/test-shards.json"))
          entry = d[sys.argv[1]]
          print(f"CRATE={entry['crate']}")
          print('TARGETS="' + " ".join(entry["targets"] or []) + '"')
          PY
          . ./.shard.env
          status=0
          if [ -z "${TARGETS:-}" ]; then
            cargo test -p "$CRATE" --locked --no-fail-fast -- --test-threads=1 || status=1
          else
            for t in $TARGETS; do
              cargo test -p "$CRATE" --test "$t" --locked -- --test-threads=1 || status=1
            done
          fi
          exit $status
        env:
          SHARD: ${{ matrix.shard }}
