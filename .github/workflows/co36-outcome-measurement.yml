name: "CO-36 Outcome measurement and achievement baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co36-outcome-measurement:
    name: "CO-36 Outcome measurement and achievement baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co36_outcome_measurement_guard
        run: cargo test -p kiana-core --test co36_outcome_measurement_guard --locked -- --test-threads=1
      - name: Run kiana-domain co36_outcome_measurement
        run: cargo test -p kiana-domain --test co36_outcome_measurement --locked -- --test-threads=1
