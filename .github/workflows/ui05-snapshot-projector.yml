name: "UI-05 atomic snapshot projector and pagination"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui05-snapshot-projector:
    name: "UI-05 atomic snapshot projector and pagination"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-domain ui05_snapshot_projector
        run: cargo test -p kiana-domain --test ui05_snapshot_projector --locked -- --test-threads=1
      - name: Run kiana-daemon ui05_snapshot_page
        run: cargo test -p kiana-daemon --test ui05_snapshot_page --locked -- --test-threads=1
      - name: Run kiana-core ui05_snapshot_projector_guard
        run: cargo test -p kiana-core --test ui05_snapshot_projector_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-domain -p kiana-daemon -p kiana-core --no-run --locked
