name: UI-05 snapshot projector and pagination

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ui_snapshot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ui05_snapshot_projector.rs"
      - "kiana-core/tests/ui05_snapshot_projector_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/ui_contracts.rs"
      - "docs/roadmap/ui05-snapshot-projector-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui05-snapshot-projector.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ui_snapshot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ui05_snapshot_projector.rs"
      - "kiana-core/tests/ui05_snapshot_projector_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/ui_contracts.rs"
      - "docs/roadmap/ui05-snapshot-projector-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui05-snapshot-projector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui05-snapshot-projector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run UI-05 domain projector fixtures
        run: cargo test -p kiana-domain --test ui05_snapshot_projector --locked -- --test-threads=1
      - name: Run UI-05 source guard
        run: cargo test -p kiana-core --test ui05_snapshot_projector_guard --locked -- --test-threads=1
      - name: Compile UI-05 workspace targets
        run: cargo check --workspace --tests --locked
