name: co44-company-integration

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_integration.rs"
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co44_company_integration.rs"
      - "kiana-core/src/company_integration.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co44_company_integration_guard.rs"
      - "docs/roadmap/co44-company-integration-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co44-company-integration.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_integration.rs"
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co44_company_integration.rs"
      - "kiana-core/src/company_integration.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co44_company_integration_guard.rs"
      - "docs/roadmap/co44-company-integration-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co44-company-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-44 integration fixtures
        run: cargo test -p kiana-domain --test co44_company_integration --locked -- --test-threads=1
      - name: Run CO-44 Swarm/MergeReceipt guard
        run: cargo test -p kiana-core --test co44_company_integration_guard --locked -- --test-threads=1
      - name: Compile CO-44 integration targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
