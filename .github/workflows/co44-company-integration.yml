name: "CO-44 Company Integrator and MergeReceipt baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co44-company-integration:
    name: "CO-44 Company Integrator and MergeReceipt baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co44_company_integration_guard
        run: cargo test -p kiana-core --test co44_company_integration_guard --locked -- --test-threads=1
      - name: Run kiana-domain co44_company_integration
        run: cargo test -p kiana-domain --test co44_company_integration --locked -- --test-threads=1
