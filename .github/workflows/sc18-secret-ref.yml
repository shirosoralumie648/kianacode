name: SC-18 SecretRef and SecretStore boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-ref:
    name: SC-18 secret reference and lease fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run domain credential lease fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run provider SecretStore fixtures
        run: cargo test -p kiana-provider --test ci07_secret_store --locked -- --test-threads=1
      - name: Run Core SecretRef source guard
        run: cargo test -p kiana-core --test sc18_secret_ref_guard --locked -- --test-threads=1
      - name: Compile domain credential target
        run: cargo test -p kiana-domain --test ci07_credential_lease --no-run --locked
      - name: Compile provider SecretStore target
        run: cargo test -p kiana-provider --test ci07_secret_store --no-run --locked
      - name: Compile Core SecretRef guard target
        run: cargo test -p kiana-core --test sc18_secret_ref_guard --no-run --locked
