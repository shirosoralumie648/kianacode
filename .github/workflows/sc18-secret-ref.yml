name: SC-18 SecretRef and SecretStore boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/tests/ci07_secret_store.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "kiana-core/tests/sc18_secret_ref_guard.rs"
      - "docs/roadmap/sc18-secret-ref-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc18-secret-ref.yml"
  pull_request:
    paths:
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/tests/ci07_secret_store.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "kiana-core/tests/sc18_secret_ref_guard.rs"
      - "docs/roadmap/sc18-secret-ref-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc18-secret-ref.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain credential lease fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run provider SecretStore fixtures
        run: cargo test -p kiana-provider --test ci07_secret_store --locked -- --test-threads=1
      - name: Run core SecretRef source guard
        run: cargo test -p kiana-core --test sc18_secret_ref_guard --locked -- --test-threads=1
      - name: Compile SC-18 targets
        run: cargo check --workspace --tests --locked
