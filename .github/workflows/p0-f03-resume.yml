name: P0-F-03 resume material

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/control_plane.rs"
      - "kiana-core/tests/p0_f03_resume_guard.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p0-f03-resume-material-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-f03-resume.yml"
  pull_request:
    paths:
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/control_plane.rs"
      - "kiana-core/tests/p0_f03_resume_guard.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p0-f03-resume-material-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-f03-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P0-F-03 source guards
        run: cargo test -p kiana-core --test p0_f03_resume_guard --locked -- --test-threads=1
      - name: Compile P0-F-03 targets
        run: cargo check --workspace --tests --locked
