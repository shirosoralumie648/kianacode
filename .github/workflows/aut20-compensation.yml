name: AUT-20 compensation plan

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_compensation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_compensation.rs"
      - "kiana-core/src/automation_compensation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_compensation_guard.rs"
      - "docs/roadmap/aut20-compensation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut20-compensation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_compensation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_compensation.rs"
      - "kiana-core/src/automation_compensation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_compensation_guard.rs"
      - "docs/roadmap/aut20-compensation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut20-compensation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compensation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_compensation --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_compensation_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
