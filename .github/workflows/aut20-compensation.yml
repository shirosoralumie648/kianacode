name: AUT-20 compensation workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compensation-admission:
    name: AUT-20 compensation plan, original-instance reference and fresh authorization fence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check

      # Domain contract: reused original permit (flag, identical digest, case variant), stale/zero
      # authorization epoch, original instance/execution/action identity collisions, schema drift,
      # tampered digest and unknown fields all deny before the valid pair fixture.
      - name: Run domain compensation fixtures
        run: cargo test -p kiana-domain --test automation_compensation --locked -- --test-threads=1

      # Admission planning over the existing durable planner: source instance must exist and be
      # Failed/Cancelled, original execution/attempt must be a real node attempt, compensation
      # execution must be the fresh authority execution, duplicate compensation and undeclared
      # compensation nodes are refused, live authority epoch must match, and the source instance
      # is never rewritten. The success fixture is last.
      - name: Run workflow compensation admission fixtures
        run: cargo test -p kiana-workflow --test aut20_compensation_admission --locked -- --test-threads=1

      # Core facade + source guard: read-only forwarding, refusal-code matrix, no Broker/handler
      # effect, fixture ordering, lane/shard wiring.
      - name: Run core compensation source guard
        run: cargo test -p kiana-core --test automation_compensation_guard --locked -- --test-threads=1

      - name: Compile domain compensation target
        run: cargo test -p kiana-domain --test automation_compensation --no-run --locked
      - name: Compile workflow compensation admission target
        run: cargo test -p kiana-workflow --test aut20_compensation_admission --no-run --locked
      - name: Compile core compensation guard target
        run: cargo test -p kiana-core --test automation_compensation_guard --no-run --locked
