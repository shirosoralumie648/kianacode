name: H16 parallel barriers

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/tool_authority.rs"
      - "kiana-domain/src/tool_scheduling.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h16_tool_scheduling.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/h16_parallel_barriers.rs"
      - "kiana-core/tests/h13_invocation_ledger.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-parallel-barriers-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h16-parallel-barriers.yml"
  pull_request:
    paths:
      - "kiana-domain/src/tool_authority.rs"
      - "kiana-domain/src/tool_scheduling.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h16_tool_scheduling.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/h16_parallel_barriers.rs"
      - "kiana-core/tests/h13_invocation_ledger.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-parallel-barriers-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h16-parallel-barriers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-barriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H16 scheduling fixtures
        run: cargo test -p kiana-domain --test h16_tool_scheduling --locked -- --test-threads=1
      - name: Run H16 source guards
        run: cargo test -p kiana-core --test h16_parallel_barriers --locked -- --test-threads=1
      - name: Compile H16 targets
        run: cargo check --workspace --tests --locked
