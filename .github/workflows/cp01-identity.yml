name: CP-01 identity and project scope

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/identity.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp01_identity.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/tests/cp01_identity_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - ".github/workflows/cp01-identity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/identity.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp01_identity.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/tests/cp01_identity_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - ".github/workflows/cp01-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-01 identity fixtures
        run: |
          cargo test -p kiana-domain --test cp01_identity --locked -- --test-threads=1
          cargo test -p kiana-core --test cp01_identity_guard --locked -- --test-threads=1
