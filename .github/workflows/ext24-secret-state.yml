name: EXT-24 extension secret state migration

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/extension_state.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext24_secret_state.rs"
      - "kiana-core/tests/ext24_secret_state_guard.rs"
      - "kiana-daemon/src/extensions.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext24-secret-state-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext24-secret-state.yml"
  pull_request:
    paths:
      - "kiana-domain/src/extension_state.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext24_secret_state.rs"
      - "kiana-core/tests/ext24_secret_state_guard.rs"
      - "kiana-daemon/src/extensions.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext24-secret-state-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext24-secret-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-secret-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-24 domain fixtures
        run: cargo test -p kiana-domain --test ext24_secret_state --locked -- --test-threads=1
      - name: Run EXT-24 source guard
        run: cargo test -p kiana-core --test ext24_secret_state_guard --locked -- --test-threads=1
      - name: Compile EXT-24 daemon target
        run: cargo check -p kiana-daemon --tests --locked
