name: P1-E-01 typed communication and accountability

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/communication.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/handoff.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p1_e01_communication.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/communication.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/tests/p1_e01_communication_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/communication-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-e01-communication.yml"
  pull_request:
    paths:
      - "kiana-domain/src/communication.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/handoff.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p1_e01_communication.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/communication.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/tests/p1_e01_communication_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/communication-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-e01-communication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  communication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-E-01 communication fixtures
        run: cargo test -p kiana-domain --test p1_e01_communication --locked -- --test-threads=1
      - name: Run P1-E-01 source guard
        run: cargo test -p kiana-core --test p1_e01_communication_guard --locked -- --test-threads=1
      - name: Compile communication path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-core -p kiana-protocol --tests --locked
