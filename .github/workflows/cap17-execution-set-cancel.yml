name: CAP-17 execution-set cancellation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/cancellation.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/tests/p0_j1_03_process_group.rs"
      - "kiana-daemon/tests/p0_j1_04_cancel_race.rs"
      - "kiana-daemon/tests/daemon_host.rs"
      - "kiana-core/tests/cap17_execution_set_cancel_guard.rs"
      - "kiana-core/tests/cp15_cancellation_guard.rs"
      - "kiana-core/tests/cp16_handler_stop_guard.rs"
      - "kiana-core/tests/er19_process_handle_guard.rs"
      - "kiana-core/tests/er22_cancel_recovery_guard.rs"
      - "docs/roadmap/cap17-execution-set-cancel-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap17-execution-set-cancel.yml"
  pull_request:
    paths:
      - "kiana-domain/src/cancellation.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/tests/p0_j1_03_process_group.rs"
      - "kiana-daemon/tests/p0_j1_04_cancel_race.rs"
      - "kiana-daemon/tests/daemon_host.rs"
      - "kiana-core/tests/cap17_execution_set_cancel_guard.rs"
      - "kiana-core/tests/cp15_cancellation_guard.rs"
      - "kiana-core/tests/cp16_handler_stop_guard.rs"
      - "kiana-core/tests/er19_process_handle_guard.rs"
      - "kiana-core/tests/er22_cancel_recovery_guard.rs"
      - "docs/roadmap/cap17-execution-set-cancel-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap17-execution-set-cancel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-set-cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run durable cancellation guards
        run: cargo test -p kiana-core --test cp15_cancellation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cp16_handler_stop_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er19_process_handle_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er22_cancel_recovery_guard --locked -- --test-threads=1
      - name: Run cancel race fixtures
        run: cargo test -p kiana-daemon --test p0_j1_04_cancel_race --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test daemon_host cancelling_mid_stream_never_completes_or_emits_a_late_delta --locked -- --test-threads=1
      - name: Run CAP-17 source guard
        run: cargo test -p kiana-core --test cap17_execution_set_cancel_guard --locked -- --test-threads=1
      - name: Compile CAP-17 targets
        run: cargo check --workspace --tests --locked
