name: CAP-17 execution-set cancellation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-set-cancel:
    name: CAP-17 execution-set cancellation fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run durable cancellation guards
        run: cargo test -p kiana-core --test cp15_cancellation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cp16_handler_stop_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er19_process_handle_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er22_cancel_recovery_guard --locked -- --test-threads=1
      - name: Run cancel race fixtures
        run: cargo test -p kiana-daemon --test p0_j1_04_cancel_race --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test daemon_host cancelling_mid_stream_never_completes_or_emits_a_late_delta --locked -- --test-threads=1
      - name: Run CAP-17 source guard
        run: cargo test -p kiana-core --test cap17_execution_set_cancel_guard --locked -- --test-threads=1
      - name: Compile selected Core targets
        run: cargo test -p kiana-core --test cp15_cancellation_guard --no-run --locked
      - run: cargo test -p kiana-core --test cp16_handler_stop_guard --no-run --locked
      - run: cargo test -p kiana-core --test er19_process_handle_guard --no-run --locked
      - run: cargo test -p kiana-core --test er22_cancel_recovery_guard --no-run --locked
      - run: cargo test -p kiana-core --test cap17_execution_set_cancel_guard --no-run --locked
      - name: Compile daemon race target
        run: cargo test -p kiana-daemon --test p0_j1_04_cancel_race --no-run --locked
