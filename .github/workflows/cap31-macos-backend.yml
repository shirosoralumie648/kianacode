name: CAP-31 macOS backend probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-compile-and-guard:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -p kiana-domain -p kiana-ports -p kiana-daemon -- --check
      - name: Run CAP-31 source guard
        run: cargo test -p kiana-core --test cap31_macos_backend_guard --locked -- --test-threads=1
      - name: Run CAP-31 platform disposition fixture
        run: cargo test -p kiana-domain --test cap31_platform_backend --locked -- --test-threads=1
