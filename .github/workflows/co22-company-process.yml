name: "CO-22 deterministic Company ProcessManager baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co22-company-process:
    name: "CO-22 deterministic Company ProcessManager baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co22_company_process_guard
        run: cargo test -p kiana-core --test co22_company_process_guard --locked -- --test-threads=1
      - name: Run kiana-domain co22_company_process
        run: cargo test -p kiana-domain --test co22_company_process --locked -- --test-threads=1
