name: co22-company-process

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_process.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co22_company_process.rs"
      - "kiana-core/src/company_process.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/automation.rs"
      - "kiana-core/tests/co22_company_process_guard.rs"
      - "kiana-workflow/src/durable.rs"
      - "docs/roadmap/co22-company-process-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co22-company-process.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_process.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co22_company_process.rs"
      - "kiana-core/src/company_process.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/automation.rs"
      - "kiana-core/tests/co22_company_process_guard.rs"
      - "kiana-workflow/src/durable.rs"
      - "docs/roadmap/co22-company-process-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co22-company-process.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-22 process fixtures
        run: cargo test -p kiana-domain --test co22_company_process --locked -- --test-threads=1
      - name: Run CO-22 process source guard
        run: cargo test -p kiana-core --test co22_company_process_guard --locked -- --test-threads=1
      - name: Compile CO-22 workflow targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-workflow -p kiana-daemon --tests --locked
