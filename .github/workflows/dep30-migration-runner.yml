name: DEP-30 migration runner

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/migration_runner.rs"
      - "kiana-domain/src/migration_primitives.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep30_migration_runner.rs"
      - "kiana-core/tests/dep30_migration_runner_guard.rs"
      - "docs/roadmap/dep30-migration-runner-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep30-migration-runner.yml"
  pull_request:
    paths:
      - "kiana-domain/src/migration_runner.rs"
      - "kiana-domain/src/migration_primitives.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep30_migration_runner.rs"
      - "kiana-core/tests/dep30_migration_runner_guard.rs"
      - "docs/roadmap/dep30-migration-runner-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep30-migration-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-30 domain fixtures
        run: cargo test -p kiana-domain --test dep30_migration_runner --locked -- --test-threads=1
      - name: Run DEP-30 source guard
        run: cargo test -p kiana-core --test dep30_migration_runner_guard --locked -- --test-threads=1
      - name: Compile DEP-30 targets
        run: cargo check --workspace --tests --locked
