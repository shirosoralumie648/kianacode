name: "OA-20 data governance propagation"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oa20-data-governance:
    name: "OA-20 data governance propagation"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-domain oa20_data_governance
        run: cargo test -p kiana-domain --test oa20_data_governance --locked -- --test-threads=1
      - name: Run kiana-core oa20_data_governance_projection
        run: cargo test -p kiana-core --test oa20_data_governance_projection --locked -- --test-threads=1
      - name: Run kiana-core oa20_data_governance_guard
        run: cargo test -p kiana-core --test oa20_data_governance_guard --locked -- --test-threads=1
      - name: Run kiana-core er29_data_governance regression
        run: cargo test -p kiana-core --test er29_data_governance --locked -- --test-threads=1
      - name: Compile kiana-domain oa20_data_governance
        run: cargo test -p kiana-domain --test oa20_data_governance --no-run --locked
      - name: Compile kiana-core oa20_data_governance_projection
        run: cargo test -p kiana-core --test oa20_data_governance_projection --no-run --locked
      - name: Compile kiana-core oa20_data_governance_guard
        run: cargo test -p kiana-core --test oa20_data_governance_guard --no-run --locked
