name: "EQ-39 baseline registry baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq39-baseline:
    name: "EQ-39 baseline registry baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq39_baseline
        run: cargo test -p kiana-quality --test eq39_baseline --locked -- --test-threads=1
      - name: Run kiana-quality eq39_baseline_guard
        run: cargo test -p kiana-quality --test eq39_baseline_guard --locked -- --test-threads=1
