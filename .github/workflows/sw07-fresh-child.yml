name: SW-07 fresh child materialization

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_child.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_child.rs"
      - "kiana-core/src/swarm_child.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_child_guard.rs"
      - "docs/roadmap/sw07-fresh-child-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw07-fresh-child.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_child.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_child.rs"
      - "kiana-core/src/swarm_child.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_child_guard.rs"
      - "docs/roadmap/sw07-fresh-child-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw07-fresh-child.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-07 domain fixtures
        run: cargo test -p kiana-domain --test swarm_child --locked -- --test-threads=1
      - name: Run SW-07 Core source guard
        run: cargo test -p kiana-core --test swarm_child_guard --locked -- --test-threads=1
      - name: Compile SW-07 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
