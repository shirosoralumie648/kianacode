name: INT-24 connector ingress

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_ingress.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_ingress.rs"
      - "kiana-daemon/src/connector_ingress.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/int24_connector_ingress.rs"
      - "kiana-daemon/tests/int24_connector_ingress_guard.rs"
      - "docs/roadmap/int24-ingress-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int24-ingress.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_ingress.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_ingress.rs"
      - "kiana-daemon/src/connector_ingress.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/int24_connector_ingress.rs"
      - "kiana-daemon/tests/int24_connector_ingress_guard.rs"
      - "docs/roadmap/int24-ingress-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int24-ingress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-24 domain fixtures
        run: cargo test -p kiana-domain --test connector_ingress --locked -- --test-threads=1
      - name: Run INT-24 daemon fixtures
        run: cargo test -p kiana-daemon --test int24_connector_ingress --locked -- --test-threads=1
      - name: Run INT-24 source guard
        run: cargo test -p kiana-daemon --test int24_connector_ingress_guard --locked -- --test-threads=1
      - name: Compile INT-24 targets
        run: cargo check -p kiana-domain -p kiana-daemon --tests --locked
