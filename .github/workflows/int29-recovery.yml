name: INT-29 connector recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_recovery.rs"
      - "kiana-domain/src/connector_dispatch.rs"
      - "kiana-domain/src/connector_cancellation.rs"
      - "kiana-domain/src/connector_reservation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_recovery.rs"
      - "kiana-core/src/connector_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int29_connector_recovery_guard.rs"
      - "docs/roadmap/int29-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int29-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_recovery.rs"
      - "kiana-domain/src/connector_dispatch.rs"
      - "kiana-domain/src/connector_cancellation.rs"
      - "kiana-domain/src/connector_reservation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_recovery.rs"
      - "kiana-core/src/connector_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int29_connector_recovery_guard.rs"
      - "docs/roadmap/int29-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int29-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-29 domain fixtures
        run: cargo test -p kiana-domain --test connector_recovery --locked -- --test-threads=1
      - name: Run INT-29 Core source guard
        run: cargo test -p kiana-core --test int29_connector_recovery_guard --locked -- --test-threads=1
      - name: Compile INT-29 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
