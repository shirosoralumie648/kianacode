name: DEP-07 storage preflight

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/storage_preflight.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep07_storage_preflight.rs"
      - "kiana-core/src/storage_preflight.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep07_storage_preflight_guard.rs"
      - "kiana-daemon/src/storage.rs"
      - "kiana-daemon/tests/dep07_storage_adapter_guard.rs"
      - "docs/roadmap/dep07-storage-preflight-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep07-storage-preflight.yml"
  pull_request:
    paths:
      - "kiana-domain/src/storage_preflight.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep07_storage_preflight.rs"
      - "kiana-core/src/storage_preflight.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep07_storage_preflight_guard.rs"
      - "kiana-daemon/src/storage.rs"
      - "kiana-daemon/tests/dep07_storage_adapter_guard.rs"
      - "docs/roadmap/dep07-storage-preflight-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep07-storage-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-07 domain fixtures
        run: cargo test -p kiana-domain --test dep07_storage_preflight --locked -- --test-threads=1
      - name: Run DEP-07 source guard
        run: cargo test -p kiana-core --test dep07_storage_preflight_guard --locked -- --test-threads=1
      - name: Run DEP-07 daemon adapter guard
        run: cargo test -p kiana-daemon --test dep07_storage_adapter_guard --locked -- --test-threads=1
      - name: Compile DEP-07 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
