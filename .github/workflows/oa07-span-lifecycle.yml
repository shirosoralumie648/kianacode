name: OA-07 Span Lifecycle

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  span-lifecycle:
    name: Run/Turn/Invocation span projection guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run OA-07 span lifecycle tests
        run: cargo test -p kiana-core --test oa07_span_lifecycle --locked -- --test-threads=1
