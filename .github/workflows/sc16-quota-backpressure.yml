name: SC-16 quota and backpressure boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_budgets.rs"
      - "kiana-domain/src/billing_quota.rs"
      - "kiana-domain/src/billing_reservation.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/src/observability_queue.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-runner/src/budget.rs"
      - "kiana-core/tests/sc16_quota_backpressure.rs"
      - "kiana-core/tests/sc16_quota_backpressure_guard.rs"
      - "docs/roadmap/sc16-quota-backpressure-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc16-quota-backpressure.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_budgets.rs"
      - "kiana-domain/src/billing_quota.rs"
      - "kiana-domain/src/billing_reservation.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/src/observability_queue.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-runner/src/budget.rs"
      - "kiana-core/tests/sc16_quota_backpressure.rs"
      - "kiana-core/tests/sc16_quota_backpressure_guard.rs"
      - "docs/roadmap/sc16-quota-backpressure-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc16-quota-backpressure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-backpressure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-16 quota and queue fixtures
        run: cargo test -p kiana-core --test sc16_quota_backpressure --locked -- --test-threads=1
      - name: Run SC-16 source guard
        run: cargo test -p kiana-core --test sc16_quota_backpressure_guard --locked -- --test-threads=1
      - name: Compile SC-16 targets
        run: cargo check --workspace --tests --locked
