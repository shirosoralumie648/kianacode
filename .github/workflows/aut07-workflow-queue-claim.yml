name: AUT-07 workflow queue claim contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/workflow_queue_claim.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/aut07_workflow_queue_claim.rs"
      - "kiana-core/tests/aut07_workflow_queue_claim_guard.rs"
      - "docs/roadmap/aut07-workflow-queue-claim-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut07-workflow-queue-claim.yml"
  pull_request:
    paths:
      - "kiana-domain/src/workflow_queue_claim.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/aut07_workflow_queue_claim.rs"
      - "kiana-core/tests/aut07_workflow_queue_claim_guard.rs"
      - "docs/roadmap/aut07-workflow-queue-claim-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut07-workflow-queue-claim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-queue-claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run AUT-07 claim fixture
        run: cargo test -p kiana-domain --test aut07_workflow_queue_claim --locked -- --test-threads=1
      - name: Run AUT-07 source guard
        run: cargo test -p kiana-core --test aut07_workflow_queue_claim_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
