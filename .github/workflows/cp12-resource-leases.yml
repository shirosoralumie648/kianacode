name: CP-12 resource leases and fencing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-leases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CP-12 resource lease fixtures
        run: cargo test -p kiana-domain --test cp12_resource_lease --locked -- --test-threads=1
      - name: Run CP-12 source guard
        run: cargo test -p kiana-core --test cp12_resource_guard --locked -- --test-threads=1
      - name: Compile CP-12 targets
        run: cargo check --workspace --tests --locked
