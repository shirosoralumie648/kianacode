name: CP-12 resource leases and fencing

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/resource_leases.rs"
      - "kiana-domain/src/paths.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp12_resource_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/src/resource_leases.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/cp12_resource_guard.rs"
      - "docs/roadmap/control-plane-resource-lease-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp12-resource-leases.yml"
  pull_request:
    paths:
      - "kiana-domain/src/resource_leases.rs"
      - "kiana-domain/src/paths.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp12_resource_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/sessions.rs"
      - "kiana-core/src/resource_leases.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/cp12_resource_guard.rs"
      - "docs/roadmap/control-plane-resource-lease-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp12-resource-leases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-leases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-12 resource lease fixtures
        run: cargo test -p kiana-domain --test cp12_resource_lease --locked -- --test-threads=1
      - name: Run CP-12 source guard
        run: cargo test -p kiana-core --test cp12_resource_guard --locked -- --test-threads=1
      - name: Compile CP-12 targets
        run: cargo check --workspace --tests --locked
