name: EQ-09 isolated evaluation runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EQ-09 daemon fixtures
        run: cargo test -p kiana-daemon --test eq09_eval_runtime --locked -- --test-threads=1
      - name: Run EQ-09 source guard
        run: cargo test -p kiana-core --test eq09_eval_runtime_guard --locked -- --test-threads=1
      - name: Compile EQ-09 daemon target
        run: cargo test -p kiana-daemon --test eq09_eval_runtime --no-run --locked
      - name: Compile EQ-09 Core guard target
        run: cargo test -p kiana-core --test eq09_eval_runtime_guard --no-run --locked
