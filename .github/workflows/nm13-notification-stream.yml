name: NM-13 notification stream bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-stream:
    name: NM-13 run stream bridge, merge window and terminal query fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-13 notification stream bridge fixtures
        run: cargo test -p kiana-daemon --test nm13_notification_stream --locked -- --test-threads=1
      - name: Run NM-13 source guard
        run: cargo test -p kiana-daemon --test nm13_notification_stream_guard --locked -- --test-threads=1
      - name: Compile NM-13 notification stream bridge target
        run: cargo test -p kiana-daemon --test nm13_notification_stream --no-run --locked
      - name: Compile NM-13 source guard target
        run: cargo test -p kiana-daemon --test nm13_notification_stream_guard --no-run --locked
