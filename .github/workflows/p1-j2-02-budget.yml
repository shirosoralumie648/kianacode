name: P1-J2-02 context budget

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-domain/tests/p1_j2_02_budget.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/tests/p1_j2_02_budget_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-02-budget-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-02-budget.yml"
  pull_request:
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-domain/tests/p1_j2_02_budget.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/tests/p1_j2_02_budget_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-02-budget-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-02-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-J2-02 domain fixtures
        run: cargo test -p kiana-domain --test p1_j2_02_budget --locked -- --test-threads=1
      - name: Run P1-J2-02 core guard
        run: cargo test -p kiana-core --test p1_j2_02_budget_guard --locked -- --test-threads=1
      - name: Compile P1-J2-02 targets
        run: cargo check --workspace --tests --locked
