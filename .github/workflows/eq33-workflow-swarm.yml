name: "EQ-33 workflow and swarm evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq33-workflow-swarm:
    name: "EQ-33 workflow and swarm evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq33_workflow
        run: cargo test -p kiana-quality --test eq33_workflow --locked -- --test-threads=1
      - name: Run kiana-quality eq33_workflow_guard
        run: cargo test -p kiana-quality --test eq33_workflow_guard --locked -- --test-threads=1
