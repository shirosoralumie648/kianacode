name: int04-connector-registry

on:
  push:
    paths:
      - 'kiana-domain/src/connector_registry.rs'
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int04_connector_registry.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int04_connector_registry_guard.rs'
      - '.github/workflows/int04-connector-registry.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/connector_registry.rs'
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int04_connector_registry.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int04_connector_registry_guard.rs'
      - '.github/workflows/int04-connector-registry.yml'

permissions:
  contents: read

jobs:
  connector-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test int04_connector_registry --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test int04_connector_registry_guard --locked -- --test-threads=1
