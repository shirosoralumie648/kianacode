name: P2-K6-01 reliability and reconciliation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/tests/p2_k6_01_reliability.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/tests/p2_k6_01_reliability.rs"
      - "kiana-core/tests/oa19_incident_projection.rs"
      - "kiana-core/tests/er10_resource_projection.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k6-01-reliability-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k6-01-reliability.yml"
  pull_request:
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/tests/p2_k6_01_reliability.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/tests/p2_k6_01_reliability.rs"
      - "kiana-core/tests/oa19_incident_projection.rs"
      - "kiana-core/tests/er10_resource_projection.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k6-01-reliability-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k6-01-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run six failure recovery fixture
        run: cargo test -p kiana-domain --test p2_k6_01_reliability --locked -- --test-threads=1
      - name: Run reliability source guard
        run: cargo test -p kiana-core --test p2_k6_01_reliability --locked -- --test-threads=1
      - name: Run observability incident regression
        run: cargo test -p kiana-core --test oa19_incident_projection --locked -- --test-threads=1
      - name: Run resource quarantine regression
        run: cargo test -p kiana-core --test er10_resource_projection --locked -- --test-threads=1
      - name: Compile P2-K6-01 targets
        run: cargo check --workspace --tests --locked
