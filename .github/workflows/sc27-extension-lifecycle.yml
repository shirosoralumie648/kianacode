name: sc27-extension-lifecycle

on:
  push:
    paths:
      - 'kiana-domain/src/extension_lifecycle.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc27_extension_lifecycle.rs'
      - 'kiana-daemon/src/extensions.rs'
      - 'kiana-daemon/src/pre_tool_hooks.rs'
      - 'kiana-daemon/src/harness_sandbox.rs'
      - 'kiana-daemon/tests/sc27_extension_lifecycle_guard.rs'
      - '.github/workflows/sc27-extension-lifecycle.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/extension_lifecycle.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc27_extension_lifecycle.rs'
      - 'kiana-daemon/src/extensions.rs'
      - 'kiana-daemon/src/pre_tool_hooks.rs'
      - 'kiana-daemon/src/harness_sandbox.rs'
      - 'kiana-daemon/tests/sc27_extension_lifecycle_guard.rs'
      - '.github/workflows/sc27-extension-lifecycle.yml'

jobs:
  extension-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked --offline
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test sc27_extension_lifecycle --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test sc27_extension_lifecycle_guard --locked -- --test-threads=1
