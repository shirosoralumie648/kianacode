name: cm34-embedding-rotation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/embedding_manifest.rs"
      - "kiana-domain/src/index_generation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm34_embedding_rotation.rs"
      - "kiana-query/src/index.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm34_embedding_rotation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm34-embedding-rotation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm34-embedding-rotation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/embedding_manifest.rs"
      - "kiana-domain/src/index_generation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm34_embedding_rotation.rs"
      - "kiana-query/src/index.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm34_embedding_rotation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm34-embedding-rotation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm34-embedding-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-34 embedding fixtures
        run: cargo test -p kiana-domain --test cm34_embedding_rotation --locked -- --test-threads=1
      - name: Run CM-34 source guard
        run: cargo test -p kiana-core --test cm34_embedding_rotation_guard --locked -- --test-threads=1
