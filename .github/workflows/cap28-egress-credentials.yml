name: CAP-28 egress and credentials

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/network_policy.rs"
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/oauth.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-provider/src/**"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/cap28_egress_credentials_guard.rs"
      - "kiana-core/tests/sc14_network_policy_guard.rs"
      - "kiana-core/tests/sc18_secret_ref_guard.rs"
      - "kiana-core/tests/sc19_secret_rotation_guard.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "kiana-domain/tests/sc14_network_policy.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "docs/roadmap/cap28-egress-credentials-baseline.md"
      - "docs/roadmap/capability.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap28-egress-credentials.yml"
  pull_request:
    paths:
      - "kiana-domain/src/network_policy.rs"
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/oauth.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-provider/src/**"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/cap28_egress_credentials_guard.rs"
      - "kiana-core/tests/sc14_network_policy_guard.rs"
      - "kiana-core/tests/sc18_secret_ref_guard.rs"
      - "kiana-core/tests/sc19_secret_rotation_guard.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "kiana-domain/tests/sc14_network_policy.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "docs/roadmap/cap28-egress-credentials-baseline.md"
      - "docs/roadmap/capability.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap28-egress-credentials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run network policy fixtures
        run: cargo test -p kiana-domain --test sc14_network_policy --locked -- --test-threads=1
      - name: Run credential and OAuth fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run existing source guards
        run: cargo test -p kiana-core --test sc14_network_policy_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc18_secret_ref_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc19_secret_rotation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test ci07_secret_store --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test ci09_oauth_guard --locked -- --test-threads=1
      - name: Run CAP-28 source guard
        run: cargo test -p kiana-core --test cap28_egress_credentials_guard --locked -- --test-threads=1
      - name: Compile CAP-28 targets
        run: cargo check --workspace --tests --locked
