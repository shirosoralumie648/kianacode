name: EXT-05 extension snapshot invalidation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-skills/src/snapshot.rs"
      - "kiana-skills/src/source_resolver.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/src/dynamic.rs"
      - "kiana-skills/tests/ext05_snapshot.rs"
      - "kiana-domain/src/extension_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/snapshot-invalidation-baseline.md"
      - ".github/workflows/ext05-snapshot.yml"
  pull_request:
    paths:
      - "kiana-skills/src/snapshot.rs"
      - "kiana-skills/src/source_resolver.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/src/dynamic.rs"
      - "kiana-skills/tests/ext05_snapshot.rs"
      - "kiana-domain/src/extension_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/snapshot-invalidation-baseline.md"
      - ".github/workflows/ext05-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-05 snapshot fixtures
        run: cargo test -p kiana-skills --test ext05_snapshot --locked -- --test-threads=1
      - name: Compile EXT-05 snapshot target
        run: cargo check -p kiana-skills --tests --locked
