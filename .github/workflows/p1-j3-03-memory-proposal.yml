name: P1-J3-03 memory proposals

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/tests/p1_j3_03_memory_proposal.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/tests/p1_j3_03_memory_proposal_guard.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j3-03-memory-proposal-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j3-03-memory-proposal.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/tests/p1_j3_03_memory_proposal.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/tests/p1_j3_03_memory_proposal_guard.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j3-03-memory-proposal-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j3-03-memory-proposal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-J3-03 domain fixtures
        run: cargo test -p kiana-domain --test p1_j3_03_memory_proposal --locked -- --test-threads=1
      - name: Run P1-J3-03 core guard
        run: cargo test -p kiana-core --test p1_j3_03_memory_proposal_guard --locked -- --test-threads=1
      - name: Compile P1-J3-03 targets
        run: cargo check --workspace --tests --locked
