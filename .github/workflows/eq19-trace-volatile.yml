name: EQ-19 volatile trace normalization

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-volatile-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq19-trace-volatile.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-volatile-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq19-trace-volatile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-volatile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run volatile normalization fixtures
        run: cargo test -p kiana-quality --test eq19_volatile --locked -- --test-threads=1
      - name: Run volatile source guard
        run: cargo test -p kiana-quality --test eq19_quality_guard --locked -- --test-threads=1
      - name: Compile EQ-19 targets
        run: cargo check --workspace --tests --locked
