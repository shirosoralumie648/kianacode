name: "UI-29 ACP/IDE session adapter 基线"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui29-acp-session:
    name: "UI-29 ACP/IDE session adapter 基线"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui29_acp_adapter
        run: cargo test -p kiana-client --test ui29_acp_adapter --locked -- --test-threads=1
