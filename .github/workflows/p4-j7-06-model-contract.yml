name: P4-J7-06 provider-neutral model contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/p4_j7_06_model_contract.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-runner/src/model.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_06_model_contract_guard.rs"
      - "docs/roadmap/provider-model-contract-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-06-model-contract.yml"
  pull_request:
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/p4_j7_06_model_contract.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-runner/src/model.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_06_model_contract_guard.rs"
      - "docs/roadmap/provider-model-contract-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-06-model-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-06 model fixtures
        run: cargo test -p kiana-domain --test p4_j7_06_model_contract --locked -- --test-threads=1
      - name: Run P4-J7-06 source guard
        run: cargo test -p kiana-core --test p4_j7_06_model_contract_guard --locked -- --test-threads=1
      - name: Compile provider-neutral model path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-runner -p kiana-provider -p kiana-core --tests --locked
