name: "UI-10 CLI command and output normalization"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui10-cli-contract:
    name: "UI-10 CLI command and output normalization"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the CLI command and output contract fixtures
        run: cargo test -p kiana-client --test ui10_cli_contract --locked -- --test-threads=1
      - name: Run the CLI entrypoint boundary guard
        run: cargo test -p kiana-entrypoints --test ui10_cli_boundary_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-client -p kiana-entrypoints --no-run --locked
