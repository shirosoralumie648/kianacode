name: NM-10 notification actions

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/notification_actions.rs"
      - "kiana-domain/src/notifications.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm10_notification_actions.rs"
      - "kiana-domain/tests/fixtures/nm10-notification-actions.json"
      - "kiana-core/src/notification_action.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/nm10_notification_action.rs"
      - "kiana-core/tests/nm10_notification_action_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/nm10-notification-actions-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm10-notification-actions.yml"
  pull_request:
    paths:
      - "kiana-domain/src/notification_actions.rs"
      - "kiana-domain/src/notifications.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm10_notification_actions.rs"
      - "kiana-domain/tests/fixtures/nm10-notification-actions.json"
      - "kiana-core/src/notification_action.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/nm10_notification_action.rs"
      - "kiana-core/tests/nm10_notification_action_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/nm10-notification-actions-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm10-notification-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain action command fixtures
        run: cargo test -p kiana-domain --test nm10_notification_actions --locked -- --test-threads=1
      - name: Run ControlPlane admission fixtures
        run: cargo test -p kiana-core --test nm10_notification_action --locked -- --test-threads=1
      - name: Run action source guard
        run: cargo test -p kiana-core --test nm10_notification_action_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
