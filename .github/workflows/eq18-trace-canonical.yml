name: EQ-18 canonical trace

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-canonical-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq18-trace-canonical.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-canonical-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq18-trace-canonical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run canonical trace fixtures
        run: cargo test -p kiana-quality --test eq18_canonical --locked -- --test-threads=1
      - name: Run canonical source guard
        run: cargo test -p kiana-quality --test eq18_quality_guard --locked -- --test-threads=1
      - name: Compile EQ-18 targets
        run: cargo check --workspace --tests --locked
