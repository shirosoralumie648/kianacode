name: NM-20 notification chain fault injection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-faults:
    name: NM-20 fault injection, capacity and security over the notification chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-20 classification matrix (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_faults --locked -- --test-threads=1
      - name: Run NM-20 classification matrix source guard (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_faults_guard --locked -- --test-threads=1
      - name: Run NM-20 driving fault harness (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_fault_harness --locked -- --test-threads=1
      - name: Run NM-20 driving fault harness source guard (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_fault_harness_guard --locked -- --test-threads=1
      - name: Run NM-20 channel/UI fault fixtures (kiana-daemon)
        run: cargo test -p kiana-daemon --test nm20_notification_channel_faults --locked -- --test-threads=1
      - name: Run NM-20 channel/UI fault source guard (kiana-daemon)
        run: cargo test -p kiana-daemon --test nm20_notification_channel_faults_guard --locked -- --test-threads=1
      - name: Compile NM-20 driving fault harness (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_fault_harness --no-run --locked
      - name: Compile NM-20 driving fault harness source guard (kiana-core)
        run: cargo test -p kiana-core --test nm20_notification_fault_harness_guard --no-run --locked
      - name: Compile NM-20 channel/UI fault fixtures (kiana-daemon)
        run: cargo test -p kiana-daemon --test nm20_notification_channel_faults --no-run --locked
      - name: Compile NM-20 channel/UI fault source guard (kiana-daemon)
        run: cargo test -p kiana-daemon --test nm20_notification_channel_faults_guard --no-run --locked
