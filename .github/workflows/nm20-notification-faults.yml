name: NM-20 notification fault and capacity matrix

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_faults.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_faults.rs"
      - "kiana-core/tests/fixtures/nm20-notification-faults.json"
      - "kiana-core/tests/nm20_notification_faults.rs"
      - "kiana-core/tests/nm20_notification_faults_guard.rs"
      - "docs/roadmap/nm20-notification-faults-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm20-notification-faults.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_faults.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_faults.rs"
      - "kiana-core/tests/fixtures/nm20-notification-faults.json"
      - "kiana-core/tests/nm20_notification_faults.rs"
      - "kiana-core/tests/nm20_notification_faults_guard.rs"
      - "docs/roadmap/nm20-notification-faults-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm20-notification-faults.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-faults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run notification fault matrix fixtures
        run: cargo test -p kiana-core --test nm20_notification_faults --locked -- --test-threads=1
      - name: Run notification fault source guard
        run: cargo test -p kiana-core --test nm20_notification_faults_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
