name: DEP-14 observability evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-14 domain fixtures
        run: cargo test -p kiana-domain --test dep14_observability --locked -- --test-threads=1
      - name: Run DEP-14 Core guard
        run: cargo test -p kiana-core --test dep14_observability_guard --locked -- --test-threads=1
      - name: Run DEP-14 daemon route guard
        run: cargo test -p kiana-daemon --test dep14_observability_route_guard --locked -- --test-threads=1
      - name: Compile DEP-14 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
