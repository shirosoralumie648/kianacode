name: DEP-14 observability evidence

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_observability.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/audit.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep14_observability.rs"
      - "kiana-core/src/deployment_observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep14_observability_guard.rs"
      - "kiana-daemon/src/deployment_observability.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep14_observability_route_guard.rs"
      - "docs/roadmap/dep14-observability-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep14-observability.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_observability.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/audit.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep14_observability.rs"
      - "kiana-core/src/deployment_observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep14_observability_guard.rs"
      - "kiana-daemon/src/deployment_observability.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep14_observability_route_guard.rs"
      - "docs/roadmap/dep14-observability-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep14-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-14 domain fixtures
        run: cargo test -p kiana-domain --test dep14_observability --locked -- --test-threads=1
      - name: Run DEP-14 Core guard
        run: cargo test -p kiana-core --test dep14_observability_guard --locked -- --test-threads=1
      - name: Run DEP-14 daemon route guard
        run: cargo test -p kiana-daemon --test dep14_observability_route_guard --locked -- --test-threads=1
      - name: Compile DEP-14 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
