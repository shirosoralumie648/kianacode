name: cm22-memory-acl

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_acl.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm22_memory_acl.rs"
      - "kiana-core/tests/cm22_memory_acl_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm22-memory-acl-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm22-memory-acl.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_acl.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm22_memory_acl.rs"
      - "kiana-core/tests/cm22_memory_acl_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm22-memory-acl-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm22-memory-acl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-22 memory ACL fixtures
        run: cargo test -p kiana-domain --test cm22_memory_acl --locked -- --test-threads=1
      - name: Run CM-22 source guard
        run: cargo test -p kiana-core --test cm22_memory_acl_guard --locked -- --test-threads=1
