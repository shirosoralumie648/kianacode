name: CI-09 OAuth and workload identity lifecycle

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "docs/roadmap/ci09-oauth-lifecycle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci09-oauth-lifecycle.yml"
  pull_request:
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "docs/roadmap/ci09-oauth-lifecycle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci09-oauth-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain OAuth contract fixtures
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run provider PKCE and refresh fixtures
        run: cargo test -p kiana-provider --lib oauth::tests --locked -- --test-threads=1
      - name: Run OAuth source guard
        run: cargo test -p kiana-core --test ci09_oauth_guard --locked -- --test-threads=1
      - name: Compile CI-09 targets
        run: cargo check --workspace --tests --locked
