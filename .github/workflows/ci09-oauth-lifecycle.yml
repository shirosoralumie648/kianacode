name: CI-09 OAuth and workload identity lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-lifecycle:
    name: OAuth and workload identity fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CI-09 domain OAuth contract fixtures
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run CI-09 provider OAuth fixtures
        run: cargo test -p kiana-provider --lib oauth::tests --locked -- --test-threads=1
      - name: Run CI-09 core source guard
        run: cargo test -p kiana-core --test ci09_oauth_guard --locked -- --test-threads=1
      - name: Compile CI-09 domain target
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --no-run --locked
      - name: Compile CI-09 provider target
        run: cargo test -p kiana-provider --lib oauth::tests --no-run --locked
      - name: Compile CI-09 core target
        run: cargo test -p kiana-core --test ci09_oauth_guard --no-run --locked
