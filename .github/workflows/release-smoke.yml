name: Release Smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Record build inputs
        shell: bash
        run: |
          mkdir -p dist
          export TOOLCHAIN_VERSION=$(rustc --version | awk '{print $2}')
          export CARGO_LOCK_HASH=$(sha256sum Cargo.lock | awk '{print $1}')
          export SOURCE_HASH=$(git rev-parse HEAD)
          python3 scripts/record-build-inputs.py
      - run: bash scripts/release-preflight.sh --local-rc
      - run: bash scripts/release-smoke.sh
