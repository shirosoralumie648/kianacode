name: Release Smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Record build inputs
        shell: bash
        run: |
          mkdir -p dist
          toolchain_version=$(rustc --version | awk '{print $2}')
          cargo_lock_hash=$(sha256sum Cargo.lock | awk '{print $1}')
          source_hash=$(git rev-parse HEAD)
          python3 - <<PY
import json, os, datetime
record = {
    "schema": "kiana.build-inputs.v1",
    "toolchain_channel": "stable",
    "toolchain_version": os.environ["TOOLCHAIN_VERSION"],
    "cargo_lock_hash": os.environ["CARGO_LOCK_HASH"],
    "source_hash": os.environ["SOURCE_HASH"],
    "build_timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
    "ci_run_id": os.environ.get("GITHUB_RUN_ID", ""),
}
open("dist/build-inputs.json", "w").write(json.dumps(record, indent=2, sort_keys=True) + "\n")
print(f"build-inputs recorded: toolchain={record['toolchain_version']} source={record['source_hash'][:8]}")
PY
        env:
          TOOLCHAIN_VERSION: ${{ env.toolchain_version }}
          CARGO_LOCK_HASH: ${{ env.cargo_lock_hash }}
          SOURCE_HASH: ${{ env.source_hash }}
      - run: bash scripts/release-preflight.sh --local-rc
      - run: bash scripts/release-smoke.sh
