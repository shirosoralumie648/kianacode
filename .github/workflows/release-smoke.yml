name: Release Smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap for sandboxed shell tests
        run: |
          # runner 镜像自带的第三方源（如 chrome）在发布窗口会 Hash Sum mismatch，
          # 但那只是"该源索引用旧版本"，官方源索引不受影响；测试只需要官方源里的
          # bubblewrap。所以 update 失败不终止任务；真装不上时下面的 install 会
          # 以明确错误失败（仍然 fail-closed）。
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 默认限制非特权 user namespace，会让 bwrap 直接失败
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fetch --locked
      - name: Install compliance tools (cargo-deny)
        run: |
          bash scripts/install-compliance-tools.sh
          echo "$PWD/target/compliance-tools/bin" >> "$GITHUB_PATH"
      - name: Record build inputs
        shell: bash
        run: |
          mkdir -p dist
          export TOOLCHAIN_VERSION=$(rustc --version | awk '{print $2}')
          export CARGO_LOCK_HASH=$(sha256sum Cargo.lock | awk '{print $1}')
          export SOURCE_HASH=$(git rev-parse HEAD)
          python3 scripts/record-build-inputs.py
      - name: Static checks (clippy)
        # AGENTS.md §2 documents clippy as a build gate; run it in CI so local
        # checkouts are not the only place it can catch a deny-by-default error.
        run: cargo clippy --workspace --all-targets --locked --offline
      - run: bash scripts/release-preflight.sh --local-rc
      - run: bash scripts/release-smoke.sh
      # AGENTS.md §2 gates that no workflow ran before. release-smoke.sh already
      # built target/release/kiana, so the smokes reuse it instead of rebuilding.
      - name: Harness golden smoke (cassette, local_behavior)
        run: KIANA_BIN="$PWD/target/release/kiana" bash scripts/harness-golden-smoke.sh
      - name: v1.0 workbench smoke (folder workbench on DaemonHost)
        run: KIANA_BIN="$PWD/target/release/kiana" bash scripts/v10-workbench-smoke.sh
      - name: v1.0 P0 closeout smoke (matrix rows + NOTICE)
        run: bash scripts/v10-p0-closeout-smoke.sh
