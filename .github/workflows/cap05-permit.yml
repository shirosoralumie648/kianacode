name: CAP-05 permit verification and single dispatch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CAP-05 verifier and Broker effect fixtures
        run: cargo test -p kiana-core --test cap05_permit --locked -- --test-threads=1
      - name: Run shared CP-13 dispatch barrier guard
        run: cargo test -p kiana-core --test cp13_dispatch_guard --locked -- --test-threads=1
      - name: Compile CAP-05 targets
        run: cargo check --workspace --tests --locked
