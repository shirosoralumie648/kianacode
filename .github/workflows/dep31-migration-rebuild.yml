name: DEP-31 migration rebuild

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/migration_rebuild.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep31_migration_rebuild.rs"
      - "kiana-core/tests/dep31_migration_rebuild_guard.rs"
      - "docs/roadmap/dep31-migration-rebuild-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep31-migration-rebuild.yml"
  pull_request:
    paths:
      - "kiana-domain/src/migration_rebuild.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep31_migration_rebuild.rs"
      - "kiana-core/tests/dep31_migration_rebuild_guard.rs"
      - "docs/roadmap/dep31-migration-rebuild-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep31-migration-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-31 domain fixtures
        run: cargo test -p kiana-domain --test dep31_migration_rebuild --locked -- --test-threads=1
      - name: Run DEP-31 source guard
        run: cargo test -p kiana-core --test dep31_migration_rebuild_guard --locked -- --test-threads=1
      - name: Compile DEP-31 targets
        run: cargo check --workspace --tests --locked
