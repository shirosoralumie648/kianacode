name: "INT-15 connector policy baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int15-connector-policy:
    name: "INT-15 connector policy baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # R0--R4 mapping fixtures: read-only allow, R2 data grant, R3 once approval/digest,
      # R4 default deny, declared-risk downgrade and stale epoch denials.
      - name: Run domain connector policy fixtures
        run: cargo test -p kiana-domain --test int15_connector_policy --locked -- --test-threads=1
      # Policy spine fixtures: the same mapping reaches Allow/Ask/Deny through the existing
      # DefaultPolicyEngine and never becomes an approval gate for R4.
      - name: Run policy connector policy fixtures
        run: cargo test -p kiana-policy --test int15_connector_policy --locked -- --test-threads=1
      # Daemon behaviour through the production DaemonHost → ControlPlane → Broker → EventStore
      # path: deny-first with zero dispatch, R3 final-payload approval consumed once, payload
      # bound to the exact staged request and read-only invokes allowed without approval.
      - name: Run daemon connector policy behaviour fixtures
        run: cargo test -p kiana-daemon --test int15_connector_policy --locked -- --test-threads=1
      - name: Run core connector policy source guard
        run: cargo test -p kiana-core --test int15_connector_policy_guard --locked -- --test-threads=1

      - name: Compile domain connector policy target
        run: cargo test -p kiana-domain --test int15_connector_policy --no-run --locked
      - name: Compile policy connector policy target
        run: cargo test -p kiana-policy --test int15_connector_policy --no-run --locked
      - name: Compile daemon connector policy target
        run: cargo test -p kiana-daemon --test int15_connector_policy --no-run --locked
      - name: Compile core connector policy guard target
        run: cargo test -p kiana-core --test int15_connector_policy_guard --no-run --locked
