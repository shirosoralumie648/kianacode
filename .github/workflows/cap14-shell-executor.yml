name: CAP-14 typed shell executor

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-daemon/src/shell_plan.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-core/tests/cap14_shell_executor_guard.rs"
      - "docs/roadmap/cap14-shell-executor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap14-shell-executor.yml"
  pull_request:
    paths:
      - "kiana-daemon/src/shell_plan.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-core/tests/cap14_shell_executor_guard.rs"
      - "docs/roadmap/cap14-shell-executor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap14-shell-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run typed shell-plan fixtures
        run: cargo test -p kiana-daemon --lib shell_plan --locked -- --test-threads=1
      - name: Run focused shell regression
        run: cargo test -p kiana-daemon --lib shell_exec_rejects_workdir_escape --locked -- --test-threads=1
      - name: Run CAP-14 source guard
        run: cargo test -p kiana-core --test cap14_shell_executor_guard --locked -- --test-threads=1
      - name: Compile CAP-14 targets
        run: cargo check --workspace --tests --locked
