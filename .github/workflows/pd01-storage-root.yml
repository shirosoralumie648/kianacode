name: PD-01 storage root and identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run PD-01 domain storage fixtures
        run: cargo test -p kiana-domain --test pd01_storage --locked -- --test-threads=1
      - name: Run PD-01 daemon storage fixtures
        run: cargo test -p kiana-daemon --test pd01_storage --locked -- --test-threads=1
      - name: Run PD-01 source guard
        run: cargo test -p kiana-core --test pd01_storage_guard --locked -- --test-threads=1
      - name: Compile PD-01 domain target
        run: cargo test -p kiana-domain --test pd01_storage --no-run --locked
      - name: Compile PD-01 daemon target
        run: cargo test -p kiana-daemon --test pd01_storage --no-run --locked
      - name: Compile PD-01 Core guard target
        run: cargo test -p kiana-core --test pd01_storage_guard --no-run --locked
