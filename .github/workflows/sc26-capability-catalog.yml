name: sc26-capability-catalog

on:
  push:
    paths:
      - 'kiana-domain/src/capability_catalog.rs'
      - 'kiana-domain/src/extensions.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc26_capability_catalog.rs'
      - 'kiana-domain/tests/sc26_capability_catalog_guard.rs'
      - '.github/workflows/sc26-capability-catalog.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/capability_catalog.rs'
      - 'kiana-domain/src/extensions.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc26_capability_catalog.rs'
      - 'kiana-domain/tests/sc26_capability_catalog_guard.rs'
      - '.github/workflows/sc26-capability-catalog.yml'

jobs:
  capability-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked --offline
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test sc26_capability_catalog --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test sc26_capability_catalog_guard --locked -- --test-threads=1
