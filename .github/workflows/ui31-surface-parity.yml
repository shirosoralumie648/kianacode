name: "UI-31 CLI/Workbench/Web/Desktop 行为 parity 基线"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui31-surface-parity:
    name: "UI-31 CLI/Workbench/Web/Desktop 行为 parity 基线"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui31_surface_parity
        run: cargo test -p kiana-client --test ui31_surface_parity --locked -- --test-threads=1
