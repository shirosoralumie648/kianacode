name: INT-00 integrations baseline

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connectors.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/integrations_baseline.rs"
      - "docs/roadmap/integrations-baseline.md"
      - ".github/workflows/int00-baseline.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connectors.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/integrations_baseline.rs"
      - "docs/roadmap/integrations-baseline.md"
      - ".github/workflows/int00-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Run INT-00 source-only guard
        run: cargo test -p kiana-core --test integrations_baseline --locked -- --test-threads=1
