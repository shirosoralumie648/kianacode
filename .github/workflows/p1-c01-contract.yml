name: P1-C-01 organization and cell contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/tests/p1_c01_contract.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/p1_c01_contract_guard.rs"
      - "docs/roadmap/cell-contract-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-c01-contract.yml"
  pull_request:
    paths:
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/tests/p1_c01_contract.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/p1_c01_contract_guard.rs"
      - "docs/roadmap/cell-contract-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-c01-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-C-01 domain contract fixture
        run: cargo test -p kiana-domain --test p1_c01_contract --locked -- --test-threads=1
      - name: Run P1-C-01 source guard
        run: cargo test -p kiana-core --test p1_c01_contract_guard --locked -- --test-threads=1
      - name: Compile cell contract path
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
