name: P2-L2-01 feedback candidates

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/quality.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/versioning.rs"
      - "kiana-core/tests/p2_l2_01_feedback.rs"
      - "kiana-core/tests/p2_k3_01_human_inbox.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-l2-01-feedback-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-l2-01-feedback.yml"
  pull_request:
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/quality.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/versioning.rs"
      - "kiana-core/tests/p2_l2_01_feedback.rs"
      - "kiana-core/tests/p2_k3_01_human_inbox.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-l2-01-feedback-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-l2-01-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run feedback source guard
        run: cargo test -p kiana-core --test p2_l2_01_feedback --locked -- --test-threads=1
      - name: Run Human Inbox feedback regression
        run: cargo test -p kiana-core --test p2_k3_01_human_inbox --locked -- --test-threads=1
      - name: Compile P2-L2-01 targets
        run: cargo check --workspace --tests --locked
