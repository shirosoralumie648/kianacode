name: SC-29 release artifact provenance verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run deterministic provenance verifier fixture
        run: python3 scripts/verify-release-provenance.py --self-test
      - name: Run SC-29 domain fixture
        run: cargo test -p kiana-domain --test sc29_release_attestation --locked -- --test-threads=1
      - name: Run SC-29 source guard
        run: cargo test -p kiana-core --test sc29_release_attestation_guard --locked -- --test-threads=1
