name: SC-29 release artifact provenance verifier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiana-sc29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the committed lockfile
        run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-29 deny-first verifier fixtures
        run: python3 -B scripts/tests/test_sc29_release_provenance.py
      - name: Run deterministic provenance verifier self-test
        run: python3 scripts/verify-release-provenance.py --self-test
      - name: Validate SC-29 verifier, fixtures and release boundary
        run: bash scripts/validate-sc29-release-provenance.sh
      - name: Compile SC-29 fixtures
        run: |
          cargo test -p kiana-domain --test sc29_release_attestation --locked --no-run
          cargo test -p kiana-core --test sc29_release_attestation_guard --locked --no-run
      - name: Run SC-29 domain fixture
        run: cargo test -p kiana-domain --test sc29_release_attestation --locked -- --test-threads=1
      - name: Run SC-29 source guard
        run: cargo test -p kiana-core --test sc29_release_attestation_guard --locked -- --test-threads=1
