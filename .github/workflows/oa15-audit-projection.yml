name: oa15-audit-projection

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/audit.rs"
      - "kiana-core/src/audit.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa15_audit_projection.rs"
      - ".github/workflows/oa15-audit-projection.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/audit.rs"
      - "kiana-core/src/audit.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa15_audit_projection.rs"
      - ".github/workflows/oa15-audit-projection.yml"

permissions:
  contents: read

jobs:
  oa15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa15-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-15 remote-only fixtures
        run: cargo test -p kiana-core --test oa15_audit_projection --locked -- --test-threads=1
