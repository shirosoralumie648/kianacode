name: pd18-memory-projection

on:
  push:
    paths:
      - 'kiana-domain/src/memory_projection.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd18_memory_projection.rs'
      - 'kiana-daemon/src/harness_memory.rs'
      - 'kiana-daemon/tests/pd18_memory_projection_guard.rs'
      - 'kiana-core/src/data_governance.rs'
      - 'kiana-core/tests/pd18_memory_projection_guard.rs'
      - '.github/workflows/pd18-memory-projection.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/memory_projection.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd18_memory_projection.rs'
      - 'kiana-daemon/src/harness_memory.rs'
      - 'kiana-daemon/tests/pd18_memory_projection_guard.rs'
      - 'kiana-core/src/data_governance.rs'
      - 'kiana-core/tests/pd18_memory_projection_guard.rs'
      - '.github/workflows/pd18-memory-projection.yml'

permissions:
  contents: read

jobs:
  memory-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test pd18_memory_projection --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test pd18_memory_projection_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd18_memory_projection_guard --locked -- --test-threads=1
