name: NM-01 notification contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/notifications.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm01_contracts.rs"
      - "kiana-core/src/communication.rs"
      - "kiana-core/tests/nm01_contracts_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/notifications-contracts-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm01-contracts.yml"
  pull_request:
    paths:
      - "kiana-domain/src/notifications.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm01_contracts.rs"
      - "kiana-core/src/communication.rs"
      - "kiana-core/tests/nm01_contracts_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/notifications-contracts-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm01-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run NM-01 contract fixtures
        run: cargo test -p kiana-domain --test nm01_contracts --locked -- --test-threads=1
      - name: Run NM-01 source guard
        run: cargo test -p kiana-core --test nm01_contracts_guard --locked -- --test-threads=1
      - name: Compile notification contract path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-protocol -p kiana-core --tests --locked
