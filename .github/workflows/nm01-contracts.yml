name: NM-01 notification contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-01 contract fixtures
        run: cargo test -p kiana-domain --test nm01_contracts --locked -- --test-threads=1
      - name: Run NM-01 source guard
        run: cargo test -p kiana-core --test nm01_contracts_guard --locked -- --test-threads=1
      - name: Run NM-00 notification baseline guard
        run: cargo test -p kiana-core --test notifications_baseline --locked -- --test-threads=1
      - name: Compile NM-01 domain target
        run: cargo test -p kiana-domain --test nm01_contracts --no-run --locked
      - name: Compile NM-01 Core guard target
        run: cargo test -p kiana-core --test nm01_contracts_guard --no-run --locked
      - name: Compile NM-00 baseline target
        run: cargo test -p kiana-core --test notifications_baseline --no-run --locked
