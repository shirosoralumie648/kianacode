name: int05-connector-scope

on:
  push:
    paths:
      - 'kiana-domain/src/connector_scope.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int05_connector_scope.rs'
      - 'kiana-core/src/connectors.rs'
      - 'kiana-core/tests/int05_connector_scope_guard.rs'
      - '.github/workflows/int05-connector-scope.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/connector_scope.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int05_connector_scope.rs'
      - 'kiana-core/src/connectors.rs'
      - 'kiana-core/tests/int05_connector_scope_guard.rs'
      - '.github/workflows/int05-connector-scope.yml'

permissions:
  contents: read

jobs:
  connector-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test int05_connector_scope --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test int05_connector_scope_guard --locked -- --test-threads=1
