name: BQ-05 rate card store

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_pricing.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/tests/bq05_rate_card_store.rs"
      - "kiana-core/tests/bq05_rate_card_guard.rs"
      - "docs/roadmap/billing-rate-card-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq05-rate-card-store.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_pricing.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/tests/bq05_rate_card_store.rs"
      - "kiana-core/tests/bq05_rate_card_guard.rs"
      - "docs/roadmap/billing-rate-card-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq05-rate-card-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rate-card-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run rate card store fixtures
        run: cargo test -p kiana-ports --test bq05_rate_card_store --locked -- --test-threads=1
      - name: Run rate card source guard
        run: cargo test -p kiana-core --test bq05_rate_card_guard --locked -- --test-threads=1
      - name: Compile BQ-05 targets
        run: cargo check --workspace --tests --locked
