name: cm24-memory-temporal

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_temporal.rs"
      - "kiana-domain/src/memory_acl.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm24_memory_temporal.rs"
      - "kiana-core/tests/cm24_memory_temporal_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm24-memory-temporal-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm24-memory-temporal.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_temporal.rs"
      - "kiana-domain/src/memory_acl.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm24_memory_temporal.rs"
      - "kiana-core/tests/cm24_memory_temporal_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm24-memory-temporal-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm24-memory-temporal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-24 memory temporal fixtures
        run: cargo test -p kiana-domain --test cm24_memory_temporal --locked -- --test-threads=1
      - name: Run CM-24 source guard
        run: cargo test -p kiana-core --test cm24_memory_temporal_guard --locked -- --test-threads=1
