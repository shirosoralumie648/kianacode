name: P4-J7-08 provider configuration snapshot

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/provider_config.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/p4_j7_08_config.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/p4_j7_08_config_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/provider-config-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-08-provider-config.yml"
  pull_request:
    paths:
      - "kiana-domain/src/provider_config.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/p4_j7_08_config.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-core/tests/p4_j7_08_config_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/provider-config-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-08-provider-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-08 provider config fixtures
        run: cargo test -p kiana-provider --test p4_j7_08_config --locked -- --test-threads=1
      - name: Run P4-J7-08 source guard
        run: cargo test -p kiana-core --test p4_j7_08_config_guard --locked -- --test-threads=1
      - name: Compile provider configuration path
        run: cargo check -p kiana-domain -p kiana-provider -p kiana-daemon -p kiana-core --tests --locked
