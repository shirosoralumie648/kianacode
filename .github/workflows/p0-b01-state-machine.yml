name: P0-B-01 state transition matrix

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p0_b01_state_machine.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/tests/p0_b01_state_machine_guard.rs"
      - "kiana-runner/src/state_driver.rs"
      - "docs/roadmap/state-machine-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-b01-state-machine.yml"
  pull_request:
    paths:
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p0_b01_state_machine.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/tests/p0_b01_state_machine_guard.rs"
      - "kiana-runner/src/state_driver.rs"
      - "docs/roadmap/state-machine-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-b01-state-machine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P0-B-01 state fixtures
        run: cargo test -p kiana-domain --test p0_b01_state_machine --locked -- --test-threads=1
      - name: Run P0-B-01 source guard
        run: cargo test -p kiana-core --test p0_b01_state_machine_guard --locked -- --test-threads=1
      - name: Compile state transition path
        run: cargo check -p kiana-domain -p kiana-core -p kiana-runner --tests --locked
