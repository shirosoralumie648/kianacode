name: CAP-13 bounded output and redaction artifacts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/execution_output.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap13_output_budget.rs"
      - "kiana-daemon/src/execution_output.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-core/tests/cap13_bounded_output_guard.rs"
      - "docs/roadmap/cap13-bounded-output-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap13-bounded-output.yml"
  pull_request:
    paths:
      - "kiana-domain/src/execution_output.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap13_output_budget.rs"
      - "kiana-daemon/src/execution_output.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-core/tests/cap13_bounded_output_guard.rs"
      - "docs/roadmap/cap13-bounded-output-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap13-bounded-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run output budget contract fixtures
        run: cargo test -p kiana-domain --test cap13_output_budget --locked -- --test-threads=1
      - name: Run focused output-cap fixture
        run: cargo test -p kiana-daemon --lib shell_exec_caps_stdout_at_codex_one_mib_while_reading --locked -- --test-threads=1
      - name: Run CAP-13 source guard
        run: cargo test -p kiana-core --test cap13_bounded_output_guard --locked -- --test-threads=1
      - name: Compile CAP-13 targets
        run: cargo check --workspace --tests --locked
