name: "CO-17 cross-department handoff and ACK baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co17-company-handoff:
    name: "CO-17 cross-department handoff and ACK baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co17_company_handoff_guard
        run: cargo test -p kiana-core --test co17_company_handoff_guard --locked -- --test-threads=1
      - name: Run kiana-domain co17_company_handoff
        run: cargo test -p kiana-domain --test co17_company_handoff --locked -- --test-threads=1
