name: co17-company-handoff

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_handoff.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/tests/co17_company_handoff.rs"
      - "kiana-core/tests/co17_company_handoff_guard.rs"
      - "docs/roadmap/co17-company-handoff-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co17-company-handoff.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_handoff.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/tests/co17_company_handoff.rs"
      - "kiana-core/tests/co17_company_handoff_guard.rs"
      - "docs/roadmap/co17-company-handoff-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co17-company-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-17 handoff fixtures
        run: cargo test -p kiana-domain --test co17_company_handoff --locked -- --test-threads=1
      - name: Run CO-17 handoff source guard
        run: cargo test -p kiana-core --test co17_company_handoff_guard --locked -- --test-threads=1
      - name: Compile CO-17 Company targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
