name: INT-26 connector data propagation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_propagation.rs"
      - "kiana-domain/src/connector_scope.rs"
      - "kiana-domain/src/retention.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_propagation.rs"
      - "kiana-core/src/connector_propagation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int26_connector_propagation_guard.rs"
      - "docs/roadmap/int26-propagation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int26-propagation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_propagation.rs"
      - "kiana-domain/src/connector_scope.rs"
      - "kiana-domain/src/retention.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_propagation.rs"
      - "kiana-core/src/connector_propagation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int26_connector_propagation_guard.rs"
      - "docs/roadmap/int26-propagation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int26-propagation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-propagation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-26 domain fixtures
        run: cargo test -p kiana-domain --test connector_propagation --locked -- --test-threads=1
      - name: Run INT-26 Core source guard
        run: cargo test -p kiana-core --test int26_connector_propagation_guard --locked -- --test-threads=1
      - name: Compile INT-26 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
