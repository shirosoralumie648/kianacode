name: H18 inbox

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/inbox_contract.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-runner/src/inbox.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h18_inbox.rs"
      - "kiana-core/tests/h18_inbox_guard.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-inbox-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h18-inbox.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/inbox_contract.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-runner/src/inbox.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h18_inbox.rs"
      - "kiana-core/tests/h18_inbox_guard.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-inbox-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h18-inbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H18 runner fixtures
        run: cargo test -p kiana-runner --test h18_inbox --locked -- --test-threads=1
      - name: Run H18 source guard
        run: cargo test -p kiana-core --test h18_inbox_guard --locked -- --test-threads=1
      - name: Compile H18 targets
        run: cargo check --workspace --tests --locked
