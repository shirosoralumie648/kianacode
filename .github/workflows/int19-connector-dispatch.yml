name: "INT-19 connector dispatch / adapter observation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int19-connector-dispatch:
    name: "INT-19 connector dispatch / adapter observation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain lifecycle model: skipped phases, premature artifacts, terminal resurrection and
      # forged digests fail closed before any dispatch; digest coverage closes the file.
      - name: Run domain dispatch lifecycle fixtures
        run: cargo test -p kiana-domain --test int19_connector_dispatch --locked -- --test-threads=1
      # Daemon spine: DaemonHost → ControlPlane → Broker → EventStore with a hash-pinned
      # local_fixture binding; the phase facts precede the connector fact, a replay is effect-free
      # and a seeded crash-window chain is reported unknown without a second adapter entry.
      - name: Run daemon dispatch behaviour fixtures
        run: cargo test -p kiana-daemon --test int19_connector_dispatch --locked -- --test-threads=1
      # Daemon source guard: the journal is the only EventStore holder and the adapter/observer
      # hold neither the journal nor authorization.
      - name: Run daemon dispatch source guard
        run: cargo test -p kiana-daemon --test int19_connector_dispatch_guard --locked -- --test-threads=1
      - name: Run core dispatch wiring guard
        run: cargo test -p kiana-core --test int19_connector_dispatch_guard --locked -- --test-threads=1

      - name: Compile domain dispatch lifecycle target
        run: cargo test -p kiana-domain --test int19_connector_dispatch --no-run --locked
      - name: Compile daemon dispatch behaviour target
        run: cargo test -p kiana-daemon --test int19_connector_dispatch --no-run --locked
      - name: Compile daemon dispatch source guard target
        run: cargo test -p kiana-daemon --test int19_connector_dispatch_guard --no-run --locked
      - name: Compile core dispatch wiring guard target
        run: cargo test -p kiana-core --test int19_connector_dispatch_guard --no-run --locked
