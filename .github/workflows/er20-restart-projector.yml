name: ER-20 restart projector and default pause

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-projector:
    name: ER-20 restart and projector fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EventLog and projector guards
        run: cargo test -p kiana-core --test pd06_jsonl_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd09_projector_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd09_projection_driver --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er10_resource_projection --locked -- --test-threads=1
      - name: Run audit health and UI projections
        run: cargo test -p kiana-core --test oa15_audit_projection --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test oa11_health_probes --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test p2_m2_01_ui_projection --locked -- --test-threads=1
      - name: Run ER-20 source guard
        run: cargo test -p kiana-core --test er20_restart_projector_guard --locked -- --test-threads=1
      - name: Compile selected Core targets
        run: cargo test -p kiana-core --test pd06_jsonl_guard --no-run --locked
      - run: cargo test -p kiana-core --test pd09_projector_guard --no-run --locked
      - run: cargo test -p kiana-core --test pd09_projection_driver --no-run --locked
      - run: cargo test -p kiana-core --test er10_resource_projection --no-run --locked
      - run: cargo test -p kiana-core --test oa15_audit_projection --no-run --locked
      - run: cargo test -p kiana-core --test oa11_health_probes --no-run --locked
      - name: Compile daemon and ER-20 guard targets
        run: cargo test -p kiana-daemon --test p2_m2_01_ui_projection --no-run --locked
      - run: cargo test -p kiana-core --test er20_restart_projector_guard --no-run --locked
