name: cm15-context-plan

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/context_plan.rs"
      - "kiana-domain/src/retrieval_context.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cm15_context_plan_selection.rs"
      - "kiana-core/tests/cm15_context_plan_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm15-context-plan-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm15-context-plan.yml"
  pull_request:
    paths:
      - "kiana-domain/src/context_plan.rs"
      - "kiana-domain/src/retrieval_context.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cm15_context_plan_selection.rs"
      - "kiana-core/tests/cm15_context_plan_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm15-context-plan-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm15-context-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-15 context-plan fixtures
        run: cargo test -p kiana-domain --test cm15_context_plan_selection --locked -- --test-threads=1
      - name: Run CM-15 source guard
        run: cargo test -p kiana-core --test cm15_context_plan_guard --locked -- --test-threads=1
