name: "UI-20 Web timeline component migration"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui20-web-timeline:
    name: "UI-20 Web timeline component migration"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The runtime fixtures drive a real DaemonHost/Web router and serve the embedded page; the
      # project convention for daemon/entrypoint tests is a 32 MiB test-thread stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the typed timeline kind/window/bundle contract fixture
        run: cargo test -p kiana-entrypoints --test ui20_web_timeline --locked -- --test-threads=1
      - name: Run the text-only, bounded-window and migration-switch guard
        run: cargo test -p kiana-entrypoints --test ui20_web_timeline_guard --locked -- --test-threads=1
      - name: Run the live loopback hydrate/migration contract fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui20_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
