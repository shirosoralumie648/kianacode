name: sc23-deletion-tombstone

on:
  push:
    paths:
      - 'kiana-domain/src/deletion.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc23_deletion.rs'
      - 'kiana-core/src/deletion.rs'
      - 'kiana-core/src/lib.rs'
      - 'kiana-core/tests/sc23_deletion.rs'
      - 'kiana-core/tests/sc23_deletion_guard.rs'
      - 'kiana-eventlog/src/retention_store.rs'
      - 'kiana-eventlog/tests/sc23_deletion_store.rs'
      - 'kiana-eventlog/tests/sc23_deletion_guard.rs'
      - 'kiana-ports/src/lib.rs'
      - '.github/workflows/sc23-deletion-tombstone.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/deletion.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/sc23_deletion.rs'
      - 'kiana-core/src/deletion.rs'
      - 'kiana-core/src/lib.rs'
      - 'kiana-core/tests/sc23_deletion.rs'
      - 'kiana-core/tests/sc23_deletion_guard.rs'
      - 'kiana-eventlog/src/retention_store.rs'
      - 'kiana-eventlog/tests/sc23_deletion_store.rs'
      - 'kiana-eventlog/tests/sc23_deletion_guard.rs'
      - 'kiana-ports/src/lib.rs'
      - '.github/workflows/sc23-deletion-tombstone.yml'

jobs:
  deletion-tombstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked --offline
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test sc23_deletion --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc23_deletion --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc23_deletion_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-eventlog --test sc23_deletion_store --locked -- --test-threads=1
      - run: cargo test -p kiana-eventlog --test sc23_deletion_guard --locked -- --test-threads=1
