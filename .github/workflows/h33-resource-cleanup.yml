name: h33-resource-cleanup

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/resource_cleanup.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h33_resource_cleanup.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/h33_resource_cleanup_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h33_resource_cleanup.rs"
      - "docs/roadmap/h33-resource-cleanup-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h33-resource-cleanup.yml"
  pull_request:
    paths:
      - "kiana-domain/src/resource_cleanup.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h33_resource_cleanup.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/h33_resource_cleanup_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h33_resource_cleanup.rs"
      - "docs/roadmap/h33-resource-cleanup-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h33-resource-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H33 domain fixtures
        run: cargo test -p kiana-domain --test h33_resource_cleanup --locked -- --test-threads=1
      - name: Run H33 protocol fixtures
        run: cargo test -p kiana-protocol --test h33_resource_cleanup --locked -- --test-threads=1
      - name: Run H33 Core/daemon source guard
        run: cargo test -p kiana-core --test h33_resource_cleanup_guard --locked -- --test-threads=1
