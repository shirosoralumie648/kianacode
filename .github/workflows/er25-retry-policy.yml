name: ER-25 retry policy and new attempt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-policy:
    name: ER-25 retry and attempt fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run retry, budget and cancellation fixtures
        run: cargo test -p kiana-runner --test h05_stop_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h07_budget_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h08_cancellation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h11_tool_observation_guard --locked -- --test-threads=1
      - name: Run Core effect and unknown guards
        run: cargo test -p kiana-core --test cp20_unknown_reconcile_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test er14_effect_observation_guard --locked -- --test-threads=1
      - name: Run ER-25 source guard
        run: cargo test -p kiana-core --test er25_retry_policy_guard --locked -- --test-threads=1
      - name: Compile selected Runner targets
        run: cargo test -p kiana-runner --test h05_stop_guard --no-run --locked
      - run: cargo test -p kiana-runner --test h07_budget_guard --no-run --locked
      - run: cargo test -p kiana-runner --test h08_cancellation_guard --no-run --locked
      - run: cargo test -p kiana-runner --test h11_tool_observation_guard --no-run --locked
      - name: Compile selected Core targets
        run: cargo test -p kiana-core --test cp20_unknown_reconcile_guard --no-run --locked
      - run: cargo test -p kiana-core --test er14_effect_observation_guard --no-run --locked
      - run: cargo test -p kiana-core --test er25_retry_policy_guard --no-run --locked
