name: "CO-40 Company CLI and Workbench user flow baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co40-company-user-flow:
    name: "CO-40 Company CLI and Workbench user flow baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-entrypoints co40_company_user_flow
        run: cargo test -p kiana-entrypoints --test co40_company_user_flow --locked -- --test-threads=1
