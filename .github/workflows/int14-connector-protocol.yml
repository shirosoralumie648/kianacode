name: int14-connector-protocol

on:
  push:
    paths:
      - "kiana-domain/src/connector_protocol.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int14_connector_protocol.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/int14_connector_protocol.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-core/tests/int14_connector_protocol_guard.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-entrypoints/tests/int14_connector_protocol_guard.rs"
      - ".github/workflows/int14-connector-protocol.yml"
      - "docs/roadmap/int14-connector-protocol-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
  pull_request:
    paths:
      - "kiana-domain/src/connector_protocol.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int14_connector_protocol.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/int14_connector_protocol.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/connectors.rs"
      - "kiana-core/tests/int14_connector_protocol_guard.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-entrypoints/tests/int14_connector_protocol_guard.rs"
      - ".github/workflows/int14-connector-protocol.yml"
      - "docs/roadmap/int14-connector-protocol-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-14 domain protocol fixtures
        run: cargo test -p kiana-domain --test int14_connector_protocol --locked -- --test-threads=1
      - name: Run INT-14 wire DTO fixtures
        run: cargo test -p kiana-protocol --test int14_connector_protocol --locked -- --test-threads=1
      - name: Run INT-14 ControlPlane source guard
        run: cargo test -p kiana-core --test int14_connector_protocol_guard --locked -- --test-threads=1
      - name: Run INT-14 entrypoint/client source guard
        run: cargo test -p kiana-entrypoints --test int14_connector_protocol_guard --locked -- --test-threads=1
      - name: Compile INT-14 workspace targets
        run: cargo check --workspace --tests --locked
