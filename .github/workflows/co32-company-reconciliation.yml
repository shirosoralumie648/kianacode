name: "CO-32 Company risk, incident and Unknown reconciliation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co32-company-reconciliation:
    name: "CO-32 Company risk, incident and Unknown reconciliation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co32_company_reconciliation_guard
        run: cargo test -p kiana-core --test co32_company_reconciliation_guard --locked -- --test-threads=1
      - name: Run kiana-domain co32_company_reconciliation
        run: cargo test -p kiana-domain --test co32_company_reconciliation --locked -- --test-threads=1
