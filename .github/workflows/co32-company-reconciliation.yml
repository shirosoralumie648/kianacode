name: co32-company-reconciliation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_reconciliation.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co32_company_reconciliation.rs"
      - "kiana-core/src/company_reconciliation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co32_company_reconciliation_guard.rs"
      - "docs/roadmap/co32-company-reconciliation-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co32-company-reconciliation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_reconciliation.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co32_company_reconciliation.rs"
      - "kiana-core/src/company_reconciliation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co32_company_reconciliation_guard.rs"
      - "docs/roadmap/co32-company-reconciliation-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co32-company-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-32 Company reconciliation fixtures
        run: cargo test -p kiana-domain --test co32_company_reconciliation --locked -- --test-threads=1
      - name: Run CO-32 single-spine source guard
        run: cargo test -p kiana-core --test co32_company_reconciliation_guard --locked -- --test-threads=1
      - name: Compile CO-32 reconciliation targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
