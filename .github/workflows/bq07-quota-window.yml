name: BQ-07 quota window

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_quota.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq07_quota_window.rs"
      - "kiana-core/tests/bq07_quota_window_guard.rs"
      - "docs/roadmap/billing-quota-window-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq07-quota-window.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_quota.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq07_quota_window.rs"
      - "kiana-core/tests/bq07_quota_window_guard.rs"
      - "docs/roadmap/billing-quota-window-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq07-quota-window.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run quota window fixtures
        run: cargo test -p kiana-domain --test bq07_quota_window --locked -- --test-threads=1
      - name: Run quota window source guard
        run: cargo test -p kiana-core --test bq07_quota_window_guard --locked -- --test-threads=1
      - name: Compile BQ-07 targets
        run: cargo check --workspace --tests --locked
