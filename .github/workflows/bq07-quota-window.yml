name: BQ-07 quota window

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-window:
    name: BQ-07 quota window and group fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-07 domain quota fixtures
        run: cargo test -p kiana-domain --test bq07_quota_window --locked -- --test-threads=1
      - name: Run BQ-07 Core source guard
        run: cargo test -p kiana-core --test bq07_quota_window_guard --locked -- --test-threads=1
      - name: Compile BQ-07 domain target
        run: cargo test -p kiana-domain --test bq07_quota_window --no-run --locked
      - name: Compile BQ-07 Core guard target
        run: cargo test -p kiana-core --test bq07_quota_window_guard --no-run --locked
