name: "INT-20 provider receipt / effect observation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int20-receipt-observation:
    name: "INT-20 provider receipt / effect observation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain receipt/observation contract: foreign binding/account/operation/key/payload,
      # self-asserted scope, late attempts, raw provider response material and re-ordered evidence
      # refs fail closed before any projection; succeeded/failed/unknown stay distinct.
      - name: Run domain receipt and observation fixtures
        run: cargo test -p kiana-domain --test int20_receipt_observation --locked -- --test-threads=1
      # Ports expectation: the prepared permit plus admitted owner/audience scope is the only
      # source of the binding, and the released projection is digest-only.
      - name: Run ports receipt and observation fixtures
        run: cargo test -p kiana-ports --test int20_receipt_observation --locked -- --test-threads=1
      # Source guard: the contract is shared by ports/daemon, the daemon observer consumes a
      # server-built binding, and the deny-first fixtures stay wired to the lane and shards.
      - name: Run core receipt and observation guard
        run: cargo test -p kiana-core --test int20_receipt_observation_guard --locked -- --test-threads=1

      - name: Compile domain receipt and observation target
        run: cargo test -p kiana-domain --test int20_receipt_observation --no-run --locked
      - name: Compile ports receipt and observation target
        run: cargo test -p kiana-ports --test int20_receipt_observation --no-run --locked
      - name: Compile core receipt and observation guard target
        run: cargo test -p kiana-core --test int20_receipt_observation_guard --no-run --locked
