name: NM-03 notification event registry

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/notification_events.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm03_event_registry.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/tests/nm03_event_registry_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/notifications-event-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm03-event-registry.yml"
  pull_request:
    paths:
      - "kiana-domain/src/notification_events.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/nm03_event_registry.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/tests/nm03_event_registry_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/notifications-event-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm03-event-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-event-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run NM-03 event registry fixtures
        run: cargo test -p kiana-domain --test nm03_event_registry --locked -- --test-threads=1
      - name: Run NM-03 source guard
        run: cargo test -p kiana-core --test nm03_event_registry_guard --locked -- --test-threads=1
      - name: Compile event registry path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-protocol -p kiana-core --tests --locked
