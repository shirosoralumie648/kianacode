name: OA-06 EventStore Commit Observer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-observer:
    name: Committed-only observer guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run OA-06 commit observer tests
        run: cargo test -p kiana-eventlog --test oa06_commit_observer --locked -- --test-threads=1
      - name: Compile OA-06 target
        run: cargo test -p kiana-eventlog --test oa06_commit_observer --no-run --locked
