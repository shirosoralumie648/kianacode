name: "UI-14 Workbench controller and command palette"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui14-workbench-controller:
    name: "UI-14 Workbench controller and command palette"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the controller, keymap, palette, session and recovery fixtures
        run: cargo test -p kiana-entrypoints --test ui14_workbench_controller --locked -- --test-threads=1
      - name: Run the controller boundary and completion-slice guards
        run: cargo test -p kiana-entrypoints --test ui14_workbench_controller_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
