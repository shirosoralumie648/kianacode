name: DEP-29 migration primitives

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/migration_primitives.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep29_migration_primitives.rs"
      - "kiana-core/tests/dep29_migration_primitives_guard.rs"
      - "docs/roadmap/dep29-migration-primitives-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep29-migration-primitives.yml"
  pull_request:
    paths:
      - "kiana-domain/src/migration_primitives.rs"
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep29_migration_primitives.rs"
      - "kiana-core/tests/dep29_migration_primitives_guard.rs"
      - "docs/roadmap/dep29-migration-primitives-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep29-migration-primitives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-29 domain fixtures
        run: cargo test -p kiana-domain --test dep29_migration_primitives --locked -- --test-threads=1
      - name: Run DEP-29 source guard
        run: cargo test -p kiana-core --test dep29_migration_primitives_guard --locked -- --test-threads=1
      - name: Compile DEP-29 targets
        run: cargo check --workspace --tests --locked
