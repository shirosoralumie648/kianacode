name: INT-25 connector mapping

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_mapping.rs"
      - "kiana-domain/src/artifact_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_mapping.rs"
      - "kiana-core/src/connector_mapping.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int25_connector_mapping_guard.rs"
      - "docs/roadmap/int25-mapping-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int25-mapping.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_mapping.rs"
      - "kiana-domain/src/artifact_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_mapping.rs"
      - "kiana-core/src/connector_mapping.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int25_connector_mapping_guard.rs"
      - "docs/roadmap/int25-mapping-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int25-mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-25 domain fixtures
        run: cargo test -p kiana-domain --test connector_mapping --locked -- --test-threads=1
      - name: Run INT-25 Core source guard
        run: cargo test -p kiana-core --test int25_connector_mapping_guard --locked -- --test-threads=1
      - name: Compile INT-25 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
