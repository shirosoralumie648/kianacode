name: "INT-25 connector mapping baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int25-mapping:
    name: "INT-25 connector mapping baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core int25_connector_mapping_guard
        run: cargo test -p kiana-core --test int25_connector_mapping_guard --locked -- --test-threads=1
