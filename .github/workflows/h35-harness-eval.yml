name: H35 harness evaluation and performance gate

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/quality.rs"
      - "kiana-domain/src/eval.rs"
      - "kiana-domain/src/performance.rs"
      - "kiana-core/src/versioning.rs"
      - "kiana-daemon/src/eval_runtime.rs"
      - "kiana-domain/tests/eq03_eval_objects.rs"
      - "kiana-core/tests/p1_l1_01_golden_trace.rs"
      - "kiana-core/tests/eval_baseline.rs"
      - "kiana-core/tests/eq14_evidence_capture_guard.rs"
      - "kiana-core/tests/h35_harness_eval_guard.rs"
      - "docs/roadmap/h35-harness-eval-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h35-harness-eval.yml"
  pull_request:
    paths:
      - "kiana-domain/src/quality.rs"
      - "kiana-domain/src/eval.rs"
      - "kiana-domain/src/performance.rs"
      - "kiana-core/src/versioning.rs"
      - "kiana-daemon/src/eval_runtime.rs"
      - "kiana-domain/tests/eq03_eval_objects.rs"
      - "kiana-core/tests/p1_l1_01_golden_trace.rs"
      - "kiana-core/tests/eval_baseline.rs"
      - "kiana-core/tests/eq14_evidence_capture_guard.rs"
      - "kiana-core/tests/h35_harness_eval_guard.rs"
      - "docs/roadmap/h35-harness-eval-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h35-harness-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test eq03_eval_objects --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p1_l1_01_golden_trace --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test eval_baseline --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test eq14_evidence_capture_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test h35_harness_eval_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
