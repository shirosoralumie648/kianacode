name: oa12-metric-governance

on:
  push:
    paths:
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa12_metric_governance.rs"
      - ".github/workflows/oa12-metric-governance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa12_metric_governance.rs"
      - ".github/workflows/oa12-metric-governance.yml"

permissions:
  contents: read

jobs:
  oa12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa12-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-12 remote-only fixtures
        run: cargo test -p kiana-core --test oa12_metric_governance --locked -- --test-threads=1
