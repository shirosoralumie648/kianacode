name: h27-turn-outcome

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/turn_outcome.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h27_turn_outcome.rs"
      - "kiana-core/src/turn_outcome.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/h27_turn_outcome_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h27_turn_outcome.rs"
      - "docs/roadmap/h27-turn-outcome-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h27-turn-outcome.yml"
  pull_request:
    paths:
      - "kiana-domain/src/turn_outcome.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h27_turn_outcome.rs"
      - "kiana-core/src/turn_outcome.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/h27_turn_outcome_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h27_turn_outcome.rs"
      - "docs/roadmap/h27-turn-outcome-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h27-turn-outcome.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turn-outcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H27 domain fixtures
        run: cargo test -p kiana-domain --test h27_turn_outcome --locked -- --test-threads=1
      - name: Run H27 protocol fixtures
        run: cargo test -p kiana-protocol --test h27_turn_outcome --locked -- --test-threads=1
      - name: Run H27 core source guard
        run: cargo test -p kiana-core --test h27_turn_outcome_guard --locked -- --test-threads=1
