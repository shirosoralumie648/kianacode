name: DEP-37 orchestrated rollout contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/orchestrated_rollout.rs"
      - "kiana-domain/src/orchestrated_rollout_evidence.rs"
      - "kiana-domain/tests/dep37_orchestrated_rollout_evidence.rs"
      - "kiana-domain/src/revision_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep37_orchestrated_rollout.rs"
      - "kiana-core/tests/dep37_orchestrated_rollout_guard.rs"
      - "docs/roadmap/dep37-orchestrated-rollout-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep37-orchestrated-rollout.yml"
  pull_request:
    paths:
      - "kiana-domain/src/orchestrated_rollout.rs"
      - "kiana-domain/src/orchestrated_rollout_evidence.rs"
      - "kiana-domain/tests/dep37_orchestrated_rollout_evidence.rs"
      - "kiana-domain/src/revision_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep37_orchestrated_rollout.rs"
      - "kiana-core/tests/dep37_orchestrated_rollout_guard.rs"
      - "docs/roadmap/dep37-orchestrated-rollout-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep37-orchestrated-rollout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrated-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-37 rollout contract fixture
        run: cargo test -p kiana-domain --test dep37_orchestrated_rollout --locked -- --test-threads=1
      - name: Run DEP-37 rollout evidence fixture
        run: cargo test -p kiana-domain --test dep37_orchestrated_rollout_evidence --locked -- --test-threads=1
      - name: Run DEP-37 source guard
        run: cargo test -p kiana-core --test dep37_orchestrated_rollout_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
