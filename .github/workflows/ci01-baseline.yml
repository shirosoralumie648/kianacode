name: CI-01 Baseline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Configuration, credentials, and identity baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate source boundaries and migration fixtures
        run: python3 scripts/ci-01-baseline.py
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run CI-01 redaction and precedence tests
        run: cargo test -p kiana-provider --test ci01_baseline --locked -- --test-threads=1
