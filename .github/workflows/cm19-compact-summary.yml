name: cm19-compact-summary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/compact_summary.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/h22_compact_summary.rs"
      - "kiana-domain/tests/cm19_compact_summary.rs"
      - "kiana-runner/src/compact.rs"
      - "kiana-core/tests/cm19_compact_summary_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm19-compact-summary-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm19-compact-summary.yml"
  pull_request:
    paths:
      - "kiana-domain/src/compact_summary.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/h22_compact_summary.rs"
      - "kiana-domain/tests/cm19_compact_summary.rs"
      - "kiana-runner/src/compact.rs"
      - "kiana-core/tests/cm19_compact_summary_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm19-compact-summary-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm19-compact-summary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-19 compact-summary fixtures
        run: cargo test -p kiana-domain --test cm19_compact_summary --locked -- --test-threads=1
      - name: Run CM-19 runner pending-pair fixture
        run: cargo test -p kiana-runner --lib cm19_compaction_keeps_latest_goal_and_pending_pairs --locked -- --test-threads=1
      - name: Run CM-19 source guard
        run: cargo test -p kiana-core --test cm19_compact_summary_guard --locked -- --test-threads=1
