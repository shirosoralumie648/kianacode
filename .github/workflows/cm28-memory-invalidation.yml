name: cm28-memory-invalidation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_invalidation.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/deletion.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm28_memory_invalidation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/cm28_memory_invalidation_guard.rs"
      - "kiana-daemon/src/data_governance.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/context_query.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm28-memory-invalidation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm28-memory-invalidation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_invalidation.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/deletion.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm28_memory_invalidation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/cm28_memory_invalidation_guard.rs"
      - "kiana-daemon/src/data_governance.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/context_query.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm28-memory-invalidation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm28-memory-invalidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-invalidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-28 invalidation fixtures
        run: cargo test -p kiana-domain --test cm28_memory_invalidation --locked -- --test-threads=1
      - name: Run CM-28 source guard
        run: cargo test -p kiana-core --test cm28_memory_invalidation_guard --locked -- --test-threads=1
