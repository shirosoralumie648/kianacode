name: cm30-golden-context

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/golden_context.rs"
      - "kiana-domain/src/context_plan.rs"
      - "kiana-domain/src/unified_retrieval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm30_golden_context.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm30_golden_context_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm30-golden-context-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm30-golden-context.yml"
  pull_request:
    paths:
      - "kiana-domain/src/golden_context.rs"
      - "kiana-domain/src/context_plan.rs"
      - "kiana-domain/src/unified_retrieval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm30_golden_context.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm30_golden_context_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm30-golden-context-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm30-golden-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-30 golden fixtures
        run: cargo test -p kiana-domain --test cm30_golden_context --locked -- --test-threads=1
      - name: Run CM-30 source guard
        run: cargo test -p kiana-core --test cm30_golden_context_guard --locked -- --test-threads=1
