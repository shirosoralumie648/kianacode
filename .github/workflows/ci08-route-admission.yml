name: CI-08 provider route admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-admission:
    name: Provider route admission fixtures and guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CI-08 domain route fixture
        run: cargo test -p kiana-domain --test ci08_route_admission --locked -- --test-threads=1
      - name: Run CI-08 provider route fixture
        run: cargo test -p kiana-provider --test ci08_route_admission --locked -- --test-threads=1
      - name: Run CI-08 core source guard
        run: cargo test -p kiana-core --test ci08_route_admission --locked -- --test-threads=1
      - name: Compile CI-08 domain target
        run: cargo test -p kiana-domain --test ci08_route_admission --no-run --locked
      - name: Compile CI-08 provider target
        run: cargo test -p kiana-provider --test ci08_route_admission --no-run --locked
      - name: Compile CI-08 core target
        run: cargo test -p kiana-core --test ci08_route_admission --no-run --locked
