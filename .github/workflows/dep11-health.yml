name: DEP-11 health aggregation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/health_aggregation.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/deployment_startup.rs"
      - "kiana-domain/src/operation_lifecycle.rs"
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep11_health_aggregation.rs"
      - "kiana-core/src/health_aggregation.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep11_health_aggregation_guard.rs"
      - "kiana-daemon/src/health_aggregation.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep11_health_route_guard.rs"
      - "docs/roadmap/dep11-health-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep11-health.yml"
  pull_request:
    paths:
      - "kiana-domain/src/health_aggregation.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/src/deployment_startup.rs"
      - "kiana-domain/src/operation_lifecycle.rs"
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep11_health_aggregation.rs"
      - "kiana-core/src/health_aggregation.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep11_health_aggregation_guard.rs"
      - "kiana-daemon/src/health_aggregation.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep11_health_route_guard.rs"
      - "docs/roadmap/dep11-health-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep11-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-11 domain fixtures
        run: cargo test -p kiana-domain --test dep11_health_aggregation --locked -- --test-threads=1
      - name: Run DEP-11 Core guard
        run: cargo test -p kiana-core --test dep11_health_aggregation_guard --locked -- --test-threads=1
      - name: Run DEP-11 daemon route guard
        run: cargo test -p kiana-daemon --test dep11_health_route_guard --locked -- --test-threads=1
      - name: Compile DEP-11 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
