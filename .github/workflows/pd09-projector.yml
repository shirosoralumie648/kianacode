name: PD-09 projector checkpoint runner

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/projection_checkpoint.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/pd09_projection_driver.rs"
      - "kiana-core/tests/pd09_projector_guard.rs"
      - "docs/roadmap/pd09-projector-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd09-projector.yml"
  pull_request:
    paths:
      - "kiana-core/src/projection_checkpoint.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/pd09_projection_driver.rs"
      - "kiana-core/tests/pd09_projector_guard.rs"
      - "docs/roadmap/pd09-projector-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd09-projector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run projector driver fixtures
        run: cargo test -p kiana-core --test pd09_projection_driver --locked -- --test-threads=1
      - name: Run projector source guard
        run: cargo test -p kiana-core --test pd09_projector_guard --locked -- --test-threads=1
      - name: Compile PD-09 targets
        run: cargo check --workspace --tests --locked
