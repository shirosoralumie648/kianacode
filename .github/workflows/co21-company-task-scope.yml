name: co21-company-task-scope

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_task_scope.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co21_company_task_scope.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/co21_company_task_scope_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/co21-company-task-scope-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co21-company-task-scope.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_task_scope.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co21_company_task_scope.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/co21_company_task_scope_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/co21-company-task-scope-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co21-company-task-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-task-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-21 task scope fixtures
        run: cargo test -p kiana-domain --test co21_company_task_scope --locked -- --test-threads=1
      - name: Run CO-21 task scope source guard
        run: cargo test -p kiana-core --test co21_company_task_scope_guard --locked -- --test-threads=1
      - name: Compile CO-21 Company targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon -p kiana-runner --tests --locked
