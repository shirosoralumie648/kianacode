name: SW-09 progress and stall contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_progress.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_progress.rs"
      - "kiana-core/src/swarm_progress.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_progress_guard.rs"
      - "docs/roadmap/sw09-progress-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw09-progress.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_progress.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_progress.rs"
      - "kiana-core/src/swarm_progress.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_progress_guard.rs"
      - "docs/roadmap/sw09-progress-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw09-progress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-09 domain progress fixtures
        run: cargo test -p kiana-domain --test swarm_progress --locked -- --test-threads=1
      - name: Run SW-09 Core source guard
        run: cargo test -p kiana-core --test swarm_progress_guard --locked -- --test-threads=1
      - name: Compile SW-09 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
