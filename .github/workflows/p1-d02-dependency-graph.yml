name: P1-D-02 dependency graph validation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p1_d02_dependency_graph.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p1_d02_dependency_guard.rs"
      - "docs/roadmap/dependency-graph-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-d02-dependency-graph.yml"
  pull_request:
    paths:
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p1_d02_dependency_graph.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p1_d02_dependency_guard.rs"
      - "docs/roadmap/dependency-graph-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-d02-dependency-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-D-02 graph fixtures
        run: cargo test -p kiana-domain --test p1_d02_dependency_graph --locked -- --test-threads=1
      - name: Run P1-D-02 source guard
        run: cargo test -p kiana-core --test p1_d02_dependency_guard --locked -- --test-threads=1
      - name: Compile dependency graph path
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
