name: H05 stop and recovery acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: H05 ${{ matrix.crate }} / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: kiana-domain
            mode: integration
            target: h05_model_outcome
            label: h05_model_outcome
          - crate: kiana-runner
            mode: integration
            target: h05_stop_guard
            label: h05_stop_guard
          - crate: kiana-provider
            mode: lib
            selector: explicit_incomplete_statuses_share_one_fail_closed_outcome
            label: explicit_incomplete_statuses
          - crate: kiana-provider
            mode: lib
            selector: explicit_incomplete_stream_events_share_one_fail_closed_outcome
            label: explicit_incomplete_stream_events
          - crate: kiana-provider
            mode: lib
            selector: structured_output_errors_are_typed_format_repair_without_running_a_repair
            label: structured_output_format_repair
          - crate: kiana-provider
            mode: lib
            selector: malformed_model_tool_arguments_are_typed_tool_repair_after_request
            label: malformed_tool_arguments
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: symbols
      TEST_CRATE: ${{ matrix.crate }}
      TEST_MODE: ${{ matrix.mode }}
      TEST_TARGET: ${{ matrix.target }}
      TEST_SELECTOR: ${{ matrix.selector }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run focused H05 target
        run: |
          if [ "$TEST_MODE" = "lib" ]; then
            cargo test -p "$TEST_CRATE" --lib --locked "$TEST_SELECTOR" -- --test-threads=1
          else
            cargo test -p "$TEST_CRATE" --test "$TEST_TARGET" --locked -- --test-threads=1
          fi
