name: "DEP-06 · Operation lease baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep06-operation-lease:
    name: "DEP-06 · Operation lease baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep06_operation_lease_guard
        run: cargo test -p kiana-core --test dep06_operation_lease_guard --locked -- --test-threads=1
      - name: Run kiana-domain dep06_operation_lease
        run: cargo test -p kiana-domain --test dep06_operation_lease --locked -- --test-threads=1
