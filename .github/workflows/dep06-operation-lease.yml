name: DEP-06 operation lease

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep06_operation_lease.rs"
      - "kiana-core/src/deployment_lease.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep06_operation_lease_guard.rs"
      - "docs/roadmap/dep06-operation-lease-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep06-operation-lease.yml"
  pull_request:
    paths:
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep06_operation_lease.rs"
      - "kiana-core/src/deployment_lease.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep06_operation_lease_guard.rs"
      - "docs/roadmap/dep06-operation-lease-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep06-operation-lease.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operation-lease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-06 domain fixtures
        run: cargo test -p kiana-domain --test dep06_operation_lease --locked -- --test-threads=1
      - name: Run DEP-06 source guard
        run: cargo test -p kiana-core --test dep06_operation_lease_guard --locked -- --test-threads=1
      - name: Compile DEP-06 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
