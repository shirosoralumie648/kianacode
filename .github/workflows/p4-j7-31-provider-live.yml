name: P4-J7-31 provider live boundary

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/provider-live-smoke.sh"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_31_provider_live_guard.rs"
      - "docs/roadmap/p4-j7-31-provider-live-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-31-provider-live.yml"
  pull_request:
    paths:
      - "scripts/provider-live-smoke.sh"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_31_provider_live_guard.rs"
      - "docs/roadmap/p4-j7-31-provider-live-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-31-provider-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-live-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: bash -n scripts/provider-live-smoke.sh
      - name: Confirm unconfigured live is an explicit skip
        run: |
          output="$(bash scripts/provider-live-smoke.sh --skip-if-unconfigured)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "skipped"
          printf '%s\n' "$output" | grep -F "no live provider environment is configured"
      - run: cargo fmt --all --check
      - name: Run P4-J7-31 source guard
        run: cargo test -p kiana-core --test p4_j7_31_provider_live_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
