name: cm09-text-normalization

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/text_normalization.rs"
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm09_text_normalization.rs"
      - "kiana-core/tests/cm09_text_normalization_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm09-text-normalization-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm09-text-normalization.yml"
  pull_request:
    paths:
      - "kiana-domain/src/text_normalization.rs"
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm09_text_normalization.rs"
      - "kiana-core/tests/cm09_text_normalization_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm09-text-normalization-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm09-text-normalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-09 normalization fixtures
        run: cargo test -p kiana-domain --test cm09_text_normalization --locked -- --test-threads=1
      - name: Run CM-09 source guard
        run: cargo test -p kiana-core --test cm09_text_normalization_guard --locked -- --test-threads=1
