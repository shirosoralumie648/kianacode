name: CO-05 company command policy

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co05_policy.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_business.rs"
      - "kiana-core/tests/co05_policy_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-policy-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co05-company-policy.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co05_policy.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_business.rs"
      - "kiana-core/tests/co05_policy_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-policy-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co05-company-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-05 policy fixtures
        run: cargo test -p kiana-domain --test co05_policy --locked -- --test-threads=1
      - name: Run CO-05 source guard
        run: cargo test -p kiana-core --test co05_policy_guard --locked -- --test-threads=1
      - name: Compile Company policy path
        run: cargo check -p kiana-domain -p kiana-protocol -p kiana-core -p kiana-daemon --tests --locked
