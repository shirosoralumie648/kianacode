name: CAP-02 capability input and digest

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/tests/cap02_input.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-core/tests/cap02_input_guard.rs"
      - "docs/roadmap/capability-input-baseline.md"
      - ".github/workflows/cap02-input.yml"
  pull_request:
    paths:
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/tests/cap02_input.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-core/tests/cap02_input_guard.rs"
      - "docs/roadmap/capability-input-baseline.md"
      - ".github/workflows/cap02-input.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CAP-02 input fixtures
        run: cargo test -p kiana-domain --test cap02_input --locked -- --test-threads=1
      - name: Run CAP-02 source guard
        run: cargo test -p kiana-core --test cap02_input_guard --locked -- --test-threads=1
