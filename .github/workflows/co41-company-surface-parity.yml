name: "CO-41 Company Web/Desktop surface parity baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co41-company-surface-parity:
    name: "CO-41 Company Web/Desktop surface parity baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-entrypoints co41_company_surface_parity
        run: cargo test -p kiana-entrypoints --test co41_company_surface_parity --locked -- --test-threads=1
      - name: Run kiana-entrypoints co41_company_surface_parity_guard
        run: cargo test -p kiana-entrypoints --test co41_company_surface_parity_guard --locked -- --test-threads=1
