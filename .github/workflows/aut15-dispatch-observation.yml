name: AUT-15 dispatch observation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_dispatch.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_dispatch.rs"
      - "kiana-core/src/automation_dispatch.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_dispatch_guard.rs"
      - "docs/roadmap/aut15-dispatch-observation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut15-dispatch-observation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_dispatch.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_dispatch.rs"
      - "kiana-core/src/automation_dispatch.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_dispatch_guard.rs"
      - "docs/roadmap/aut15-dispatch-observation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut15-dispatch-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_dispatch --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_dispatch_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
