name: PD-06 JSONL durability and recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/tests/pd06_jsonl_recovery.rs"
      - "kiana-core/tests/pd06_jsonl_guard.rs"
      - "docs/roadmap/pd06-jsonl-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd06-jsonl-recovery.yml"
  pull_request:
    paths:
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/tests/pd06_jsonl_recovery.rs"
      - "kiana-core/tests/pd06_jsonl_guard.rs"
      - "docs/roadmap/pd06-jsonl-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd06-jsonl-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonl-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run JSONL recovery fixtures
        run: cargo test -p kiana-eventlog --test pd06_jsonl_recovery --locked -- --test-threads=1
      - name: Run JSONL source guard
        run: cargo test -p kiana-core --test pd06_jsonl_guard --locked -- --test-threads=1
      - name: Compile PD-06 targets
        run: cargo check --workspace --tests --locked
