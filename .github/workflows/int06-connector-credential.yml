name: int06-connector-credential

on:
  push:
    paths:
      - 'kiana-domain/src/connector_credentials.rs'
      - 'kiana-domain/src/contracts.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int06_connector_credential.rs'
      - 'kiana-domain/tests/p4_k8_01_connector.rs'
      - 'kiana-domain/tests/p4_k8_01_connector.rs'
      - 'kiana-capability-broker/src/lib.rs'
      - 'kiana-capability-broker/tests/int06_connector_credential.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int06_connector_credential_guard.rs'
      - '.github/workflows/int06-connector-credential.yml'
      - 'docs/roadmap/integrations-connectors.md'
      - 'docs/roadmap/int06-connector-credential-baseline.md'
      - 'docs/roadmap.md'
      - 'CURRENT_STATUS.md'
  pull_request:
    paths:
      - 'kiana-domain/src/connector_credentials.rs'
      - 'kiana-domain/src/contracts.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int06_connector_credential.rs'
      - 'kiana-domain/tests/p4_k8_01_connector.rs'
      - 'kiana-domain/tests/p4_k8_01_connector.rs'
      - 'kiana-capability-broker/src/lib.rs'
      - 'kiana-capability-broker/tests/int06_connector_credential.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int06_connector_credential_guard.rs'
      - '.github/workflows/int06-connector-credential.yml'
      - 'docs/roadmap/integrations-connectors.md'
      - 'docs/roadmap/int06-connector-credential-baseline.md'
      - 'docs/roadmap.md'
      - 'CURRENT_STATUS.md'

permissions:
  contents: read

jobs:
  connector-credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test int06_connector_credential --locked -- --test-threads=1
      - run: cargo test -p kiana-capability-broker --test int06_connector_credential --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test int06_connector_credential_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
