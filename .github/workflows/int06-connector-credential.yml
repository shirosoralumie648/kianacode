name: "INT-06 connector credential binding baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int06-connector-credential:
    name: "INT-06 connector credential binding baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Reused CI-07 contract: the opaque SecretRef / CredentialLease envelope INT-06 binds to.
      - name: Run domain CI-07 lease fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run Broker CI-07 lease fixtures
        run: cargo test -p kiana-capability-broker --test ci07_credential_lease --locked -- --test-threads=1

      # INT-06 envelope, deny fixtures and server-owned one-shot fence.
      - name: Run domain connector credential fixtures
        run: cargo test -p kiana-domain --test int06_connector_credential --locked -- --test-threads=1
      - name: Run Broker connector credential fixtures
        run: cargo test -p kiana-capability-broker --test int06_connector_credential --locked -- --test-threads=1
      - name: Run core connector credential guard
        run: cargo test -p kiana-core --test int06_connector_credential_guard --locked -- --test-threads=1
      - name: Run Runner credential boundary guard
        run: cargo test -p kiana-runner --test int06_connector_credential_guard --locked -- --test-threads=1

      - name: Compile domain connector credential target
        run: cargo test -p kiana-domain --test int06_connector_credential --no-run --locked
      - name: Compile Broker connector credential target
        run: cargo test -p kiana-capability-broker --test int06_connector_credential --no-run --locked
      - name: Compile core connector credential guard target
        run: cargo test -p kiana-core --test int06_connector_credential_guard --no-run --locked
      - name: Compile Runner credential boundary guard target
        run: cargo test -p kiana-runner --test int06_connector_credential_guard --no-run --locked
