name: P3-I-03 company chain replay

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-core/tests/p3_i03_company_chain.rs"
      - "kiana-domain/tests/co06_artifact.rs"
      - "kiana-domain/tests/co07_receipt.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/tests/co06_artifact_guard.rs"
      - "kiana-core/tests/co07_receipt_guard.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i03-company-chain-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i03-company-chain.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-core/tests/p3_i03_company_chain.rs"
      - "kiana-domain/tests/co06_artifact.rs"
      - "kiana-domain/tests/co07_receipt.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/tests/co06_artifact_guard.rs"
      - "kiana-core/tests/co07_receipt_guard.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i03-company-chain-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i03-company-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-chain-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run company chain source guard
        run: cargo test -p kiana-core --test p3_i03_company_chain --locked -- --test-threads=1
      - name: Run Company replay fixtures
        run: cargo test -p kiana-domain --test co08_replay --locked -- --test-threads=1
      - name: Run artifact and receipt regressions
        run: cargo test -p kiana-domain --test co06_artifact --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test co07_receipt --locked -- --test-threads=1
      - name: Run Company governance chain regression
        run: cargo test -p kiana-core --test oa27_company_governance --locked -- --test-threads=1
      - name: Compile P3-I-03 targets
        run: cargo check --workspace --tests --locked
