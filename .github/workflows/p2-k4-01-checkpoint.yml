name: P2-K4-01 artifact checkpoint

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-daemon/src/workspace_checkpoints.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-core/tests/p2_k4_01_checkpoint.rs"
      - "kiana-core/tests/p1_h03_path_containment_guard.rs"
      - "kiana-core/tests/er07_replay_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k4-01-artifact-checkpoint-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k4-01-checkpoint.yml"
  pull_request:
    paths:
      - "kiana-domain/src/platform.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-daemon/src/workspace_checkpoints.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-core/tests/p2_k4_01_checkpoint.rs"
      - "kiana-core/tests/p1_h03_path_containment_guard.rs"
      - "kiana-core/tests/er07_replay_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k4-01-artifact-checkpoint-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k4-01-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run checkpoint source guard
        run: cargo test -p kiana-core --test p2_k4_01_checkpoint --locked -- --test-threads=1
      - name: Run path containment regression
        run: cargo test -p kiana-core --test p1_h03_path_containment_guard --locked -- --test-threads=1
      - name: Run replay checkpoint regression
        run: cargo test -p kiana-core --test er07_replay_guard --locked -- --test-threads=1
      - name: Compile P2-K4-01 targets
        run: cargo check --workspace --tests --locked

