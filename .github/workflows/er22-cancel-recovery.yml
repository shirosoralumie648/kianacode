name: ER-22 cancel recovery and stop confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-recovery:
    name: ER-22 cancellation recovery fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run P0 cancellation guards
        run: cargo test -p kiana-core --test p0_j1_01_cancellation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p0_j1_02_cancellation_guard --locked -- --test-threads=1
      - name: Run CP-15 and SC-15 cancellation fixtures
        run: cargo test -p kiana-core --test cp15_cancellation_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc15_cancel_unknown_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test sc15_cancel_unknown --locked -- --test-threads=1
      - name: Run lifecycle and runner cancellation guards
        run: cargo test -p kiana-core --test h02_lifecycle --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h08_cancellation_guard --locked -- --test-threads=1
      - name: Run ER-22 source guard
        run: cargo test -p kiana-core --test er22_cancel_recovery_guard --locked -- --test-threads=1
      - name: Run ER-22 cancellation behaviour fixtures
        run: cargo test -p kiana-core --test control_plane cancel --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test control_plane late_result_cannot_resurrect_run --locked -- --test-threads=1
      - name: Run daemon cancellation stop-confirmation fixtures
        run: cargo test -p kiana-daemon --test daemon_host cancelling_mid_stream_never_completes_or_emits_a_late_delta --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test daemon_host cancel_stops_in_flight_shell_before_it_writes --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test daemon_host cancel_after_awaiting_approval_rejects_later_approve --locked -- --test-threads=1
      - name: Compile ER-22 Core guard targets
        run: cargo test -p kiana-core --test p0_j1_01_cancellation_guard --no-run --locked
      - run: cargo test -p kiana-core --test p0_j1_02_cancellation_guard --no-run --locked
      - run: cargo test -p kiana-core --test cp15_cancellation_guard --no-run --locked
      - run: cargo test -p kiana-core --test sc15_cancel_unknown_guard --no-run --locked
      - run: cargo test -p kiana-core --test sc15_cancel_unknown --no-run --locked
      - run: cargo test -p kiana-core --test h02_lifecycle --no-run --locked
      - name: Compile ER-22 runner guard target
        run: cargo test -p kiana-runner --test h08_cancellation_guard --no-run --locked
      - name: Compile ER-22 source guard target
        run: cargo test -p kiana-core --test er22_cancel_recovery_guard --no-run --locked
      - name: Compile ER-22 behaviour fixture target
        run: cargo test -p kiana-core --test control_plane --no-run --locked
      - name: Compile ER-22 daemon stop-confirmation target
        run: cargo test -p kiana-daemon --test daemon_host --no-run --locked
