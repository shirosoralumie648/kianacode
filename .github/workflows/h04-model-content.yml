name: H04 structured model content

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/h04_model_content.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/h04_model_content_guard.rs"
      - "kiana-runner/src/model.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap/harness-model-content-baseline.md"
      - ".github/workflows/h04-model-content.yml"
  pull_request:
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/h04_model_content.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/h04_model_content_guard.rs"
      - "kiana-runner/src/model.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap/harness-model-content-baseline.md"
      - ".github/workflows/h04-model-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H04 domain content fixtures
        run: cargo test -p kiana-domain --test h04_model_content --locked -- --test-threads=1
      - name: Run H04 provider content guard
        run: cargo test -p kiana-provider --test h04_model_content_guard --locked -- --test-threads=1
