name: p4-j7-12-request-compilation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run P4-J7-12 request-compilation fixtures
        run: cargo test -p kiana-domain --test p4_j7_12_request_compilation --locked -- --test-threads=1
      - name: Run P4-J7-12 source guard
        run: cargo test -p kiana-core --test p4_j7_12_request_compilation_guard --locked -- --test-threads=1
      - name: Compile provider request path
        run: cargo check -p kiana-provider --tests --locked
