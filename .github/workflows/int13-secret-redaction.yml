name: "INT-13 secret redaction and echo sentinels"

on:
  workflow_dispatch:

permissions:
  contents: read

# Automatic coverage stays in the unified `ci.yml` shards: `kiana-domain-s3/4` lists
# `int13_secret_redaction`, `kiana-core-s4/6` lists `int13_secret_redaction_guard`, and the
# whole-crate `kiana-daemon`, `kiana-eventlog` and `kiana-entrypoints` shards run the new
# targets (including the daemon `shell_secret_sentinels_do_not_reach_events_receipt_or_model_context`
# argv/stdout/stderr/env behaviour fixture) without any extra fan-out. This manual lane adds a
# focused receipt for the same fixtures.

jobs:
  int13-secret-redaction:
    name: "INT-13 secret redaction and echo sentinels"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain scanner: nine projection channels, token/API-key/header/JWT/URL-userinfo/lease
      # shapes, bounded echo-sentinel sets and the bounded provider raw-error projection.
      - name: Run domain secret sentinel fixtures
        run: cargo test -p kiana-domain --test int13_secret_redaction --locked -- --test-threads=1
      # Event storage boundary: shapes that `redact_text()` does not rewrite (sk- keys,
      # proxy-authorization text, NUL) are refused before any fact or journal file exists, while
      # already-redacted payloads round-trip byte-stable.
      - name: Run EventStore redaction fixtures
        run: cargo test -p kiana-eventlog --test int13_event_redaction --locked -- --test-threads=1
      # Core producer boundary: event payload scan, stable redaction and receipt fail-closed
      # projection stay wired, plus the domain fixture names this lane relies on.
      - name: Run core Event/Receipt source guard
        run: cargo test -p kiana-core --test int13_secret_redaction_guard --locked -- --test-threads=1
      # Daemon channel fixtures: stdout/stderr previews are redacted and bounded, and the
      # end-to-end argv/stdout/stderr/env projection fixture is pinned by source guard.
      - name: Run daemon process-channel fixtures
        run: cargo test -p kiana-daemon --lib execution_output::int13_channels --locked -- --test-threads=1
      - name: Run daemon process-channel source guard
        run: cargo test -p kiana-daemon --test int13_secret_redaction_guard --locked -- --test-threads=1
      # Workbench/UI fixtures: every stream event kind is scrubbed before it becomes a display
      # row, and the terminal status stays a fact while secrets are hidden.
      - name: Run Workbench timeline redaction fixtures
        run: cargo test -p kiana-entrypoints --test int13_secret_redaction --locked -- --test-threads=1
      - name: Run Workbench/UI source guard
        run: cargo test -p kiana-entrypoints --test int13_secret_redaction_guard --locked -- --test-threads=1

      - name: Compile domain int13 target
        run: cargo test -p kiana-domain --test int13_secret_redaction --no-run --locked
      - name: Compile EventStore int13 target
        run: cargo test -p kiana-eventlog --test int13_event_redaction --no-run --locked
      - name: Compile core int13 guard target
        run: cargo test -p kiana-core --test int13_secret_redaction_guard --no-run --locked
      - name: Compile daemon int13 lib fixtures
        run: cargo test -p kiana-daemon --lib execution_output::int13_channels --no-run --locked
      - name: Compile daemon int13 guard target
        run: cargo test -p kiana-daemon --test int13_secret_redaction_guard --no-run --locked
      - name: Compile entrypoint int13 UI target
        run: cargo test -p kiana-entrypoints --test int13_secret_redaction --no-run --locked
      - name: Compile entrypoint int13 guard target
        run: cargo test -p kiana-entrypoints --test int13_secret_redaction_guard --no-run --locked
