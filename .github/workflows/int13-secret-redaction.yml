name: INT-13 secret redaction and echo sentinels

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int13_secret_redaction.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-core/tests/int13_secret_redaction_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/execution_output.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/tests/int13_secret_redaction_guard.rs"
      - "kiana-entrypoints/src/workbench_render.rs"
      - "kiana-entrypoints/tests/int13_secret_redaction_guard.rs"
      - "docs/roadmap/int13-secret-redaction-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int13-secret-redaction.yml"
  pull_request:
    paths:
      - "kiana-domain/src/redaction.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int13_secret_redaction.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-core/tests/int13_secret_redaction_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-daemon/src/execution_output.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/tests/int13_secret_redaction_guard.rs"
      - "kiana-entrypoints/src/workbench_render.rs"
      - "kiana-entrypoints/tests/int13_secret_redaction_guard.rs"
      - "docs/roadmap/int13-secret-redaction-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int13-secret-redaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain secret shape and echo fixtures
        run: cargo test -p kiana-domain --test int13_secret_redaction --locked -- --test-threads=1
      - name: Run EventLog and Receipt source guard
        run: cargo test -p kiana-core --test int13_secret_redaction_guard --locked -- --test-threads=1
      - name: Run daemon process-channel source guard
        run: cargo test -p kiana-daemon --test int13_secret_redaction_guard --locked -- --test-threads=1
      - name: Run Workbench/UI source guard
        run: cargo test -p kiana-entrypoints --test int13_secret_redaction_guard --locked -- --test-threads=1
      - name: Compile INT-13 workspace targets
        run: cargo check --workspace --tests --locked
