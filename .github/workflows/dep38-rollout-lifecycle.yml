name: DEP-38 rollout lifecycle boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/rollout_lifecycle.rs"
      - "kiana-domain/src/rollout_lifecycle_evidence.rs"
      - "kiana-domain/tests/dep38_rollout_lifecycle_evidence.rs"
      - "kiana-domain/src/orchestrated_rollout.rs"
      - "kiana-domain/src/revision_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep38_rollout_lifecycle.rs"
      - "kiana-core/tests/dep38_rollout_lifecycle_guard.rs"
      - "docs/roadmap/dep38-rollout-lifecycle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep38-rollout-lifecycle.yml"
  pull_request:
    paths:
      - "kiana-domain/src/rollout_lifecycle.rs"
      - "kiana-domain/src/rollout_lifecycle_evidence.rs"
      - "kiana-domain/tests/dep38_rollout_lifecycle_evidence.rs"
      - "kiana-domain/src/orchestrated_rollout.rs"
      - "kiana-domain/src/revision_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep38_rollout_lifecycle.rs"
      - "kiana-core/tests/dep38_rollout_lifecycle_guard.rs"
      - "docs/roadmap/dep38-rollout-lifecycle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep38-rollout-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollout-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-38 rollout lifecycle fixture
        run: cargo test -p kiana-domain --test dep38_rollout_lifecycle --locked -- --test-threads=1
      - name: Run DEP-38 lifecycle evidence fixture
        run: cargo test -p kiana-domain --test dep38_rollout_lifecycle_evidence --locked -- --test-threads=1
      - name: Run DEP-38 source guard
        run: cargo test -p kiana-core --test dep38_rollout_lifecycle_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
