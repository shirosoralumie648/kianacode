name: co43-company-parallel

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_parallel.rs"
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co43_company_parallel.rs"
      - "kiana-core/src/company_parallel.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/co43_company_parallel_guard.rs"
      - "docs/roadmap/co43-company-parallel-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co43-company-parallel.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_parallel.rs"
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co43_company_parallel.rs"
      - "kiana-core/src/company_parallel.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/tests/co43_company_parallel_guard.rs"
      - "docs/roadmap/co43-company-parallel-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co43-company-parallel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-43 bounded parallel fixtures
        run: cargo test -p kiana-domain --test co43_company_parallel --locked -- --test-threads=1
      - name: Run CO-43 Swarm/Cell boundary guard
        run: cargo test -p kiana-core --test co43_company_parallel_guard --locked -- --test-threads=1
      - name: Compile CO-43 parallel targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
