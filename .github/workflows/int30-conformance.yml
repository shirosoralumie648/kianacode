name: INT-30 connector conformance

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_conformance.rs"
      - "kiana-domain/src/connector_fixture.rs"
      - "kiana-domain/src/connector_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_conformance.rs"
      - "kiana-core/src/connector_conformance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int30_connector_conformance_guard.rs"
      - "docs/roadmap/int30-conformance-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int30-conformance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_conformance.rs"
      - "kiana-domain/src/connector_fixture.rs"
      - "kiana-domain/src/connector_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_conformance.rs"
      - "kiana-core/src/connector_conformance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int30_connector_conformance_guard.rs"
      - "docs/roadmap/int30-conformance-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int30-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-30 domain fixtures
        run: cargo test -p kiana-domain --test connector_conformance --locked -- --test-threads=1
      - name: Run INT-30 Core source guard
        run: cargo test -p kiana-core --test int30_connector_conformance_guard --locked -- --test-threads=1
      - name: Compile INT-30 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
