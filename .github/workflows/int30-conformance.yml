name: "INT-30 connector conformance baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int30-conformance:
    name: "INT-30 connector conformance baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core int30_connector_conformance_guard
        run: cargo test -p kiana-core --test int30_connector_conformance_guard --locked -- --test-threads=1
