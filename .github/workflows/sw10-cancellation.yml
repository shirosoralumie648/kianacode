name: SW-10 cancellation and fence

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_cancellation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_cancellation.rs"
      - "kiana-core/src/swarm_cancellation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_cancellation_guard.rs"
      - "docs/roadmap/sw10-cancellation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw10-cancellation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_cancellation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_cancellation.rs"
      - "kiana-core/src/swarm_cancellation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_cancellation_guard.rs"
      - "docs/roadmap/sw10-cancellation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw10-cancellation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-10 domain cancellation fixtures
        run: cargo test -p kiana-domain --test swarm_cancellation --locked -- --test-threads=1
      - name: Run SW-10 Core source guard
        run: cargo test -p kiana-core --test swarm_cancellation_guard --locked -- --test-threads=1
      - name: Compile SW-10 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
