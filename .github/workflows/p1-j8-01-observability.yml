name: P1-J8-01 observability receipt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/capability_attempt_projection.rs"
      - "kiana-core/src/model_attempt_projection.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-policy/src/security.rs"
      - "kiana-core/tests/p1_j8_01_observability.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j8-01-observability-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j8-01-observability.yml"
  pull_request:
    paths:
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/capability_attempt_projection.rs"
      - "kiana-core/src/model_attempt_projection.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-policy/src/security.rs"
      - "kiana-core/tests/p1_j8_01_observability.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j8-01-observability-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j8-01-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run observability receipt source guard
        run: cargo test -p kiana-core --test p1_j8_01_observability --locked -- --test-threads=1
      - name: Run provider/model projection fixtures
        run: cargo test -p kiana-core --test oa08_model_instrumentation --locked -- --test-threads=1
      - name: Run capability projection fixtures
        run: cargo test -p kiana-core --test oa09_capability_instrumentation --locked -- --test-threads=1
      - name: Compile P1-J8-01 targets
        run: cargo check --workspace --tests --locked

