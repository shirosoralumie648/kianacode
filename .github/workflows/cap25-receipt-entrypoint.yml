name: CAP-25 receipt and entrypoint parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-entrypoint-parity:
    name: CAP-25 receipt and parity fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run receipt contract fixtures
        run: cargo test -p kiana-domain --test cp14_result_receipt --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test er11_receipt_contracts --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test er12_receipt_aggregation --locked -- --test-threads=1
      - name: Run parity and stream fixtures
        run: cargo test -p kiana-core --test oa24_entrypoint_parity --locked -- --test-threads=1
      - run: cargo test -p kiana-entrypoints --test cp22_protocol_surfaces --locked -- --test-threads=1
      - run: cargo test -p kiana-entrypoints --test p2_m5_01_web_sync --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --lib run_stream::tests --locked -- --test-threads=1
      - name: Run existing parity guard
        run: cargo test -p kiana-core --test er27_entrypoint_parity_guard --locked -- --test-threads=1
      - name: Run CAP-25 source guard
        run: cargo test -p kiana-core --test cap25_receipt_entrypoint_guard --locked -- --test-threads=1
      - name: Compile selected domain targets
        run: cargo test -p kiana-domain --test cp14_result_receipt --no-run --locked
      - run: cargo test -p kiana-domain --test er11_receipt_contracts --no-run --locked
      - run: cargo test -p kiana-domain --test er12_receipt_aggregation --no-run --locked
      - name: Compile selected Core and entrypoint targets
        run: cargo test -p kiana-core --test cap25_receipt_entrypoint_guard --no-run --locked
      - run: cargo test -p kiana-core --test oa24_entrypoint_parity --no-run --locked
      - run: cargo test -p kiana-core --test er27_entrypoint_parity_guard --no-run --locked
      - run: cargo test -p kiana-entrypoints --test cp22_protocol_surfaces --no-run --locked
      - run: cargo test -p kiana-entrypoints --test p2_m5_01_web_sync --no-run --locked
      - name: Compile daemon stream target
        run: cargo test -p kiana-daemon --lib --no-run --locked
