name: SC-15 cancellation fencing and unknown reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-unknown:
    name: SC-15 cancellation and unknown fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run SC-15 cancellation facts
        run: cargo test -p kiana-core --test sc15_cancel_unknown --locked -- --test-threads=1
      - name: Run SC-15 source guard
        run: cargo test -p kiana-core --test sc15_cancel_unknown_guard --locked -- --test-threads=1
      - name: Run H08 runner cancellation guard
        run: cargo test -p kiana-runner --test h08_cancellation_guard --locked -- --test-threads=1
      - name: Compile SC-15 Core fact target
        run: cargo test -p kiana-core --test sc15_cancel_unknown --no-run --locked
      - name: Compile SC-15 Core guard target
        run: cargo test -p kiana-core --test sc15_cancel_unknown_guard --no-run --locked
      - name: Compile H08 runner guard target
        run: cargo test -p kiana-runner --test h08_cancellation_guard --no-run --locked
