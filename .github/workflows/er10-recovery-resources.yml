name: ER-10 recovery resource projection

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/recovery_resources.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-domain/src/resource_leases.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er10_recovery_resources.rs"
      - "kiana-core/src/resource_projection.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er10_resource_projection.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-resource-projection-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er10-recovery-resources.yml"
  pull_request:
    paths:
      - "kiana-domain/src/recovery_resources.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-domain/src/resource_leases.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er10_recovery_resources.rs"
      - "kiana-core/src/resource_projection.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er10_resource_projection.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-resource-projection-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er10-recovery-resources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-10 resource projection fixtures
        run: cargo test -p kiana-domain --test er10_recovery_resources --locked -- --test-threads=1
      - name: Run ER-10 resource projection fixtures
        run: cargo test -p kiana-core --test er10_resource_projection --locked -- --test-threads=1
      - name: Compile ER-10 targets
        run: cargo check --workspace --tests --locked
