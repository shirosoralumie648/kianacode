name: h22-compaction

on:
  push:
    paths:
      - 'kiana-domain/src/compact_summary.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/src/model.rs'
      - 'kiana-domain/tests/h22_compact_summary.rs'
      - 'kiana-runner/src/compact.rs'
      - 'kiana-runner/src/harness.rs'
      - 'kiana-runner/tests/h22_compact_guard.rs'
      - '.github/workflows/h22-compaction.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/compact_summary.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/src/model.rs'
      - 'kiana-domain/tests/h22_compact_summary.rs'
      - 'kiana-runner/src/compact.rs'
      - 'kiana-runner/src/harness.rs'
      - 'kiana-runner/tests/h22_compact_guard.rs'
      - '.github/workflows/h22-compaction.yml'

jobs:
  compaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked --offline
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test h22_compact_summary --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h22_compact_guard --locked -- --test-threads=1
