name: P2-M5-01 web snapshot sync

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/web_page.html"
      - "kiana-entrypoints/tests/cli_web.rs"
      - "kiana-entrypoints/tests/p2_m5_01_web_sync.rs"
      - "kiana-daemon/src/run_stream.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-m5-01-web-sync-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-m5-01-web-sync.yml"
  pull_request:
    paths:
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/web_page.html"
      - "kiana-entrypoints/tests/cli_web.rs"
      - "kiana-entrypoints/tests/p2_m5_01_web_sync.rs"
      - "kiana-daemon/src/run_stream.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-m5-01-web-sync-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-m5-01-web-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run web sync source guard
        run: cargo test -p kiana-entrypoints --test p2_m5_01_web_sync --locked -- --test-threads=1
      - name: Run reconnect acceptance
        run: cargo test -p kiana-entrypoints --test cli_web web_sse_reconnect_emits_stream_gap_without_replaying_delta_items --locked -- --test-threads=1
      - name: Run web gap projection regression
        run: cargo test -p kiana-entrypoints --lib web_sse_gap_event_is_machine_readable_with_run_id_and_reason --locked -- --test-threads=1
      - name: Compile P2-M5-01 targets
        run: cargo check --workspace --tests --locked
