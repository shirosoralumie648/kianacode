name: P1-K5-01 cost and capacity

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/usage.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-runner/src/budget.rs"
      - "kiana-domain/tests/p1_k5_01_cost_capacity.rs"
      - "kiana-core/tests/p1_k5_01_cost_capacity_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-k5-01-cost-capacity-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-k5-01-cost-capacity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/usage.rs"
      - "kiana-domain/src/budget_contracts.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-runner/src/budget.rs"
      - "kiana-domain/tests/p1_k5_01_cost_capacity.rs"
      - "kiana-core/tests/p1_k5_01_cost_capacity_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-k5-01-cost-capacity-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-k5-01-cost-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run cost and capacity domain fixtures
        run: cargo test -p kiana-domain --test p1_k5_01_cost_capacity --locked -- --test-threads=1
      - name: Run budget boundary source guard
        run: cargo test -p kiana-core --test p1_k5_01_cost_capacity_guard --locked -- --test-threads=1
      - name: Run CP-11 budget regression
        run: cargo test -p kiana-domain --test cp11_budget_contracts --locked -- --test-threads=1
      - name: Run H-07 runner budget regression
        run: cargo test -p kiana-runner --test h07_budget --locked -- --test-threads=1
      - name: Compile P1-K5-01 targets
        run: cargo check --workspace --tests --locked

