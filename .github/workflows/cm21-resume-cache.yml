name: cm21-resume-cache

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/context_invalidation.rs"
      - "kiana-domain/src/context_checkpoint.rs"
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/request_budget.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm21_resume_cache_invalidation.rs"
      - "kiana-core/tests/cm21_resume_cache_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm21-resume-cache-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm21-resume-cache.yml"
  pull_request:
    paths:
      - "kiana-domain/src/context_invalidation.rs"
      - "kiana-domain/src/context_checkpoint.rs"
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/request_budget.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm21_resume_cache_invalidation.rs"
      - "kiana-core/tests/cm21_resume_cache_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm21-resume-cache-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm21-resume-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-21 resume/cache fixtures
        run: cargo test -p kiana-domain --test cm21_resume_cache_invalidation --locked -- --test-threads=1
      - name: Run CM-21 source guard
        run: cargo test -p kiana-core --test cm21_resume_cache_guard --locked -- --test-threads=1
