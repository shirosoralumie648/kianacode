name: "EXT-30 · Extension crash recovery baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext30-extension-recovery:
    name: "EXT-30 · Extension crash recovery baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core ext30_extension_recovery_guard
        run: cargo test -p kiana-core --test ext30_extension_recovery_guard --locked -- --test-threads=1
      - name: Run kiana-domain ext30_extension_recovery
        run: cargo test -p kiana-domain --test ext30_extension_recovery --locked -- --test-threads=1
