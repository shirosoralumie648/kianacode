name: EXT-30 extension recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/extension_recovery.rs"
      - "kiana-domain/src/extension_lifecycle.rs"
      - "kiana-domain/src/extension_state.rs"
      - "kiana-domain/src/extension_commands.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-domain/tests/ext30_extension_recovery.rs"
      - "kiana-domain/tests/fixtures/ext30-extension-recovery.json"
      - "kiana-core/tests/ext30_extension_recovery_guard.rs"
      - "docs/roadmap/ext30-extension-recovery-baseline.md"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext30-extension-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/extension_recovery.rs"
      - "kiana-domain/src/extension_lifecycle.rs"
      - "kiana-domain/src/extension_state.rs"
      - "kiana-domain/src/extension_commands.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-domain/tests/ext30_extension_recovery.rs"
      - "kiana-domain/tests/fixtures/ext30-extension-recovery.json"
      - "kiana-core/tests/ext30_extension_recovery_guard.rs"
      - "docs/roadmap/ext30-extension-recovery-baseline.md"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext30-extension-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-30 recovery domain fixtures
        run: cargo test -p kiana-domain --test ext30_extension_recovery --locked -- --test-threads=1
      - name: Run EXT-30 source guard
        run: cargo test -p kiana-core --test ext30_extension_recovery_guard --locked -- --test-threads=1
      - name: Compile EXT-30 targets
        run: cargo check --workspace --tests --locked
