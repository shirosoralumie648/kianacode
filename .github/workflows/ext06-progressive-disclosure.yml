name: EXT-06 progressive disclosure

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-skills/src/disclosure.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/tests/ext06_progressive_disclosure.rs"
      - "kiana-daemon/src/harness_skills.rs"
      - "kiana-core/tests/ext06_progressive_disclosure_guard.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext06-progressive-disclosure-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext06-progressive-disclosure.yml"
  pull_request:
    paths:
      - "kiana-skills/src/disclosure.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/tests/ext06_progressive_disclosure.rs"
      - "kiana-daemon/src/harness_skills.rs"
      - "kiana-core/tests/ext06_progressive_disclosure_guard.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext06-progressive-disclosure-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext06-progressive-disclosure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progressive-disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-06 disclosure fixtures
        run: cargo test -p kiana-skills --test ext06_progressive_disclosure --locked -- --test-threads=1
      - name: Run EXT-06 source guard
        run: cargo test -p kiana-core --test ext06_progressive_disclosure_guard --locked -- --test-threads=1
      - name: Compile EXT-06 targets
        run: cargo check -p kiana-skills -p kiana-daemon --tests --locked
