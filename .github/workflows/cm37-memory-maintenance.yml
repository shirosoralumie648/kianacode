name: "CM-37 · Cache, index and retention maintenance baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cm37-memory-maintenance:
    name: "CM-37 · Cache, index and retention maintenance baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core cm37_memory_maintenance_guard
        run: cargo test -p kiana-core --test cm37_memory_maintenance_guard --locked -- --test-threads=1
      - name: Run kiana-domain cm37_memory_maintenance
        run: cargo test -p kiana-domain --test cm37_memory_maintenance --locked -- --test-threads=1
