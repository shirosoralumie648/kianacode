name: BQ-03 usage accumulator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_usage.rs"
      - "kiana-domain/src/billing_usage_accumulator.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq03_usage_accumulator.rs"
      - "kiana-core/tests/bq03_usage_accumulator_guard.rs"
      - "docs/roadmap/billing-usage-accumulator-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq03-usage-accumulator.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_usage.rs"
      - "kiana-domain/src/billing_usage_accumulator.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq03_usage_accumulator.rs"
      - "kiana-core/tests/bq03_usage_accumulator_guard.rs"
      - "docs/roadmap/billing-usage-accumulator-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq03-usage-accumulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-accumulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run usage accumulator fixtures
        run: cargo test -p kiana-domain --test bq03_usage_accumulator --locked -- --test-threads=1
      - name: Run usage accumulator source guard
        run: cargo test -p kiana-core --test bq03_usage_accumulator_guard --locked -- --test-threads=1
      - name: Compile BQ-03 targets
        run: cargo check --workspace --tests --locked
