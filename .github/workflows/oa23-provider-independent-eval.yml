name: oa23-provider-independent-eval

on:
  push:
    paths:
      - "kiana-domain/src/eval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/eval.rs"
      - "kiana-core/src/replay_diagnostics.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa23_provider_independent_eval.rs"
      - ".github/workflows/oa23-provider-independent-eval.yml"
  pull_request:
    paths:
      - "kiana-domain/src/eval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/eval.rs"
      - "kiana-core/src/replay_diagnostics.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa23_provider_independent_eval.rs"
      - ".github/workflows/oa23-provider-independent-eval.yml"

permissions:
  contents: read

jobs:
  oa23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa23-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-23 remote-only eval fixtures
        run: cargo test -p kiana-core --test oa23_provider_independent_eval --locked -- --test-threads=1
