name: int03-connector-operation

on:
  push:
    paths:
      - 'kiana-domain/src/connector_operation.rs'
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int03_connector_operation.rs'
      - 'kiana-core/tests/int03_connector_operation_guard.rs'
      - '.github/workflows/int03-connector-operation.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/connector_operation.rs'
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/int03_connector_operation.rs'
      - 'kiana-core/tests/int03_connector_operation_guard.rs'
      - '.github/workflows/int03-connector-operation.yml'

permissions:
  contents: read

jobs:
  connector-operation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test int03_connector_operation --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test int03_connector_operation_guard --locked -- --test-threads=1
