name: INT-32 connector write pilot gate

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_write_pilot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_write_pilot.rs"
      - "kiana-core/src/connector_write_pilot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int32_connector_write_pilot_guard.rs"
      - "docs/roadmap/int32-write-pilot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int32-write-pilot.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_write_pilot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_write_pilot.rs"
      - "kiana-core/src/connector_write_pilot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int32_connector_write_pilot_guard.rs"
      - "docs/roadmap/int32-write-pilot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int32-write-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-write-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-32 domain fixtures
        run: cargo test -p kiana-domain --test connector_write_pilot --locked -- --test-threads=1
      - name: Run INT-32 Core source guard
        run: cargo test -p kiana-core --test int32_connector_write_pilot_guard --locked -- --test-threads=1
      - name: Compile INT-32 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
