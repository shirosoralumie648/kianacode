name: p4-j7-15-anthropic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anthropic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run P4-J7-15 Anthropic fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run P4-J7-15 source guard
        run: cargo test -p kiana-core --test p4_j7_15_anthropic_guard --locked -- --test-threads=1
