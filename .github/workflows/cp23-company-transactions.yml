name: "CP-23 Company transactions baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp23-company-transactions:
    name: "CP-23 Company transactions baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core cp23_company_transaction_guard
        run: cargo test -p kiana-core --test cp23_company_transaction_guard --locked -- --test-threads=1
      - name: Run kiana-domain cp23_company_policy
        run: cargo test -p kiana-domain --test cp23_company_policy --locked -- --test-threads=1
