name: "UI-07 typed client query/feed/action API"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui07-typed-client:
    name: "UI-07 typed client query/feed/action API"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui07_typed_clients
        run: cargo test -p kiana-client --test ui07_typed_clients --locked -- --test-threads=1
      - name: Run kiana-core ui07_typed_client_guard
        run: cargo test -p kiana-core --test ui07_typed_client_guard --locked -- --test-threads=1
      - name: Run kiana-daemon ui07_typed_client_guard
        run: cargo test -p kiana-daemon --test ui07_typed_client_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-client -p kiana-core -p kiana-daemon --no-run --locked
