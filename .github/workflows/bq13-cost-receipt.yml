name: BQ-13 cost receipt breakdown

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_cost.rs"
      - "kiana-domain/src/receipt_aggregation.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq13_cost_receipt.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/bq13_cost_receipt.rs"
      - "kiana-core/tests/bq13_cost_receipt_guard.rs"
      - "kiana-query/src/cost_projector.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/bq13_cost_projector.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/bq13-cost-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq13-cost-receipt.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_cost.rs"
      - "kiana-domain/src/receipt_aggregation.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq13_cost_receipt.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/bq13_cost_receipt.rs"
      - "kiana-core/tests/bq13_cost_receipt_guard.rs"
      - "kiana-query/src/cost_projector.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/bq13_cost_projector.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/bq13-cost-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq13-cost-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run BQ-13 domain fixtures
        run: cargo test -p kiana-domain --test bq13_cost_receipt --locked -- --test-threads=1
      - name: Run BQ-13 core receipt fixtures
        run: cargo test -p kiana-core --test bq13_cost_receipt --locked -- --test-threads=1
      - name: Run BQ-13 core source guard
        run: cargo test -p kiana-core --test bq13_cost_receipt_guard --locked -- --test-threads=1
      - name: Run BQ-13 query projector fixtures
        run: cargo test -p kiana-query --test bq13_cost_projector --locked -- --test-threads=1
      - name: Compile BQ-13 targets
        run: cargo check --workspace --tests --locked
