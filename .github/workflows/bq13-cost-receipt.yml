name: BQ-13 cost receipt breakdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-receipt:
    name: BQ-13 cost breakdown fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-13 domain fixtures
        run: cargo test -p kiana-domain --test bq13_cost_receipt --locked -- --test-threads=1
      - name: Run BQ-13 core receipt fixtures
        run: cargo test -p kiana-core --test bq13_cost_receipt --locked -- --test-threads=1
      - name: Run BQ-13 core source guard
        run: cargo test -p kiana-core --test bq13_cost_receipt_guard --locked -- --test-threads=1
      - name: Run BQ-13 query projector fixtures
        run: cargo test -p kiana-query --test bq13_cost_projector --locked -- --test-threads=1
      - name: Compile BQ-13 domain target
        run: cargo test -p kiana-domain --test bq13_cost_receipt --no-run --locked
      - name: Compile BQ-13 core receipt target
        run: cargo test -p kiana-core --test bq13_cost_receipt --no-run --locked
      - name: Compile BQ-13 core guard target
        run: cargo test -p kiana-core --test bq13_cost_receipt_guard --no-run --locked
      - name: Compile BQ-13 query target
        run: cargo test -p kiana-query --test bq13_cost_projector --no-run --locked
