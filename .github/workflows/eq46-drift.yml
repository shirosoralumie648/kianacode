name: EQ-46 drift metrics and alert

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/quality_drift.rs"
      - "kiana-domain/src/versioning.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_drift.rs"
      - "kiana-core/src/quality_drift.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_drift_guard.rs"
      - "docs/roadmap/evaluation-drift-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq46-drift.yml"
  pull_request:
    paths:
      - "kiana-domain/src/quality_drift.rs"
      - "kiana-domain/src/versioning.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_drift.rs"
      - "kiana-core/src/quality_drift.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_drift_guard.rs"
      - "docs/roadmap/evaluation-drift-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq46-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-46 drift fixtures
        run: cargo test -p kiana-domain --test quality_drift --locked -- --test-threads=1
      - name: Run EQ-46 source guard
        run: cargo test -p kiana-core --test quality_drift_guard --locked -- --test-threads=1
      - name: Compile EQ-46 targets
        run: cargo check --workspace --tests --locked
