name: CP-03 action catalog and prepared action

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp03_action_contract.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/tests/cp03_action_guard.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/control-plane-action-baseline.md"
      - ".github/workflows/cp03-action-contract.yml"
  pull_request:
    paths:
      - "kiana-domain/src/actions.rs"
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp03_action_contract.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/tests/cp03_action_guard.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/control-plane-action-baseline.md"
      - ".github/workflows/cp03-action-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-03 domain action fixtures
        run: cargo test -p kiana-domain --test cp03_action_contract --locked -- --test-threads=1
      - name: Run CP-03 source guard
        run: cargo test -p kiana-core --test cp03_action_guard --locked -- --test-threads=1
