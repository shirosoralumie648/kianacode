name: SC-01 threat register

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threat-register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run SC-01 source fixture
        run: cargo test -p kiana-core --test sc01_threat_register --locked -- --test-threads=1
      - name: Compile SC-01 source fixture
        run: cargo test -p kiana-core --test sc01_threat_register --no-run --locked
