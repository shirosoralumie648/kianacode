name: H15 output bounds diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-bounds:
    name: H15 output bounds fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt -p kiana-daemon -p kiana-domain --check
      - name: Run domain output reference fixtures
        run: cargo test -p kiana-domain --test h15_output_ref --locked -- --test-threads=1
      - name: Run daemon output limit guard
        run: cargo test -p kiana-daemon --test h15_output_limits --locked -- --test-threads=1
      - name: Run daemon bounded capture and output read behavior fixtures
        run: cargo test -p kiana-daemon --lib --locked -- --test-threads=1 h15
      - name: Compile domain output reference target
        run: cargo test -p kiana-domain --test h15_output_ref --no-run --locked
      - name: Compile daemon output limit target
        run: cargo test -p kiana-daemon --test h15_output_limits --no-run --locked
      - name: Compile daemon behavior fixtures
        run: cargo test -p kiana-daemon --lib --no-run --locked
