name: PD-00 persistence baseline

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-eventlog/src/**"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/approval_store.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-query/src/index.rs"
      - "kiana-query/src/repo_map.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/projection.rs"
      - "kiana-core/tests/persistence_baseline.rs"
      - "docs/roadmap/persistence-data-layer-baseline.md"
      - ".github/workflows/pd00-baseline.yml"
  pull_request:
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-eventlog/src/**"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/approval_store.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-query/src/index.rs"
      - "kiana-query/src/repo_map.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/projection.rs"
      - "kiana-core/tests/persistence_baseline.rs"
      - "docs/roadmap/persistence-data-layer-baseline.md"
      - ".github/workflows/pd00-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Run PD-00 source-only guard
        run: cargo test -p kiana-core --test persistence_baseline --locked -- --test-threads=1
