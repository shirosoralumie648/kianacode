name: "INT-22 connector Unknown quarantine / reconciliation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int22-connector-reconciliation:
    name: "INT-22 connector Unknown quarantine / reconciliation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain quarantine contract: a timeout cannot be recorded as a failure, a quarantine never
      # authorizes a retry, evidence from another binding/account/operation/key/attempt is refused,
      # a reconciliation appends an append-only successor (never rewriting the original receipt),
      # and the Human Inbox item carries the safe/forbidden actions.
      - name: Run domain reconciliation fixtures
        run: cargo test -p kiana-domain --test int22_connector_reconciliation --locked -- --test-threads=1
      # Daemon boundary: an Unknown outcome is quarantined with a server-owned case and inbox item,
      # wire-supplied reconciliation material is refused before any fact, and an explicit reconcile
      # appends exactly one successor fact while the original event stays byte-identical.
      - name: Run daemon reconciliation boundary fixtures
        run: cargo test -p kiana-daemon --test int22_connector_reconciliation --locked -- --test-threads=1
      # Source guard: the contract is a pure server-owned value workflow, and the deny-first
      # fixtures stay wired to this lane and the automatic shards.
      - name: Run core reconciliation guard
        run: cargo test -p kiana-core --test int22_connector_reconciliation_guard --locked -- --test-threads=1

      - name: Compile domain reconciliation target
        run: cargo test -p kiana-domain --test int22_connector_reconciliation --no-run --locked
      - name: Compile daemon reconciliation target
        run: cargo test -p kiana-daemon --test int22_connector_reconciliation --no-run --locked
      - name: Compile core reconciliation guard target
        run: cargo test -p kiana-core --test int22_connector_reconciliation_guard --no-run --locked
