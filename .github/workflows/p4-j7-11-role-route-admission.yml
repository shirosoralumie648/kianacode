name: p4-j7-11-role-route-admission

on:
  push:
    paths:
      - 'kiana-domain/src/model_route.rs'
      - 'kiana-domain/src/budget_contracts.rs'
      - 'kiana-provider/src/gateway.rs'
      - 'kiana-core/tests/p4_j7_11_role_route_admission_guard.rs'
      - 'docs/roadmap/p4-j7-11-role-route-admission-baseline.md'
      - '.github/workflows/p4-j7-11-role-route-admission.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/model_route.rs'
      - 'kiana-domain/src/budget_contracts.rs'
      - 'kiana-provider/src/gateway.rs'
      - 'kiana-core/tests/p4_j7_11_role_route_admission_guard.rs'
      - 'docs/roadmap/p4-j7-11-role-route-admission-baseline.md'
      - '.github/workflows/p4-j7-11-role-route-admission.yml'

permissions:
  contents: read

jobs:
  role-route-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-core --test p4_j7_11_role_route_admission_guard --locked -- --test-threads=1
