name: CAP-34 capability conformance

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/capability_conformance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cap34_conformance.rs"
      - "kiana-core/tests/cap34_conformance_guard.rs"
      - "docs/roadmap/cap34-conformance-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap34-conformance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/capability_conformance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cap34_conformance.rs"
      - "kiana-core/tests/cap34_conformance_guard.rs"
      - "docs/roadmap/cap34-conformance-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap34-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CAP-34 matrix fixtures
        run: cargo test -p kiana-domain --test cap34_conformance --locked -- --test-threads=1
      - name: Run CAP-34 source guard
        run: cargo test -p kiana-core --test cap34_conformance_guard --locked -- --test-threads=1
      - name: Compile CAP-34 targets
        run: cargo check --workspace --tests --locked
