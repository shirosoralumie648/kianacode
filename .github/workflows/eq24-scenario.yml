name: EQ-24 evaluation scenario comparison

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-scenario-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq24-scenario.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-scenario-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq24-scenario.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run scenario fixtures
        run: cargo test -p kiana-quality --test eq24_scenario --locked -- --test-threads=1
      - name: Run scenario source guard
        run: cargo test -p kiana-quality --test eq24_scenario_guard --locked -- --test-threads=1
      - name: Compile EQ-24 targets
        run: cargo check --workspace --tests --locked
