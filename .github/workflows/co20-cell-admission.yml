name: co20-cell-admission

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/cell_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co20_cell_admission.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/tests/co20_cell_admission_guard.rs"
      - "docs/roadmap/co20-cell-admission-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co20-cell-admission.yml"
  pull_request:
    paths:
      - "kiana-domain/src/cell_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co20_cell_admission.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/tests/co20_cell_admission_guard.rs"
      - "docs/roadmap/co20-cell-admission-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co20-cell-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-20 admission fixtures
        run: cargo test -p kiana-domain --test co20_cell_admission --locked -- --test-threads=1
      - name: Run CO-20 admission source guard
        run: cargo test -p kiana-core --test co20_cell_admission_guard --locked -- --test-threads=1
      - name: Compile CO-20 Cell targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
