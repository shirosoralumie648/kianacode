name: H11 tool observations

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/errors.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h11_tool_observation.rs"
      - "kiana-runner/tests/h11_tool_observation_guard.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-tool-observation-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h11-tool-observation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/errors.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h11_tool_observation.rs"
      - "kiana-runner/tests/h11_tool_observation_guard.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-tool-observation-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h11-tool-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H11 observation fixtures
        run: cargo test -p kiana-runner --test h11_tool_observation --locked -- --test-threads=1
      - name: Run H11 source guard
        run: cargo test -p kiana-runner --test h11_tool_observation_guard --locked -- --test-threads=1
      - name: Compile H11 targets
        run: cargo check --workspace --tests --locked
