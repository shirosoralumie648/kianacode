name: oa17-query-cursor

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/oa17_query_cursor.rs"
      - ".github/workflows/oa17-query-cursor.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/oa17_query_cursor.rs"
      - ".github/workflows/oa17-query-cursor.yml"

permissions:
  contents: read

jobs:
  oa17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa17-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-17 remote-only fixtures
        run: cargo test -p kiana-core --test oa17_query_cursor --locked -- --test-threads=1
