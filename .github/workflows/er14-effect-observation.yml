name: ER-14 effect observation and provider receipt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/effect_observation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er14_effect_observation.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-core/tests/er14_effect_observation_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-effect-observation-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er14-effect-observation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/effect_observation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er14_effect_observation.rs"
      - "kiana-daemon/src/connectors.rs"
      - "kiana-core/tests/er14_effect_observation_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-effect-observation-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er14-effect-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-14 effect observation fixtures
        run: cargo test -p kiana-domain --test er14_effect_observation --locked -- --test-threads=1
      - name: Run ER-14 source guard
        run: cargo test -p kiana-core --test er14_effect_observation_guard --locked -- --test-threads=1
      - name: Compile ER-14 targets
        run: cargo check --workspace --tests --locked
