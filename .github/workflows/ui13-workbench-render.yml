name: "UI-13 Workbench timeline and result rendering"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui13-workbench-render:
    name: "UI-13 Workbench timeline and result rendering"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the timeline projection and deny-first render fixtures
        run: cargo test -p kiana-entrypoints --test ui13_workbench_render --locked -- --test-threads=1
      - name: Run the renderer boundary and completion-slice guards
        run: cargo test -p kiana-entrypoints --test ui13_workbench_render_guard --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
