name: co25-company-review

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_review.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co25_company_review.rs"
      - "kiana-core/src/company_review.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/co25_company_review_guard.rs"
      - "docs/roadmap/co25-company-review-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co25-company-review.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_review.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co25_company_review.rs"
      - "kiana-core/src/company_review.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/co25_company_review_guard.rs"
      - "docs/roadmap/co25-company-review-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co25-company-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-25 review fixtures
        run: cargo test -p kiana-domain --test co25_company_review --locked -- --test-threads=1
      - name: Run CO-25 review source guard
        run: cargo test -p kiana-core --test co25_company_review_guard --locked -- --test-threads=1
      - name: Compile CO-25 review targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
