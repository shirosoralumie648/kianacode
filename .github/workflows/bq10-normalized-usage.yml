name: BQ-10 normalized provider usage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalized-usage:
    name: BQ-10 normalized usage fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run normalized provider usage fixtures
        run: cargo test -p kiana-provider --test bq10_normalized_usage --locked -- --test-threads=1
      - name: Run BQ-10 Core source guard
        run: cargo test -p kiana-core --test bq10_normalized_usage_guard --locked -- --test-threads=1
      - name: Compile BQ-10 provider target
        run: cargo test -p kiana-provider --test bq10_normalized_usage --no-run --locked
      - name: Compile BQ-10 Core guard target
        run: cargo test -p kiana-core --test bq10_normalized_usage_guard --no-run --locked
