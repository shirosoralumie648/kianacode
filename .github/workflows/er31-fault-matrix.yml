name: er31-fault-matrix

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/er31_fault_matrix.rs"
      - "kiana-domain/src/fault.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er31_fault_matrix.rs"
      - "kiana-core/src/er31_fault_matrix.rs"
      - "kiana-core/src/fault_injection.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er31_fault_matrix_guard.rs"
      - "docs/roadmap/er31-fault-matrix-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er31-fault-matrix.yml"
  pull_request:
    paths:
      - "kiana-domain/src/er31_fault_matrix.rs"
      - "kiana-domain/src/fault.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er31_fault_matrix.rs"
      - "kiana-core/src/er31_fault_matrix.rs"
      - "kiana-core/src/fault_injection.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er31_fault_matrix_guard.rs"
      - "docs/roadmap/er31-fault-matrix-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er31-fault-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  er31-fault-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-31 fault matrix fixtures
        run: cargo test -p kiana-domain --test er31_fault_matrix --locked -- --test-threads=1
      - name: Run ER-31 Event/Receipt boundary guard
        run: cargo test -p kiana-core --test er31_fault_matrix_guard --locked -- --test-threads=1
      - name: Compile ER-31 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-eventlog --tests --locked
