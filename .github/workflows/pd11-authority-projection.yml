name: PD-11 authority projection

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/authority_read_model.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/pd11_authority_projection.rs"
      - "kiana-core/tests/pd11_authority_projection_guard.rs"
      - "docs/roadmap/pd11-authority-projection-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd11-authority-projection.yml"
  pull_request:
    paths:
      - "kiana-core/src/authority_read_model.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/pd11_authority_projection.rs"
      - "kiana-core/tests/pd11_authority_projection_guard.rs"
      - "docs/roadmap/pd11-authority-projection-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd11-authority-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run authority projection fixtures
        run: cargo test -p kiana-core --test pd11_authority_projection --locked -- --test-threads=1
      - name: Run authority projection source guard
        run: cargo test -p kiana-core --test pd11_authority_projection_guard --locked -- --test-threads=1
      - name: Compile PD-11 targets
        run: cargo check --workspace --tests --locked
