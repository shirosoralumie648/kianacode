name: EQ-29 capability safety evaluator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-capability-safety-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq29-capability-safety.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-capability-safety-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq29-capability-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-29 capability safety fixtures
        run: cargo test -p kiana-quality --test eq29_safety --locked -- --test-threads=1
      - name: Run EQ-29 source guard
        run: cargo test -p kiana-quality --test eq29_safety_guard --locked -- --test-threads=1
      - name: Compile EQ-29 targets
        run: cargo check --workspace --tests --locked
