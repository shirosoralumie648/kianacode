name: "EQ-29 capability and safety evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq29-capability-safety:
    name: "EQ-29 capability and safety evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq29_safety
        run: cargo test -p kiana-quality --test eq29_safety --locked -- --test-threads=1
      - name: Run kiana-quality eq29_safety_guard
        run: cargo test -p kiana-quality --test eq29_safety_guard --locked -- --test-threads=1
      - name: Compile kiana-quality eq29_safety
        run: cargo test -p kiana-quality --test eq29_safety --no-run --locked
      - name: Compile kiana-quality eq29_safety_guard
        run: cargo test -p kiana-quality --test eq29_safety_guard --no-run --locked
