name: aut23-surface-uat

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_surface_uat.rs"
      - "kiana-domain/src/automation_snapshot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_surface_uat.rs"
      - "kiana-core/src/automation_surface_uat.rs"
      - "kiana-core/src/automation_snapshot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_surface_uat_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/aut23-surface-uat-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut23-surface-uat.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_surface_uat.rs"
      - "kiana-domain/src/automation_snapshot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_surface_uat.rs"
      - "kiana-core/src/automation_surface_uat.rs"
      - "kiana-core/src/automation_snapshot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_surface_uat_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/aut23-surface-uat-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut23-surface-uat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run AUT-23 surface fixtures
        run: cargo test -p kiana-domain --test automation_surface_uat --locked -- --test-threads=1
      - name: Run AUT-23 spine guard
        run: cargo test -p kiana-core --test automation_surface_uat_guard --locked -- --test-threads=1
      - name: Compile AUT-23 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon -p kiana-protocol --tests --locked
