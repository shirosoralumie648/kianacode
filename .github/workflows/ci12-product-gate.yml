name: ci12-product-gate

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ci12_product_gate.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci12_product_gate.rs"
      - "kiana-core/src/ci12_product_gate.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ci12_product_gate_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-entrypoints/src/company_user_flow.rs"
      - "docs/roadmap/ci12-product-gate-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci12-product-gate.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ci12_product_gate.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci12_product_gate.rs"
      - "kiana-core/src/ci12_product_gate.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ci12_product_gate_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-entrypoints/src/company_user_flow.rs"
      - "docs/roadmap/ci12-product-gate-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci12-product-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci12-product-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CI-12 deny-first product fixtures
        run: cargo test -p kiana-domain --test ci12_product_gate --locked -- --test-threads=1
      - name: Run CI-12 source boundary guard
        run: cargo test -p kiana-core --test ci12_product_gate_guard --locked -- --test-threads=1
      - name: Compile CI-12 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon -p kiana-entrypoints --tests --locked
