name: "CI-12 product-chain deny-first and UAT baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci12-product-gate:
    name: "CI-12 product-chain deny-first and UAT baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core ci12_product_gate_guard
        run: cargo test -p kiana-core --test ci12_product_gate_guard --locked -- --test-threads=1
      - name: Run kiana-domain ci12_product_gate
        run: cargo test -p kiana-domain --test ci12_product_gate --locked -- --test-threads=1
