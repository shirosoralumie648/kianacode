name: "CO-46 Company template registry and research-report baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co46-company-template-registry:
    name: "CO-46 Company template registry and research-report baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co46_company_template_registry_guard
        run: cargo test -p kiana-core --test co46_company_template_registry_guard --locked -- --test-threads=1
      - name: Run kiana-domain co46_company_template_registry
        run: cargo test -p kiana-domain --test co46_company_template_registry --locked -- --test-threads=1
