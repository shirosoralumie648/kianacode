name: eq51-evidence-archive

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/quality_evidence_archive.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_evidence_archive.rs"
      - "kiana-core/src/quality_evidence_archive.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_evidence_archive_guard.rs"
      - "scripts/tests/eq51-evidence-archive-static.sh"
      - "docs/roadmap/evaluation-evidence-archive-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq51-evidence-archive.yml"
  pull_request:
    paths:
      - "kiana-domain/src/quality_evidence_archive.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_evidence_archive.rs"
      - "kiana-core/src/quality_evidence_archive.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_evidence_archive_guard.rs"
      - "scripts/tests/eq51-evidence-archive-static.sh"
      - "docs/roadmap/evaluation-evidence-archive-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq51-evidence-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run EQ-51 static archive guard
        run: bash scripts/tests/eq51-evidence-archive-static.sh
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-51 domain archive fixtures
        run: cargo test -p kiana-domain --test quality_evidence_archive --locked -- --test-threads=1
      - name: Run EQ-51 ControlPlane boundary guard
        run: cargo test -p kiana-core --test quality_evidence_archive_guard --locked -- --test-threads=1
      - name: Compile EQ-51 affected targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
      - name: Upload EQ-51 evidence archive slots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq51-evidence-archive
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/eq51/report.json
            artifacts/eq51/trace-diff.json
            artifacts/eq51/evidence-manifest.json
            artifacts/eq51/reproduction.txt
