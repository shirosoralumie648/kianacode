name: P1-H-01 single tool authority registry

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/tool_authority.rs"
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap01_registry.rs"
      - "kiana-core/tests/p1_h01_tool_authority_guard.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/tool-authority-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-h01-tool-authority.yml"
  pull_request:
    paths:
      - "kiana-domain/src/tool_authority.rs"
      - "kiana-domain/src/tool_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap01_registry.rs"
      - "kiana-core/tests/p1_h01_tool_authority_guard.rs"
      - "kiana-runner/src/tools.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/tool-authority-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-h01-tool-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-H-01 tool registry fixtures
        run: cargo test -p kiana-domain --test cap01_registry --locked -- --test-threads=1
      - name: Run P1-H-01 source guard
        run: cargo test -p kiana-core --test p1_h01_tool_authority_guard --locked -- --test-threads=1
      - name: Compile tool authority path
        run: cargo check -p kiana-domain -p kiana-runner -p kiana-core -p kiana-daemon --tests --locked
