name: SC-21 data boundary contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/authority.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/sc21_data_boundary_guard.rs"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc21-data-boundary.yml"
  pull_request:
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/authority.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/sc21_data_boundary_guard.rs"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc21-data-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-21 source guard
        run: cargo test -p kiana-domain --test sc21_data_boundary_guard --locked -- --test-threads=1
      - name: Compile SC-21 targets
        run: cargo check --workspace --tests --locked
