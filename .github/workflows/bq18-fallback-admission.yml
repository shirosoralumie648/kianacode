name: BQ-18 fallback admission

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/fallback_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/provider_capacity.rs"
      - "kiana-domain/tests/bq18_fallback_admission.rs"
      - "kiana-core/src/fallback_admission.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/bq18_fallback_admission_guard.rs"
      - "kiana-provider/src/fallback.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/bq18_fallback_admission.rs"
      - "docs/roadmap/bq18-fallback-admission-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq18-fallback-admission.yml"
  pull_request:
    paths:
      - "kiana-domain/src/fallback_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/provider_capacity.rs"
      - "kiana-domain/tests/bq18_fallback_admission.rs"
      - "kiana-core/src/fallback_admission.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/bq18_fallback_admission_guard.rs"
      - "kiana-provider/src/fallback.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/bq18_fallback_admission.rs"
      - "docs/roadmap/bq18-fallback-admission-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq18-fallback-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run BQ-18 domain fallback fixtures
        run: cargo test -p kiana-domain --test bq18_fallback_admission --locked -- --test-threads=1
      - name: Run BQ-18 provider source fixtures
        run: cargo test -p kiana-provider --test bq18_fallback_admission --locked -- --test-threads=1
      - name: Run BQ-18 core source guards
        run: cargo test -p kiana-core --test bq18_fallback_admission_guard --locked -- --test-threads=1
      - name: Compile BQ-18 test targets
        run: cargo check --workspace --tests --locked
