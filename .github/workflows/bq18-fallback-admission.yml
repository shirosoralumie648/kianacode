name: BQ-18 fallback admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-admission:
    name: BQ-18 allow-listed fallback admission fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-18 domain fixtures
        run: cargo test -p kiana-domain --test bq18_fallback_admission --locked -- --test-threads=1
      - name: Run BQ-18 provider boundary fixtures
        run: cargo test -p kiana-provider --test bq18_fallback_admission --locked -- --test-threads=1
      - name: Run BQ-18 provider fallback unit fixtures
        run: cargo test -p kiana-provider --lib --locked fallback -- --test-threads=1
      - name: Run BQ-18 core guard and facade fixtures
        run: cargo test -p kiana-core --test bq18_fallback_admission_guard --locked -- --test-threads=1
      - name: Run P4-J7-25 domain fallback regression
        run: cargo test -p kiana-domain --test p4_j7_25_capacity_fallback --locked -- --test-threads=1
      - name: Run P4-J7-25 provider fallback regression
        run: cargo test -p kiana-provider --test p4_j7_25_capacity_fallback --locked -- --test-threads=1
      - name: Compile BQ-18 domain target
        run: cargo test -p kiana-domain --test bq18_fallback_admission --no-run --locked
      - name: Compile BQ-18 provider boundary target
        run: cargo test -p kiana-provider --test bq18_fallback_admission --no-run --locked
      - name: Compile BQ-18 provider library targets
        run: cargo test -p kiana-provider --lib --no-run --locked
      - name: Compile BQ-18 core target
        run: cargo test -p kiana-core --test bq18_fallback_admission_guard --no-run --locked
      - name: Compile P4-J7-25 domain regression target
        run: cargo test -p kiana-domain --test p4_j7_25_capacity_fallback --no-run --locked
      - name: Compile P4-J7-25 provider regression target
        run: cargo test -p kiana-provider --test p4_j7_25_capacity_fallback --no-run --locked
