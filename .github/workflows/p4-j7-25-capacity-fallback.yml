name: P4-J7-25 provider capacity and fallback

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/provider_capacity.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_25_capacity_fallback.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-core/tests/p4_j7_25_capacity_fallback_guard.rs"
      - "docs/roadmap/p4-j7-25-capacity-fallback-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-25-capacity-fallback.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/provider_capacity.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_25_capacity_fallback.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-core/tests/p4_j7_25_capacity_fallback_guard.rs"
      - "docs/roadmap/p4-j7-25-capacity-fallback-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-25-capacity-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run capacity and fallback fixtures
        run: cargo test -p kiana-domain --test p4_j7_25_capacity_fallback --locked -- --test-threads=1
      - name: Run capacity source guard
        run: cargo test -p kiana-core --test p4_j7_25_capacity_fallback_guard --locked -- --test-threads=1
      - name: Run provider capacity transport fixtures
        run: cargo test -p kiana-provider --lib --locked transport::tests::dropping_half_open_probe_guard_reopens_breaker_and_clears_busy_fence -- --test-threads=1
      - name: Compile P4-J7-25 targets
        run: cargo check --workspace --tests --locked
