name: P4-J7-25 provider capacity and fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run provider capacity, circuit and fallback domain fixtures
        run: cargo test -p kiana-domain --test p4_j7_25_capacity_fallback --locked -- --test-threads=1
      - name: Run provider capacity and fallback boundary fixtures
        run: cargo test -p kiana-provider --test p4_j7_25_capacity_fallback --locked -- --test-threads=1
      - name: Run half-open probe guard regression
        run: cargo test -p kiana-provider --lib circuit_tests --locked -- --test-threads=1
      - name: Run provider capacity and fallback source guard
        run: cargo test -p kiana-core --test p4_j7_25_capacity_fallback_guard --locked -- --test-threads=1
