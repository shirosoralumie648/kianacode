name: P1-D-03 packet claim and lease recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p1_d03_lease.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p1_d03_lease_guard.rs"
      - "docs/roadmap/lease-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-d03-lease.yml"
  pull_request:
    paths:
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p1_d03_lease.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p1_d03_lease_guard.rs"
      - "docs/roadmap/lease-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-d03-lease.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lease-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-D-03 lease fixtures
        run: cargo test -p kiana-domain --test p1_d03_lease --locked -- --test-threads=1
      - name: Run P1-D-03 source guard
        run: cargo test -p kiana-core --test p1_d03_lease_guard --locked -- --test-threads=1
      - name: Compile lease path
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
