name: cm27-retrieval-receipt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/retrieval_receipt.rs"
      - "kiana-domain/src/retrieval_context.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm27_retrieval_receipt.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/cm27_retrieval_receipt_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm27-retrieval-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm27-retrieval-receipt.yml"
  pull_request:
    paths:
      - "kiana-domain/src/retrieval_receipt.rs"
      - "kiana-domain/src/retrieval_context.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm27_retrieval_receipt.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/cm27_retrieval_receipt_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm27-retrieval-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm27-retrieval-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-27 receipt fixtures
        run: cargo test -p kiana-domain --test cm27_retrieval_receipt --locked -- --test-threads=1
      - name: Run CM-27 source guard
        run: cargo test -p kiana-core --test cm27_retrieval_receipt_guard --locked -- --test-threads=1
