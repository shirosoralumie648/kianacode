name: "CO-16 Company proposal and Plan approval baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co16-company-proposals:
    name: "CO-16 Company proposal and Plan approval baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co16_company_proposals_guard
        run: cargo test -p kiana-core --test co16_company_proposals_guard --locked -- --test-threads=1
      - name: Run kiana-domain co16_company_proposals
        run: cargo test -p kiana-domain --test co16_company_proposals --locked -- --test-threads=1
