name: co16-company-proposals

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_proposals.rs"
      - "kiana-domain/src/plan.rs"
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co16_company_proposals.rs"
      - "kiana-core/tests/co16_company_proposals_guard.rs"
      - "docs/roadmap/co16-company-proposals-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co16-company-proposals.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_proposals.rs"
      - "kiana-domain/src/plan.rs"
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co16_company_proposals.rs"
      - "kiana-core/tests/co16_company_proposals_guard.rs"
      - "docs/roadmap/co16-company-proposals-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co16-company-proposals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-16 proposal fixtures
        run: cargo test -p kiana-domain --test co16_company_proposals --locked -- --test-threads=1
      - name: Run CO-16 proposal source guard
        run: cargo test -p kiana-core --test co16_company_proposals_guard --locked -- --test-threads=1
      - name: Compile CO-16 Company targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
