name: EQ-32 context memory evaluator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-context-memory-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq32-context-memory.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-context-memory-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq32-context-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-32 context memory fixtures
        run: cargo test -p kiana-quality --test eq32_context --locked -- --test-threads=1
      - name: Run EQ-32 source guard
        run: cargo test -p kiana-quality --test eq32_context_guard --locked -- --test-threads=1
      - name: Compile EQ-32 targets
        run: cargo check --workspace --tests --locked
