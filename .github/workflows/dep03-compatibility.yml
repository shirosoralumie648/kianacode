name: DEP-03 compatibility matrix

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep03_compatibility.rs"
      - "kiana-core/src/deployment_compatibility.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep03_compatibility_guard.rs"
      - "docs/roadmap/dep03-compatibility-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep03-compatibility.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_compatibility.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep03_compatibility.rs"
      - "kiana-core/src/deployment_compatibility.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep03_compatibility_guard.rs"
      - "docs/roadmap/dep03-compatibility-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep03-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-03 domain fixtures
        run: cargo test -p kiana-domain --test dep03_compatibility --locked -- --test-threads=1
      - name: Run DEP-03 source guard
        run: cargo test -p kiana-core --test dep03_compatibility_guard --locked -- --test-threads=1
      - name: Compile DEP-03 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
