name: SC-04 security context and entry boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/security_context.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-core/tests/sc04_security_context.rs"
      - "kiana-core/tests/sc04_security_context_guard.rs"
      - "docs/roadmap/security-context-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc04-security-context.yml"
  pull_request:
    paths:
      - "kiana-core/src/security_context.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-core/tests/sc04_security_context.rs"
      - "kiana-core/tests/sc04_security_context_guard.rs"
      - "docs/roadmap/security-context-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc04-security-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-04 context fixture
        run: cargo test -p kiana-core --test sc04_security_context --locked -- --test-threads=1
      - name: Run SC-04 source guard
        run: cargo test -p kiana-core --test sc04_security_context_guard --locked -- --test-threads=1
      - name: Compile SC-04 targets
        run: cargo check -p kiana-core --tests --locked
