name: EQ-11 evaluation deny broker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-broker:
    name: EQ-11 deny-by-default broker fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EQ-11 daemon deny fixtures
        run: cargo test -p kiana-daemon --test eq11_deny_broker --locked -- --test-threads=1
      - name: Run EQ-11 Core source guard
        run: cargo test -p kiana-core --test eq11_deny_broker_guard --locked -- --test-threads=1
      - name: Compile EQ-11 daemon target
        run: cargo test -p kiana-daemon --test eq11_deny_broker --no-run --locked
      - name: Compile EQ-11 Core guard target
        run: cargo test -p kiana-core --test eq11_deny_broker_guard --no-run --locked
