name: EXT-15 hook input reauthorization

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/hook_reauthorization.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ext15_hook_reauthorization_guard.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext15-hook-reauthorization-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext15-hook-reauthorization.yml"
  pull_request:
    paths:
      - "kiana-core/src/hook_reauthorization.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ext15_hook_reauthorization_guard.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext15-hook-reauthorization-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext15-hook-reauthorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-reauthorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-15 source guard
        run: cargo test -p kiana-core --test ext15_hook_reauthorization_guard --locked -- --test-threads=1
      - name: Compile EXT-15 target
        run: cargo check -p kiana-core --tests --locked
