name: "UI-21 Web Human Inbox and approval action cards"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui21-web-human-inbox:
    name: "UI-21 Web Human Inbox and approval action cards"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The runtime fixtures drive a real DaemonHost/Web router and stage a real approval that is
      # then denied; the project convention for daemon/entrypoint tests is a 32 MiB test-thread
      # stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the typed card/intent/deny-first client fixtures
        run: cargo test -p kiana-client --test ui21_human_inbox --locked -- --test-threads=1
      - name: Run the declarative inbox/audit fixture
        run: cargo test -p kiana-entrypoints --test ui21_web_human_inbox --locked -- --test-threads=1
      - name: Run the page/submission/deny-first guard
        run: cargo test -p kiana-entrypoints --test ui21_web_human_inbox_guard --locked -- --test-threads=1
      - name: Run the Core human.resolve recheck guard
        run: cargo test -p kiana-core --test ui21_human_inbox_guard --locked -- --test-threads=1
      # Completion slice: unsupported edit/restore/continue must be refused by name rather than
      # unmapped, required/illegal form values must never form an intent, and a duplicate click or
      # lost response must reuse one stable submission identity. These run before the live staging
      # filter so the card's deny-first matrix is gated even where the loopback fixture cannot run.
      - name: Run the unsupported-decision refusal fixtures
        run: >-
          cargo test -p kiana-client --test ui21_human_inbox --locked --
          --test-threads=1 unsupported
      - name: Run the required/illegal value refusal fixtures
        run: >-
          cargo test -p kiana-client --test ui21_human_inbox --locked --
          --test-threads=1 required_and_illegal
      - name: Run the duplicate-click and response-loss guards
        run: >-
          cargo test -p kiana-entrypoints --test ui21_web_human_inbox_guard --locked --
          --test-threads=1 duplicate_click
      - name: Run the server refusal-table fixture
        run: >-
          cargo test -p kiana-entrypoints --test ui21_web_human_inbox --locked --
          --test-threads=1 unsupported_actions
      # Known baseline blocker, not introduced by this slice: `kiana-core` writes `input_digest`
      # into `run.tool_call` while `RUN_TOOL_CALL_FIELDS` in `kiana-domain` was not extended, so
      # every live harness tool call is refused as `event_contract_event_payload_unknown_field`
      # before the approval stage. This step stays red until that base defect is fixed; the
      # focused refusal/duplicate-click fixtures above still gate the card's own behavior.
      - name: Run the live loopback inbox/deny/replay fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui21_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
