name: BQ-06 budget intersection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-intersection:
    name: BQ-06 budget intersection fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-06 domain budget fixtures
        run: cargo test -p kiana-domain --test bq06_budget_intersection --locked -- --test-threads=1
      - name: Run BQ-06 Core source guard
        run: cargo test -p kiana-core --test bq06_budget_intersection_guard --locked -- --test-threads=1
      - name: Compile BQ-06 domain target
        run: cargo test -p kiana-domain --test bq06_budget_intersection --no-run --locked
      - name: Compile BQ-06 Core guard target
        run: cargo test -p kiana-core --test bq06_budget_intersection_guard --no-run --locked
