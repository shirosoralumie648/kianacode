name: EQ-35 semantic judge contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "kiana-ports/src/lib.rs"
      - "docs/roadmap/evaluation-semantic-judge-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq35-semantic-judge.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "kiana-ports/src/lib.rs"
      - "docs/roadmap/evaluation-semantic-judge-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq35-semantic-judge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-35 semantic judge fixtures
        run: cargo test -p kiana-quality --test eq35_judge --locked -- --test-threads=1
      - name: Run EQ-35 source guard
        run: cargo test -p kiana-quality --test eq35_judge_guard --locked -- --test-threads=1
      - name: Compile EQ-35 targets
        run: cargo check --workspace --tests --locked
