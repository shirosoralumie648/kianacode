name: er32-adapter-conformance

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/er32_adapter_conformance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er32_adapter_conformance.rs"
      - "kiana-core/src/er32_adapter_conformance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er32_adapter_conformance_guard.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "docs/roadmap/er32-adapter-conformance-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er32-adapter-conformance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/er32_adapter_conformance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er32_adapter_conformance.rs"
      - "kiana-core/src/er32_adapter_conformance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er32_adapter_conformance_guard.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "docs/roadmap/er32-adapter-conformance-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er32-adapter-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  er32-adapter-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-32 conformance fixtures
        run: cargo test -p kiana-domain --test er32_adapter_conformance --locked -- --test-threads=1
      - name: Run ER-32 adapter boundary guard
        run: cargo test -p kiana-core --test er32_adapter_conformance_guard --locked -- --test-threads=1
      - name: Compile ER-32 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-eventlog --tests --locked
