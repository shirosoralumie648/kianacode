name: h20-context-plan

on:
  push:
    paths:
      - 'kiana-domain/src/context_plan.rs'
      - 'kiana-domain/src/prompts.rs'
      - 'kiana-domain/src/context_scope.rs'
      - 'kiana-domain/src/model.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/h20_context_plan.rs'
      - 'kiana-runner/src/harness.rs'
      - 'kiana-runner/src/model.rs'
      - 'kiana-runner/tests/h20_context_guard.rs'
      - '.github/workflows/h20-context-plan.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/context_plan.rs'
      - 'kiana-domain/src/prompts.rs'
      - 'kiana-domain/src/context_scope.rs'
      - 'kiana-domain/src/model.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/h20_context_plan.rs'
      - 'kiana-runner/src/harness.rs'
      - 'kiana-runner/src/model.rs'
      - 'kiana-runner/tests/h20_context_guard.rs'
      - '.github/workflows/h20-context-plan.yml'

jobs:
  context-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked --offline
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test h20_context_plan --locked -- --test-threads=1
      - run: cargo test -p kiana-runner --test h20_context_guard --locked -- --test-threads=1
