name: "CO-24 immutable Company EvidenceBundle baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co24-company-evidence:
    name: "CO-24 immutable Company EvidenceBundle baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co24_company_evidence_guard
        run: cargo test -p kiana-core --test co24_company_evidence_guard --locked -- --test-threads=1
      - name: Run kiana-domain co24_company_evidence
        run: cargo test -p kiana-domain --test co24_company_evidence --locked -- --test-threads=1
