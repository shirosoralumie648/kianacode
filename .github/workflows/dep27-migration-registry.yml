name: DEP-27 migration registry

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep27_migration_registry.rs"
      - "kiana-core/tests/dep27_migration_registry_guard.rs"
      - "docs/roadmap/dep27-migration-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep27-migration-registry.yml"
  pull_request:
    paths:
      - "kiana-domain/src/migration_registry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep27_migration_registry.rs"
      - "kiana-core/tests/dep27_migration_registry_guard.rs"
      - "docs/roadmap/dep27-migration-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep27-migration-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-27 domain fixtures
        run: cargo test -p kiana-domain --test dep27_migration_registry --locked -- --test-threads=1
      - name: Run DEP-27 source guard
        run: cargo test -p kiana-core --test dep27_migration_registry_guard --locked -- --test-threads=1
      - name: Compile DEP-27 targets
        run: cargo check --workspace --tests --locked
