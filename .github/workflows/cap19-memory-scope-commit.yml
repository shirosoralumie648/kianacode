name: CAP-19 memory scope and reliable commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-scope-commit:
    name: CAP-19 memory scope and commit fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run memory scope and mutation fixtures
        run: cargo test -p kiana-core --test cm03_scope_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cm05_memory_eventstore --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test p1_j3_02_memory --locked -- --test-threads=1
      - name: Run CAP-19 source guard
        run: cargo test -p kiana-core --test cap19_memory_scope_commit_guard --locked -- --test-threads=1
      - name: Compile selected Core targets
        run: cargo test -p kiana-core --test cm03_scope_guard --no-run --locked
      - run: cargo test -p kiana-core --test cm05_memory_eventstore --no-run --locked
      - run: cargo test -p kiana-core --test cap19_memory_scope_commit_guard --no-run --locked
      - name: Compile daemon memory target
        run: cargo test -p kiana-daemon --test p1_j3_02_memory --no-run --locked
