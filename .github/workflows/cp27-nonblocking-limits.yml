      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/model_budget.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/tests/aut02_clock_guard.rs"
      - "kiana-core/tests/bq00_cost_capacity_guard.rs"
      - "kiana-core/tests/p1_k5_01_cost_capacity_guard.rs"
      - "kiana-core/tests/cp12_resource_guard.rs"
      - "kiana-core/tests/pd01_storage_guard.rs"
      - "kiana-core/tests/pd03_health_guard.rs"
      - "kiana-core/tests/oa11_health_probes.rs"
      - "kiana-core/tests/cp27_nonblocking_limits_guard.rs"
