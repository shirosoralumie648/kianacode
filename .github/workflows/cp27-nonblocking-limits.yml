    paths:
      - "kiana-domain/src/clock.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/storage_health.rs"
      - "kiana-domain/tests/aut02_clock_observation.rs"
      - "kiana-domain/tests/pd01_storage.rs"
      - "kiana-domain/tests/pd03_health.rs"
