      - "docs/roadmap/cp27-nonblocking-limits-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp27-nonblocking-limits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonblocking-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run clock fixtures
        run: cargo test -p kiana-domain --test aut02_clock_observation --locked -- --test-threads=1
      - name: Run domain storage and health fixtures
        run: cargo test -p kiana-domain --test pd01_storage --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test pd03_health --locked -- --test-threads=1
      - name: Run core clock and capacity guards
        run: cargo test -p kiana-core --test aut02_clock_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test bq00_cost_capacity_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p1_k5_01_cost_capacity_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cp12_resource_guard --locked -- --test-threads=1
      - name: Run storage and health guards
        run: cargo test -p kiana-core --test pd01_storage_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd03_health_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test oa11_health_probes --locked -- --test-threads=1
      - name: Run EventLog package fixtures
        run: cargo test -p kiana-eventlog --locked -- --test-threads=1
      - name: Run daemon output/storage fixtures
        run: cargo test -p kiana-daemon --test h15_output_limits --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test pd01_storage --locked -- --test-threads=1
      - name: Run CP-27 source guard
        run: cargo test -p kiana-core --test cp27_nonblocking_limits_guard --locked -- --test-threads=1
      - name: Compile CP-27 targets
        run: cargo check --workspace --tests --locked
