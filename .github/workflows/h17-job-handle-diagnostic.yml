name: H17 job handle diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job-handle:
    name: H17 job handle fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt -p kiana-daemon -p kiana-domain --check
      - name: Run domain job handle fixtures
        run: cargo test -p kiana-domain --test h17_job_handle --locked -- --test-threads=1
      - name: Run daemon job handle guard
        run: cargo test -p kiana-daemon --test h17_job_handle --locked -- --test-threads=1
      - name: Run daemon job handle behavior fixtures
        run: cargo test -p kiana-daemon --lib --locked -- --test-threads=1 h17
      - name: Run named H17 behavior fixtures
        run: |
          for fixture in \
            execution_control::h17_job_handle::h17_behavior_foreign_job_handle_cannot_receive_stdin_or_cancel \
            execution_control::h17_job_handle::h17_behavior_pid_reuse_cannot_attach_to_other_process \
            execution_control::h17_job_handle::h17_behavior_poll_does_not_restart_job \
            execution_control::h17_job_handle::h17_behavior_long_command_has_one_job_and_distinct_operation_invocations; do
            cargo test -p kiana-daemon --lib "$fixture" --locked -- --exact --test-threads=1 || exit 1
          done
      - name: Compile domain job handle target
        run: cargo test -p kiana-domain --test h17_job_handle --no-run --locked
      - name: Compile daemon job handle guard target
        run: cargo test -p kiana-daemon --test h17_job_handle --no-run --locked
      - name: Compile daemon behavior fixtures
        run: cargo test -p kiana-daemon --lib --no-run --locked
