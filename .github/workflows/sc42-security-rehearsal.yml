name: SC-42 recovery and retention rehearsal

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/security_rehearsal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc42_security_rehearsal.rs"
      - "kiana-core/tests/sc42_security_rehearsal_guard.rs"
      - "scripts/package-lifecycle-smoke.sh"
      - "scripts/oa28-live-handoff-preflight.sh"
      - "scripts/oa26-durable-observability-gate.sh"
      - "scripts/validate-sc42-recovery-rehearsal.sh"
      - "docs/roadmap/sc42-security-rehearsal-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc42-security-rehearsal.yml"
  pull_request:
    paths:
      - "kiana-domain/src/security_rehearsal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc42_security_rehearsal.rs"
      - "kiana-core/tests/sc42_security_rehearsal_guard.rs"
      - "scripts/package-lifecycle-smoke.sh"
      - "scripts/oa28-live-handoff-preflight.sh"
      - "scripts/oa26-durable-observability-gate.sh"
      - "scripts/validate-sc42-recovery-rehearsal.sh"
      - "docs/roadmap/sc42-security-rehearsal-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc42-security-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Validate rehearsal script and source boundaries
        run: bash scripts/validate-sc42-recovery-rehearsal.sh
      - name: Run SC-42 rehearsal fixture
        run: cargo test -p kiana-domain --test sc42_security_rehearsal --locked -- --test-threads=1
      - name: Run SC-42 source guard
        run: cargo test -p kiana-core --test sc42_security_rehearsal_guard --locked -- --test-threads=1
      - run: git diff --check
      - run: cargo check --workspace --tests --locked
