name: SC-42 recovery and retention rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate rehearsal script and source boundaries
        run: bash scripts/validate-sc42-recovery-rehearsal.sh
      - name: Check recovery script and proof-level boundaries
        run: |
          bash -n scripts/package-lifecycle-smoke.sh
          bash -n scripts/oa28-live-handoff-preflight.sh
          bash -n scripts/oa26-durable-observability-gate.sh
          grep -Fq result_unknown docs/roadmap/sc42-security-rehearsal-baseline.md
          grep -Fq retention docs/roadmap/sc42-security-rehearsal-baseline.md
          grep -Fq partial docs/roadmap/sc42-security-rehearsal-baseline.md
          grep -Fq durable docs/roadmap/sc42-security-rehearsal-baseline.md
          grep -Fq live docs/roadmap/sc42-security-rehearsal-baseline.md
      - name: Run SC-42 rehearsal fixture
        run: cargo test -p kiana-domain --test sc42_security_rehearsal --locked -- --test-threads=1
      - name: Run SC-42 source guard
        run: cargo test -p kiana-core --test sc42_security_rehearsal_guard --locked -- --test-threads=1
      - run: git diff --check
      - run: cargo check --workspace --tests --locked
