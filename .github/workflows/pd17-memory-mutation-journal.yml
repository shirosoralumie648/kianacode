name: pd17-memory-mutation-journal

on:
  push:
    paths:
      - 'kiana-domain/src/memory_mutation.rs'
      - 'kiana-domain/src/memory_journal.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd17_memory_mutation_journal.rs'
      - 'kiana-daemon/src/harness_memory.rs'
      - 'kiana-daemon/tests/pd17_memory_mutation_journal_guard.rs'
      - '.github/workflows/pd17-memory-mutation-journal.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/memory_mutation.rs'
      - 'kiana-domain/src/memory_journal.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd17_memory_mutation_journal.rs'
      - 'kiana-daemon/src/harness_memory.rs'
      - 'kiana-daemon/tests/pd17_memory_mutation_journal_guard.rs'
      - '.github/workflows/pd17-memory-mutation-journal.yml'

permissions:
  contents: read

jobs:
  memory-mutation-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test pd17_memory_mutation_journal --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test pd17_memory_mutation_journal_guard --locked -- --test-threads=1
