name: AUT-04 trigger definition/source admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: AUT-04 trigger admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run AUT-04 trigger definition fixtures
        run: cargo test -p kiana-workflow --test aut04_trigger_definition --locked -- --test-threads=1
      - name: Run AUT-04 trigger source guard
        run: cargo test -p kiana-core --test aut04_trigger_guard --locked -- --test-threads=1
      - name: Compile AUT-04 workflow target
        run: cargo test -p kiana-workflow --test aut04_trigger_definition --no-run --locked
      - name: Compile AUT-04 core target
        run: cargo test -p kiana-core --test aut04_trigger_guard --no-run --locked
