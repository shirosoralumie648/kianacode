name: SW-08 single-spine child routing

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_routing.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_routing.rs"
      - "kiana-core/src/swarm_routing.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_routing_guard.rs"
      - "docs/roadmap/sw08-routing-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw08-routing.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_routing.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_routing.rs"
      - "kiana-core/src/swarm_routing.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_routing_guard.rs"
      - "docs/roadmap/sw08-routing-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw08-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-08 domain fixtures
        run: cargo test -p kiana-domain --test swarm_routing --locked -- --test-threads=1
      - name: Run SW-08 Core source guard
        run: cargo test -p kiana-core --test swarm_routing_guard --locked -- --test-threads=1
      - name: Compile SW-08 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
