name: ER-17 serializable RunSnapshot and pending writes

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/invocation_resume.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-core/src/projection.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-domain/tests/h14_invocation_resume.rs"
      - "kiana-core/tests/h13_invocation_ledger.rs"
      - "kiana-core/tests/h13_invocation_ledger_guard.rs"
      - "kiana-core/tests/h14_approval_resume.rs"
      - "kiana-core/tests/p0_f03_resume_guard.rs"
      - "kiana-core/tests/p0_g03_resume_guard.rs"
      - "kiana-core/tests/p2_k4_01_checkpoint.rs"
      - "kiana-core/tests/cp18_run_snapshot_guard.rs"
      - "kiana-core/tests/er17_run_snapshot_guard.rs"
      - "docs/roadmap/er17-run-snapshot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er17-run-snapshot.yml"
  pull_request:
    paths:
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/invocation_resume.rs"
      - "kiana-domain/src/states.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/redaction.rs"
      - "kiana-core/src/projection.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-domain/tests/h14_invocation_resume.rs"
      - "kiana-core/tests/h13_invocation_ledger.rs"
      - "kiana-core/tests/h13_invocation_ledger_guard.rs"
      - "kiana-core/tests/h14_approval_resume.rs"
      - "kiana-core/tests/p0_f03_resume_guard.rs"
      - "kiana-core/tests/p0_g03_resume_guard.rs"
      - "kiana-core/tests/p2_k4_01_checkpoint.rs"
      - "kiana-core/tests/cp18_run_snapshot_guard.rs"
      - "kiana-core/tests/er17_run_snapshot_guard.rs"
      - "docs/roadmap/er17-run-snapshot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er17-run-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run invocation ledger fixtures
        run: cargo test -p kiana-core --test h13_invocation_ledger --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test h13_invocation_ledger_guard --locked -- --test-threads=1
      - name: Run approval resume fixtures
        run: cargo test -p kiana-core --test h14_approval_resume --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test h14_invocation_resume --locked -- --test-threads=1
      - name: Run resume/checkpoint fixtures
        run: cargo test -p kiana-core --test p0_f03_resume_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p0_g03_resume_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p2_k4_01_checkpoint --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cp18_run_snapshot_guard --locked -- --test-threads=1
      - name: Run ER-17 source guard
        run: cargo test -p kiana-core --test er17_run_snapshot_guard --locked -- --test-threads=1
      - name: Compile ER-17 targets
        run: cargo check --workspace --tests --locked
