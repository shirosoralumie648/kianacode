name: DEP-02 release bundle

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_release.rs"
      - "kiana-domain/src/release_attestation.rs"
      - "kiana-domain/src/deployment.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep02_release_bundle.rs"
      - "kiana-core/src/deployment_release.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep02_release_bundle_guard.rs"
      - "docs/roadmap/dep02-release-bundle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep02-release-bundle.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_release.rs"
      - "kiana-domain/src/release_attestation.rs"
      - "kiana-domain/src/deployment.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep02_release_bundle.rs"
      - "kiana-core/src/deployment_release.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep02_release_bundle_guard.rs"
      - "docs/roadmap/dep02-release-bundle-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep02-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-02 domain fixtures
        run: cargo test -p kiana-domain --test dep02_release_bundle --locked -- --test-threads=1
      - name: Run DEP-02 source guard
        run: cargo test -p kiana-core --test dep02_release_bundle_guard --locked -- --test-threads=1
      - name: Compile DEP-02 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
