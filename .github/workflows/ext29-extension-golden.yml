name: "EXT-29 · Extension fake golden baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext29-extension-golden:
    name: "EXT-29 · Extension fake golden baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core ext29_extension_golden_guard
        run: cargo test -p kiana-core --test ext29_extension_golden_guard --locked -- --test-threads=1
      - name: Run kiana-domain ext29_extension_golden
        run: cargo test -p kiana-domain --test ext29_extension_golden --locked -- --test-threads=1
