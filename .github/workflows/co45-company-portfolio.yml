name: co45-company-portfolio

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_portfolio.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/billing_contracts.rs"
      - "kiana-domain/tests/co45_company_portfolio.rs"
      - "kiana-core/src/company_portfolio.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co45_company_portfolio_guard.rs"
      - "docs/roadmap/co45-company-portfolio-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co45-company-portfolio.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_portfolio.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/billing_contracts.rs"
      - "kiana-domain/tests/co45_company_portfolio.rs"
      - "kiana-core/src/company_portfolio.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co45_company_portfolio_guard.rs"
      - "docs/roadmap/co45-company-portfolio-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co45-company-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-45 portfolio fixtures
        run: cargo test -p kiana-domain --test co45_company_portfolio --locked -- --test-threads=1
      - name: Run CO-45 billing boundary guard
        run: cargo test -p kiana-core --test co45_company_portfolio_guard --locked -- --test-threads=1
      - name: Compile CO-45 portfolio targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
