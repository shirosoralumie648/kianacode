name: ER-13 result commit and delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ER-13 committed result delivery behaviors
        run: cargo test -p kiana-core --lib dispatch::delivery_tests --locked -- --test-threads=1
      - name: Run ER-13 result delivery source guard
        run: cargo test -p kiana-core --test er13_result_delivery --locked -- --test-threads=1
      - name: Compile ER-13 targets
        run: cargo check --workspace --tests --locked
