name: p4-j7-19-gemini-interactions

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_19_gemini_interactions_guard.rs"
      - "docs/roadmap/p4-j7-19-gemini-interactions-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-19-gemini-interactions.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-core/tests/p4_j7_19_gemini_interactions_guard.rs"
      - "docs/roadmap/p4-j7-19-gemini-interactions-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-19-gemini-interactions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-19 Gemini Interactions fixtures
        run: cargo test -p kiana-provider --lib --locked gemini_ -- --test-threads=1
      - name: Run P4-J7-19 source guard
        run: cargo test -p kiana-core --test p4_j7_19_gemini_interactions_guard --locked -- --test-threads=1
