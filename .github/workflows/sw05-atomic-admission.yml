name: SW-05 atomic swarm admission

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_admission.rs"
      - "kiana-core/src/swarm_admission.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_admission_guard.rs"
      - "docs/roadmap/sw05-atomic-admission-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw05-atomic-admission.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_admission.rs"
      - "kiana-core/src/swarm_admission.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_admission_guard.rs"
      - "docs/roadmap/sw05-atomic-admission-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw05-atomic-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-05 domain fixtures
        run: cargo test -p kiana-domain --test swarm_admission --locked -- --test-threads=1
      - name: Run SW-05 Core source guard
        run: cargo test -p kiana-core --test swarm_admission_guard --locked -- --test-threads=1
      - name: Compile SW-05 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
