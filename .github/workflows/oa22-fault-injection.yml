name: oa22-fault-injection

on:
  push:
    paths:
      - "kiana-domain/src/fault.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/fault_injection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa22_fault_injection.rs"
      - ".github/workflows/oa22-fault-injection.yml"
  pull_request:
    paths:
      - "kiana-domain/src/fault.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/fault_injection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa22_fault_injection.rs"
      - ".github/workflows/oa22-fault-injection.yml"

permissions:
  contents: read

jobs:
  oa22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa22-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-22 remote-only fixtures
        run: cargo test -p kiana-core --test oa22_fault_injection --locked -- --test-threads=1
