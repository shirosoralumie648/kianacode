name: H07 harness budget diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: H07 ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - h07_budget
          - h07_budget_guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run focused H07 target
        run: cargo test -p kiana-runner --test "${{ matrix.target }}" --locked -- --test-threads=1
