name: AUT-17 cancellation generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation-generation:
    name: AUT-17 cancel generation/stop report/late fence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check

      # Domain contract: full cancel-state matrix (queued not_executed, confirmed stop, unknown
      # preserved), generation/epoch fences, stop report evidence and the late-result fence.
      - name: Run domain cancellation fixtures
        run: cargo test -p kiana-domain --test automation_cancellation --locked -- --test-threads=1
      # Core coordinator: not_executed without a stop call, exactly one stop per claimed attempt,
      # unconfirmed/drifted/unavailable stops are recovery-only and late results can only be fenced.
      - name: Run core cancellation coordinator fixtures
        run: cargo test -p kiana-core --test automation_cancellation_worker --locked -- --test-threads=1
      - name: Run core cancellation source guard
        run: cargo test -p kiana-core --test automation_cancellation_guard --locked -- --test-threads=1
      # Cancel-fact store: content CAS, generation monotonicity, same-generation transition
      # whitelist and safe replay of identical facts.
      - name: Run eventlog cancellation store fixtures
        run: cargo test -p kiana-eventlog --test aut17_cancellation_store --locked -- --test-threads=1
      # Daemon service: bounded single worker, host-owned lifecycle, recovery-only counting and the
      # late-result fence that is never reported as stopped.
      - name: Run daemon cancellation service fixtures
        run: cargo test -p kiana-daemon --test aut17_cancellation --locked -- --test-threads=1
      - name: Run daemon cancellation service source guard
        run: cargo test -p kiana-daemon --test aut17_cancellation_guard --locked -- --test-threads=1

      - name: Compile domain cancellation target
        run: cargo test -p kiana-domain --test automation_cancellation --no-run --locked
      - name: Compile core cancellation coordinator target
        run: cargo test -p kiana-core --test automation_cancellation_worker --no-run --locked
      - name: Compile core cancellation guard
        run: cargo test -p kiana-core --test automation_cancellation_guard --no-run --locked
      - name: Compile eventlog cancellation store target
        run: cargo test -p kiana-eventlog --test aut17_cancellation_store --no-run --locked
      - name: Compile daemon cancellation service target
        run: cargo test -p kiana-daemon --test aut17_cancellation --no-run --locked
      - name: Compile daemon cancellation service guard
        run: cargo test -p kiana-daemon --test aut17_cancellation_guard --no-run --locked
