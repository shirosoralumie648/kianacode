name: AUT-17 cancellation generation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_cancellation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_cancellation.rs"
      - "kiana-core/src/automation_cancellation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_cancellation_guard.rs"
      - "docs/roadmap/aut17-cancellation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut17-cancellation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_cancellation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_cancellation.rs"
      - "kiana-core/src/automation_cancellation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_cancellation_guard.rs"
      - "docs/roadmap/aut17-cancellation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut17-cancellation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_cancellation --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_cancellation_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
