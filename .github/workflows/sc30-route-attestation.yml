name: SC-30 provider and route attestation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run deterministic route attestation verifier fixture
        run: python3 scripts/verify-route-attestation.py --self-test
      - name: Run SC-30 domain fixture
        run: cargo test -p kiana-domain --test sc30_route_attestation --locked -- --test-threads=1
      - name: Run SC-30 source guard
        run: cargo test -p kiana-core --test sc30_route_attestation_guard --locked -- --test-threads=1
