name: SC-30 provider and route attestation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-30 offline deny-first fixtures
        run: python3 -B scripts/tests/test_sc30_route_attestation.py
      - name: Run SC-30 route attestation verifier self-test
        run: python3 scripts/verify-route-attestation.py --self-test
      - name: Run SC-30 structural validator and fixtures
        run: bash scripts/validate-sc30-route-attestation.sh
      - name: Compile SC-30 test targets without running them
        run: |
          cargo test -p kiana-domain --test sc30_route_attestation --no-run --locked
          cargo test -p kiana-core --test sc30_route_attestation_guard --no-run --locked
      - name: Run SC-30 domain fixture
        run: cargo test -p kiana-domain --test sc30_route_attestation --locked -- --test-threads=1
      - name: Run SC-30 source guard
        run: cargo test -p kiana-core --test sc30_route_attestation_guard --locked -- --test-threads=1
