name: "INT-17 connector quota baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int17-connector-quota:
    name: "INT-17 connector quota baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain ledger: restart fail-closed, per-scope rate/concurrency/budget ceilings, single
      # winner claim CAS, owner-bound release and replayable settlement.
      - name: Run domain connector quota fixtures
        run: cargo test -p kiana-domain --test int17_connector_quota --locked -- --test-threads=1
      # Broker effect boundary: a missing, orphaned, tampered, stale, expired or over-limit quota
      # envelope leaves the recording connector handler at zero calls; the admitted envelope
      # reaches it exactly once.
      - name: Run Broker connector quota fixtures
        run: cargo test -p kiana-capability-broker --test int17_connector_quota --locked -- --test-threads=1
      # Provider transport checkpoint: capacity lease and credential generation must match the
      # server-owned policy before any request is sent.
      - name: Run provider connector quota fixtures
        run: cargo test -p kiana-provider --test int17_connector_quota --locked -- --test-threads=1
      # Query projector: settled-then-released streams rebuild the same states and settlement.
      - name: Run query connector quota fixtures
        run: cargo test -p kiana-query --test int17_connector_quota --locked -- --test-threads=1
      # Daemon spine: DaemonHost → ControlPlane → Broker → EventStore, wire smuggling and durable
      # restart accounting over a real on-disk EventLog.
      - name: Run daemon connector quota fixtures
        run: cargo test -p kiana-daemon --test int17_connector_quota --locked -- --test-threads=1
      - name: Run core connector quota source guard
        run: cargo test -p kiana-core --test int17_connector_quota_guard --locked -- --test-threads=1

      - name: Compile domain connector quota target
        run: cargo test -p kiana-domain --test int17_connector_quota --no-run --locked
      - name: Compile Broker connector quota target
        run: cargo test -p kiana-capability-broker --test int17_connector_quota --no-run --locked
      - name: Compile provider connector quota target
        run: cargo test -p kiana-provider --test int17_connector_quota --no-run --locked
      - name: Compile query connector quota target
        run: cargo test -p kiana-query --test int17_connector_quota --no-run --locked
      - name: Compile daemon connector quota target
        run: cargo test -p kiana-daemon --test int17_connector_quota --no-run --locked
      - name: Compile core connector quota guard target
        run: cargo test -p kiana-core --test int17_connector_quota_guard --no-run --locked
