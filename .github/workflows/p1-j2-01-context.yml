name: P1-J2-01 context sections

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/tests/p1_j2_01_context.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/p1_j2_01_context_guard.rs"
      - "kiana-daemon/src/harness_skills.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-01-context-sections-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-01-context.yml"
  pull_request:
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/tests/p1_j2_01_context.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/p1_j2_01_context_guard.rs"
      - "kiana-daemon/src/harness_skills.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-01-context-sections-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-01-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-J2-01 domain fixtures
        run: cargo test -p kiana-domain --test p1_j2_01_context --locked -- --test-threads=1
      - name: Run P1-J2-01 core guard
        run: cargo test -p kiana-core --test p1_j2_01_context_guard --locked -- --test-threads=1
      - name: Compile P1-J2-01 targets
        run: cargo check --workspace --tests --locked
