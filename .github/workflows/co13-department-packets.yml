name: co13-department-packets

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co13_department_packets.rs"
      - "kiana-core/tests/co13_department_packets_guard.rs"
      - "docs/roadmap/co13-department-packets-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co13-department-packets.yml"
  pull_request:
    paths:
      - "kiana-domain/src/department_packets.rs"
      - "kiana-domain/src/work_packets.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co13_department_packets.rs"
      - "kiana-core/tests/co13_department_packets_guard.rs"
      - "docs/roadmap/co13-department-packets-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co13-department-packets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  department-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-13 department packet fixtures
        run: cargo test -p kiana-domain --test co13_department_packets --locked -- --test-threads=1
      - name: Run CO-13 packet source guard
        run: cargo test -p kiana-core --test co13_department_packets_guard --locked -- --test-threads=1
      - name: Compile CO-13 packet targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
