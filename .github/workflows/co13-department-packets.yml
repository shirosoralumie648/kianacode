name: "CO-13 versioned department packets"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co13-department-packets:
    name: "CO-13 versioned department packets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co13_department_packets_guard
        run: cargo test -p kiana-core --test co13_department_packets_guard --locked -- --test-threads=1
      - name: Run kiana-domain co13_department_packets
        run: cargo test -p kiana-domain --test co13_department_packets --locked -- --test-threads=1
      - name: Run kiana-daemon co13_department_packet_transactions
        run: cargo test -p kiana-daemon --test co13_department_packet_transactions --locked -- --test-threads=1
      - name: Compile kiana-core co13_department_packets_guard target
        run: cargo test -p kiana-core --test co13_department_packets_guard --no-run --locked
      - name: Compile kiana-domain co13_department_packets target
        run: cargo test -p kiana-domain --test co13_department_packets --no-run --locked
      - name: Compile kiana-daemon co13_department_packet_transactions target
        run: cargo test -p kiana-daemon --test co13_department_packet_transactions --no-run --locked
