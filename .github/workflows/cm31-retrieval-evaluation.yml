name: cm31-retrieval-evaluation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/retrieval_evaluation.rs"
      - "kiana-domain/src/golden_context.rs"
      - "kiana-domain/src/unified_retrieval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm31_retrieval_evaluation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm31_retrieval_evaluation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm31-retrieval-evaluation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm31-retrieval-evaluation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/retrieval_evaluation.rs"
      - "kiana-domain/src/golden_context.rs"
      - "kiana-domain/src/unified_retrieval.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm31_retrieval_evaluation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm31_retrieval_evaluation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm31-retrieval-evaluation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm31-retrieval-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-31 evaluation fixtures
        run: cargo test -p kiana-domain --test cm31_retrieval_evaluation --locked -- --test-threads=1
      - name: Run CM-31 source guard
        run: cargo test -p kiana-core --test cm31_retrieval_evaluation_guard --locked -- --test-threads=1
