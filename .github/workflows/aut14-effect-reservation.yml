name: AUT-14 effect reservation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_effect_reservation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_effect_reservation.rs"
      - "kiana-core/src/automation_effect_reservation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_effect_reservation_guard.rs"
      - "docs/roadmap/aut14-effect-reservation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut14-effect-reservation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_effect_reservation.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_effect_reservation.rs"
      - "kiana-core/src/automation_effect_reservation.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_effect_reservation_guard.rs"
      - "docs/roadmap/aut14-effect-reservation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut14-effect-reservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_effect_reservation --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_effect_reservation_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
