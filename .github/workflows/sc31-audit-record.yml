name: SC-31 audit record append-only contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/audit.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/tests/sc31_audit_record.rs"
      - "kiana-eventlog/src/audit_contract.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/tests/sc31_audit_event.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/sc31_audit_record_guard.rs"
      - "docs/roadmap/sc31-audit-record-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc31-audit-record.yml"
  pull_request:
    paths:
      - "kiana-domain/src/audit.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-domain/tests/sc31_audit_record.rs"
      - "kiana-eventlog/src/audit_contract.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/tests/sc31_audit_event.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/sc31_audit_record_guard.rs"
      - "docs/roadmap/sc31-audit-record-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc31-audit-record.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-31 domain fixture
        run: cargo test -p kiana-domain --test sc31_audit_record --locked -- --test-threads=1
      - name: Run SC-31 EventLog fixture
        run: cargo test -p kiana-eventlog --test sc31_audit_event --locked -- --test-threads=1
      - name: Run SC-31 source guard
        run: cargo test -p kiana-core --test sc31_audit_record_guard --locked -- --test-threads=1
      - name: Compile SC-31 targets
        run: cargo check --workspace --tests --locked

