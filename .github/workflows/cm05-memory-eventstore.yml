name: CM-05 memory EventStore projection

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory_journal.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-eventlog/src/**"
      - "kiana-ports/src/lib.rs"
      - "kiana-domain/tests/cm05_memory_eventstore.rs"
      - "kiana-daemon/tests/cm05_memory_eventstore.rs"
      - "kiana-core/tests/cm05_memory_eventstore.rs"
      - "docs/roadmap/cm05-memory-eventstore-baseline.md"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm05-memory-eventstore.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory_journal.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-eventlog/src/**"
      - "kiana-ports/src/lib.rs"
      - "kiana-domain/tests/cm05_memory_eventstore.rs"
      - "kiana-daemon/tests/cm05_memory_eventstore.rs"
      - "kiana-core/tests/cm05_memory_eventstore.rs"
      - "docs/roadmap/cm05-memory-eventstore-baseline.md"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm05-memory-eventstore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-eventstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run memory journal and replay fixture
        run: cargo test -p kiana-domain --test cm05_memory_eventstore --locked -- --test-threads=1
      - name: Run daemon commit-order guard
        run: cargo test -p kiana-daemon --test cm05_memory_eventstore --locked -- --test-threads=1
      - name: Run ControlPlane/EventStore guard
        run: cargo test -p kiana-core --test cm05_memory_eventstore --locked -- --test-threads=1
      - name: Compile CM-05 targets
        run: cargo check --workspace --tests --locked
