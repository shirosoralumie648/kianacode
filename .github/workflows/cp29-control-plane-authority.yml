name: cp29-control-plane-authority

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/control_plane_authority.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp29_control_plane_authority.rs"
      - "kiana-core/src/control_plane_authority.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/cp29_control_plane_authority_guard.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "docs/roadmap/cp29-control-plane-authority-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp29-control-plane-authority.yml"
  pull_request:
    paths:
      - "kiana-domain/src/control_plane_authority.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cp29_control_plane_authority.rs"
      - "kiana-core/src/control_plane_authority.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/cp29_control_plane_authority_guard.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "docs/roadmap/cp29-control-plane-authority-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp29-control-plane-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-29 authority scenario fixtures
        run: cargo test -p kiana-domain --test cp29_control_plane_authority --locked -- --test-threads=1
      - name: Run CP-29 source boundary guard
        run: cargo test -p kiana-core --test cp29_control_plane_authority_guard --locked -- --test-threads=1
      - name: Compile CP-29 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-eventlog --tests --locked
