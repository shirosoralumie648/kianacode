name: BQ-19 cost allocation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-allocation:
    name: BQ-19 allocation leaf, grant admission, rollup and portfolio fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-19 domain fixtures
        run: cargo test -p kiana-domain --test bq19_cost_allocation --locked -- --test-threads=1
      - name: Run BQ-19 core admission fixtures
        run: cargo test -p kiana-core --test bq19_cost_allocation --locked -- --test-threads=1
      - name: Run BQ-19 core source guard
        run: cargo test -p kiana-core --test bq19_cost_allocation_guard --locked -- --test-threads=1
      - name: Run BQ-19 query projection fixtures
        run: cargo test -p kiana-query --test bq19_allocation_projector --locked -- --test-threads=1
      - name: Run BQ-19 query source guard
        run: cargo test -p kiana-query --test bq19_allocation_projector_guard --locked -- --test-threads=1
      - name: Compile BQ-19 domain target
        run: cargo test -p kiana-domain --test bq19_cost_allocation --no-run --locked
      - name: Compile BQ-19 core admission target
        run: cargo test -p kiana-core --test bq19_cost_allocation --no-run --locked
      - name: Compile BQ-19 core guard target
        run: cargo test -p kiana-core --test bq19_cost_allocation_guard --no-run --locked
      - name: Compile BQ-19 query projection target
        run: cargo test -p kiana-query --test bq19_allocation_projector --no-run --locked
      - name: Compile BQ-19 query guard target
        run: cargo test -p kiana-query --test bq19_allocation_projector_guard --no-run --locked
