name: OA-14 trace exporter and W3C context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oa14:
    name: OA-14 trace export fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run OA-14 trace export fixtures
        run: cargo test -p kiana-core --test oa14_trace_export --locked -- --test-threads=1
      - name: Compile OA-14 trace export target
        run: cargo test -p kiana-core --test oa14_trace_export --no-run --locked
