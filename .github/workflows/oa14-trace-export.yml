name: oa14-trace-export

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/trace_export.rs"
      - "kiana-core/tests/oa14_trace_export.rs"
      - ".github/workflows/oa14-trace-export.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/trace_export.rs"
      - "kiana-core/tests/oa14_trace_export.rs"
      - ".github/workflows/oa14-trace-export.yml"

permissions:
  contents: read

jobs:
  oa14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa14-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-14 remote-only fixtures
        run: cargo test -p kiana-core --test oa14_trace_export --locked -- --test-threads=1
