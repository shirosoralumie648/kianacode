name: "CO-34 delivery authorization, effect and recipient confirmation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co34-delivery-authorization:
    name: "CO-34 delivery authorization, effect and recipient confirmation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co34_delivery_authorization_guard
        run: cargo test -p kiana-core --test co34_delivery_authorization_guard --locked -- --test-threads=1
      - name: Run kiana-domain co34_delivery_authorization
        run: cargo test -p kiana-domain --test co34_delivery_authorization --locked -- --test-threads=1
