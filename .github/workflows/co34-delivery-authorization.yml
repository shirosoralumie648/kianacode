name: co34-delivery-authorization

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/delivery_authorization.rs"
      - "kiana-domain/src/delivery_manifest.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co34_delivery_authorization.rs"
      - "kiana-core/src/delivery_authorization.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co34_delivery_authorization_guard.rs"
      - "docs/roadmap/co34-delivery-authorization-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co34-delivery-authorization.yml"
  pull_request:
    paths:
      - "kiana-domain/src/delivery_authorization.rs"
      - "kiana-domain/src/delivery_manifest.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co34_delivery_authorization.rs"
      - "kiana-core/src/delivery_authorization.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co34_delivery_authorization_guard.rs"
      - "docs/roadmap/co34-delivery-authorization-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co34-delivery-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-34 authorization fixtures
        run: cargo test -p kiana-domain --test co34_delivery_authorization --locked -- --test-threads=1
      - name: Run CO-34 Broker and recipient guard
        run: cargo test -p kiana-core --test co34_delivery_authorization_guard --locked -- --test-threads=1
      - name: Compile CO-34 delivery targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
