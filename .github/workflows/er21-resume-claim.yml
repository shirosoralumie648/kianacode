name: ER-21 explicit resume preflight and claim

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-claim:
    name: ER-21 resume preflight and claim fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run recovery and protocol fixtures
        run: cargo test -p kiana-core --test p0_g03_resume_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cp19_explicit_resume_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test h14_approval_resume --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test h14_invocation_resume --locked -- --test-threads=1
      - name: Run shared entrypoint fixtures
        run: cargo test -p kiana-entrypoints --test cp22_protocol_surfaces --locked -- --test-threads=1
      - run: cargo test -p kiana-entrypoints --test cli_resume --locked -- --test-threads=1
      - name: Run ER-21 source guard
        run: cargo test -p kiana-core --test er21_resume_claim_guard --locked -- --test-threads=1
      - name: Compile selected Core targets
        run: cargo test -p kiana-core --test p0_g03_resume_guard --no-run --locked
      - run: cargo test -p kiana-core --test cp19_explicit_resume_guard --no-run --locked
      - run: cargo test -p kiana-core --test h14_approval_resume --no-run --locked
      - run: cargo test -p kiana-domain --test h14_invocation_resume --no-run --locked
      - name: Compile selected entrypoint targets
        run: cargo test -p kiana-entrypoints --test cp22_protocol_surfaces --no-run --locked
      - run: cargo test -p kiana-entrypoints --test cli_resume --no-run --locked
      - name: Compile ER-21 source guard target
        run: cargo test -p kiana-core --test er21_resume_claim_guard --no-run --locked
