name: ER-06 async eventlog lifecycle

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/stream.rs"
      - "kiana-eventlog/tests/er06_async_lifecycle.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/run_stream.rs"
      - "kiana-core/src/receipts.rs"
      - "docs/roadmap/event-receipt-async-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er06-async-lifecycle.yml"
  pull_request:
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/stream.rs"
      - "kiana-eventlog/tests/er06_async_lifecycle.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/run_stream.rs"
      - "kiana-core/src/receipts.rs"
      - "docs/roadmap/event-receipt-async-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er06-async-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  async-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-06 async lifecycle fixtures
        run: cargo test -p kiana-eventlog --test er06_async_lifecycle --locked -- --test-threads=1
      - name: Compile ER-06 targets
        run: cargo check --workspace --tests --locked
