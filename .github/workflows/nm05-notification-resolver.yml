name: NM-05 notification resolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-resolver:
    name: NM-05 resolver fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-05 resolver fixtures
        run: cargo test -p kiana-core --test nm05_notification_resolver --locked -- --test-threads=1
      - name: Run NM-05 resolver source guard
        run: cargo test -p kiana-core --test nm05_notification_resolver_guard --locked -- --test-threads=1
      - name: Compile NM-05 resolver target
        run: cargo test -p kiana-core --test nm05_notification_resolver --no-run --locked
      - name: Compile NM-05 source guard target
        run: cargo test -p kiana-core --test nm05_notification_resolver_guard --no-run --locked
