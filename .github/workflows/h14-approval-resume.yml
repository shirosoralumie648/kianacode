name: H14 approval resume

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/invocation_resume.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h14_invocation_resume.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/h14_approval_resume.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-approval-resume-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h14-approval-resume.yml"
  pull_request:
    paths:
      - "kiana-domain/src/invocation_resume.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h14_invocation_resume.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/h14_approval_resume.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-approval-resume-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h14-approval-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H14 domain fixtures
        run: cargo test -p kiana-domain --test h14_invocation_resume --locked -- --test-threads=1
      - name: Run H14 core source guard
        run: cargo test -p kiana-core --test h14_approval_resume --locked -- --test-threads=1
      - name: Compile H14 targets
        run: cargo check --workspace --tests --locked
