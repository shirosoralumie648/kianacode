name: INT-31 connector pilot gate

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_pilot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_pilot.rs"
      - "kiana-core/src/connector_pilot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int31_connector_pilot_guard.rs"
      - "docs/roadmap/int31-pilot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int31-pilot.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_pilot.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_pilot.rs"
      - "kiana-core/src/connector_pilot.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int31_connector_pilot_guard.rs"
      - "docs/roadmap/int31-pilot-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int31-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-31 domain fixtures
        run: cargo test -p kiana-domain --test connector_pilot --locked -- --test-threads=1
      - name: Run INT-31 Core source guard
        run: cargo test -p kiana-core --test int31_connector_pilot_guard --locked -- --test-threads=1
      - name: Compile INT-31 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
