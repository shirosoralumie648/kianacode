name: CO-03 server-owned assignments

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/assignment.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co03_assignment.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co03_assignment_guard.rs"
      - "kiana-core/tests/co03_assignment.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/assignment-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co03-assignments.yml"
  pull_request:
    paths:
      - "kiana-domain/src/assignment.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co03_assignment.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co03_assignment_guard.rs"
      - "kiana-core/tests/co03_assignment.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/assignment-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co03-assignments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assignments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-03 assignment fixtures
        run: cargo test -p kiana-domain --test co03_assignment --locked -- --test-threads=1
      - name: Run CO-03 source guard
        run: cargo test -p kiana-core --test co03_assignment_guard --locked -- --test-threads=1
      - name: Run CO-03 core assignment guard fixtures
        run: cargo test -p kiana-core --test co03_assignment --locked -- --test-threads=1
      - name: Compile CO-03 server identity path
        run: cargo check -p kiana-ports -p kiana-core -p kiana-daemon --tests --locked
