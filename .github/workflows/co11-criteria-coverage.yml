name: co11-criteria-coverage

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/criteria.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/artifact_contracts.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/co11_criteria_coverage.rs"
      - "kiana-core/tests/co11_criteria_coverage_guard.rs"
      - "docs/roadmap/co11-criteria-coverage-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co11-criteria-coverage.yml"
  pull_request:
    paths:
      - "kiana-domain/src/criteria.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/artifact_contracts.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/co11_criteria_coverage.rs"
      - "kiana-core/tests/co11_criteria_coverage_guard.rs"
      - "docs/roadmap/co11-criteria-coverage-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co11-criteria-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criteria-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-11 typed coverage fixtures
        run: cargo test -p kiana-domain --test co11_criteria_coverage --locked -- --test-threads=1
      - name: Run CO-11 coverage source guard
        run: cargo test -p kiana-core --test co11_criteria_coverage_guard --locked -- --test-threads=1
      - name: Compile CO-11 Company targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
