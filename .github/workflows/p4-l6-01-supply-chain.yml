name: P4-L6-01 extension supply chain

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/extensions.rs"
      - "kiana-daemon/src/extensions.rs"
      - "kiana-daemon/src/local_packages.rs"
      - "kiana-domain/tests/p4_l6_01_supply_chain.rs"
      - "kiana-core/tests/p4_l6_01_supply_chain.rs"
      - "docs/roadmap/p4-l6-01-supply-chain-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-l6-01-supply-chain.yml"
  pull_request:
    paths:
      - "kiana-domain/src/extensions.rs"
      - "kiana-daemon/src/extensions.rs"
      - "kiana-daemon/src/local_packages.rs"
      - "kiana-domain/tests/p4_l6_01_supply_chain.rs"
      - "kiana-core/tests/p4_l6_01_supply_chain.rs"
      - "docs/roadmap/p4-l6-01-supply-chain-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-l6-01-supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run daemon signature fixture
        run: cargo test -p kiana-daemon --lib extension_signature_is_verified_before_install --locked -- --test-threads=1
      - name: Run domain package fixture
        run: cargo test -p kiana-domain --test p4_l6_01_supply_chain --locked -- --test-threads=1
      - name: Run source supply-chain guard
        run: cargo test -p kiana-core --test p4_l6_01_supply_chain --locked -- --test-threads=1
      - name: Compile P4-L6-01 targets
        run: cargo check --workspace --tests --locked
