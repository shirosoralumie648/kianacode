name: cm29-projection-recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/projection_recovery.rs"
      - "kiana-domain/src/projection_contracts.rs"
      - "kiana-domain/src/memory_journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm29_projection_recovery.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/projection_checkpoint.rs"
      - "kiana-core/tests/cm29_projection_recovery_guard.rs"
      - "kiana-eventlog/src/stream.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm29-projection-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm29-projection-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/projection_recovery.rs"
      - "kiana-domain/src/projection_contracts.rs"
      - "kiana-domain/src/memory_journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm29_projection_recovery.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/projection_checkpoint.rs"
      - "kiana-core/tests/cm29_projection_recovery_guard.rs"
      - "kiana-eventlog/src/stream.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm29-projection-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm29-projection-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-29 projection recovery fixtures
        run: cargo test -p kiana-domain --test cm29_projection_recovery --locked -- --test-threads=1
      - name: Run CM-29 source guard
        run: cargo test -p kiana-core --test cm29_projection_recovery_guard --locked -- --test-threads=1
