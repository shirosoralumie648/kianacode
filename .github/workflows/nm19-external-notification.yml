name: NM-19 external notification contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-notification:
    name: NM-19 external notification/webhook contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-19 domain fixtures
        run: cargo test -p kiana-domain --test nm19_external_notification --locked -- --test-threads=1
      - name: Run NM-19 core fixtures
        run: cargo test -p kiana-core --test nm19_external_notification --locked -- --test-threads=1
      - name: Run NM-19 source guard
        run: cargo test -p kiana-core --test nm19_external_notification_guard --locked -- --test-threads=1
      - name: Compile NM-19 domain target
        run: cargo test -p kiana-domain --test nm19_external_notification --no-run --locked
      - name: Compile NM-19 core target
        run: cargo test -p kiana-core --test nm19_external_notification --no-run --locked
      - name: Compile NM-19 source guard target
        run: cargo test -p kiana-core --test nm19_external_notification_guard --no-run --locked
