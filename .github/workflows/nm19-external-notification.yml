name: NM-19 external notification contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_external.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_external.rs"
      - "kiana-core/tests/fixtures/nm19-external-notification.json"
      - "kiana-core/tests/nm19_external_notification.rs"
      - "kiana-core/tests/nm19_external_notification_guard.rs"
      - "docs/roadmap/nm19-external-notification-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm19-external-notification.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_external.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_external.rs"
      - "kiana-core/tests/fixtures/nm19-external-notification.json"
      - "kiana-core/tests/nm19_external_notification.rs"
      - "kiana-core/tests/nm19_external_notification_guard.rs"
      - "docs/roadmap/nm19-external-notification-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm19-external-notification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run external notification fixtures
        run: cargo test -p kiana-core --test nm19_external_notification --locked -- --test-threads=1
      - name: Run external notification source guard
        run: cargo test -p kiana-core --test nm19_external_notification_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
