name: PD-14 artifact store

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-eventlog/src/artifact_store.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/tests/pd14_artifact_store.rs"
      - "kiana-eventlog/tests/pd14_artifact_guard.rs"
      - "docs/roadmap/pd14-artifact-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd14-artifact-store.yml"
  pull_request:
    paths:
      - "kiana-eventlog/src/artifact_store.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/tests/pd14_artifact_store.rs"
      - "kiana-eventlog/tests/pd14_artifact_guard.rs"
      - "docs/roadmap/pd14-artifact-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd14-artifact-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run artifact store fixtures
        run: cargo test -p kiana-eventlog --test pd14_artifact_store --locked -- --test-threads=1
      - name: Run artifact store source guard
        run: cargo test -p kiana-eventlog --test pd14_artifact_guard --locked -- --test-threads=1
      - name: Compile PD-14 targets
        run: cargo check --workspace --tests --locked
