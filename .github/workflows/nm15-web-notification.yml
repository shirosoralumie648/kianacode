name: NM-15 web notification snapshot/page and SSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-notification:
    name: NM-15 notification page cursor, SSE replay and no-command surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-15 web notification presenter fixtures
        run: cargo test -p kiana-entrypoints --test nm15_web_notification --locked -- --test-threads=1
      - name: Run NM-15 web notification source guard
        run: cargo test -p kiana-entrypoints --test nm15_web_notification_guard --locked -- --test-threads=1
      - name: Run NM-15 live loopback page and SSE fixtures
        # The live fixtures live in the crate's unit-test module because they drive the private
        # router; they are the only place the real Axum app is exercised over HTTP.
        run: cargo test -p kiana-entrypoints --lib nm15_notification --locked -- --test-threads=1
      - name: Compile NM-15 web notification target
        run: cargo test -p kiana-entrypoints --test nm15_web_notification --no-run --locked
      - name: Compile NM-15 web notification source guard target
        run: cargo test -p kiana-entrypoints --test nm15_web_notification_guard --no-run --locked
      - name: Compile NM-15 live loopback fixtures
        run: cargo test -p kiana-entrypoints --lib nm15_notification --no-run --locked
