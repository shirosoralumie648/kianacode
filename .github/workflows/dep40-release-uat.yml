name: DEP-40 release and recovery cross-entrypoint UAT

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/release_uat.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep40_release_uat.rs"
      - "kiana-core/tests/dep40_release_uat_guard.rs"
      - "kiana-core/tests/oa24_entrypoint_parity.rs"
      - "kiana-daemon/tests/eq12_daemon_spine.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "contrib/desktop/main.js"
      - "docs/roadmap/dep40-release-uat-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep40-release-uat.yml"
  pull_request:
    paths:
      - "kiana-domain/src/release_uat.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep40_release_uat.rs"
      - "kiana-core/tests/dep40_release_uat_guard.rs"
      - "kiana-core/tests/oa24_entrypoint_parity.rs"
      - "kiana-daemon/tests/eq12_daemon_spine.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - "contrib/desktop/main.js"
      - "docs/roadmap/dep40-release-uat-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep40-release-uat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-40 UAT matrix fixture
        run: cargo test -p kiana-domain --test dep40_release_uat --locked -- --test-threads=1
      - name: Run DEP-40 source and spine guard
        run: cargo test -p kiana-core --test dep40_release_uat_guard --locked -- --test-threads=1
      - name: Run existing entrypoint parity fixture
        run: cargo test -p kiana-core --test oa24_entrypoint_parity --locked -- --test-threads=1
      - name: Run existing DaemonHost spine fixture
        run: cargo test -p kiana-daemon --test eq12_daemon_spine --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
