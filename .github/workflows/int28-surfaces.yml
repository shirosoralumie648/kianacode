name: INT-28 connector surfaces

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_surfaces.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_surfaces.rs"
      - "kiana-core/src/connector_surfaces.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int28_connector_surfaces_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/int28_connector_surfaces.rs"
      - "docs/roadmap/int28-surfaces-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int28-surfaces.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_surfaces.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_surfaces.rs"
      - "kiana-core/src/connector_surfaces.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/int28_connector_surfaces_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/int28_connector_surfaces.rs"
      - "docs/roadmap/int28-surfaces-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int28-surfaces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-28 domain fixtures
        run: cargo test -p kiana-domain --test connector_surfaces --locked -- --test-threads=1
      - name: Run INT-28 protocol fixtures
        run: cargo test -p kiana-protocol --test int28_connector_surfaces --locked -- --test-threads=1
      - name: Run INT-28 Core source guard
        run: cargo test -p kiana-core --test int28_connector_surfaces_guard --locked -- --test-threads=1
      - name: Compile INT-28 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-protocol --tests --locked
