name: oa18-audit-export

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/audit_export.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/tests/oa18_audit_export.rs"
      - "kiana-protocol/tests/oa18_audit_export.rs"
      - ".github/workflows/oa18-audit-export.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/audit_export.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/tests/oa18_audit_export.rs"
      - "kiana-protocol/tests/oa18_audit_export.rs"
      - ".github/workflows/oa18-audit-export.yml"

permissions:
  contents: read

jobs:
  oa18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa18-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-18 remote-only domain fixtures
        run: cargo test -p kiana-core --test oa18_audit_export --locked -- --test-threads=1
      - name: Run OA-18 remote-only wire fixtures
        run: cargo test -p kiana-protocol --test oa18_audit_export --locked -- --test-threads=1
