name: co38-company-read-model

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_read_model.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co38_company_read_model.rs"
      - "kiana-core/src/company_read_model.rs"
      - "kiana-core/src/company_governance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co38_company_read_model_guard.rs"
      - "docs/roadmap/co38-company-read-model-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co38-company-read-model.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_read_model.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co38_company_read_model.rs"
      - "kiana-core/src/company_read_model.rs"
      - "kiana-core/src/company_governance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co38_company_read_model_guard.rs"
      - "docs/roadmap/co38-company-read-model-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co38-company-read-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-read-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-38 read model fixtures
        run: cargo test -p kiana-domain --test co38_company_read_model --locked -- --test-threads=1
      - name: Run CO-38 read-only source guard
        run: cargo test -p kiana-core --test co38_company_read_model_guard --locked -- --test-threads=1
      - name: Compile CO-38 read model targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
