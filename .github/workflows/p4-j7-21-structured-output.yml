name: p4-j7-21-structured-output

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/**"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/tests/p4_j7_21_structured_output_guard.rs"
      - "docs/roadmap/p4-j7-21-structured-output-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-21-structured-output.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_workbench.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/**"
      - "kiana-runner/src/harness.rs"
      - "kiana-core/tests/p4_j7_21_structured_output_guard.rs"
      - "docs/roadmap/p4-j7-21-structured-output-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-21-structured-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structured-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-21 provider fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run P4-J7-21 structured-output source guard
        run: cargo test -p kiana-core --test p4_j7_21_structured_output_guard --locked -- --test-threads=1
