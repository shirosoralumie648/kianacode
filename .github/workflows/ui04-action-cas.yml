name: UI-04 action CAS and response loss

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ui_action.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ui04_action_journal.rs"
      - "kiana-core/src/ui_actions.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ui04_action_journal_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/ui04-action-cas-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui04-action-cas.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ui_action.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ui04_action_journal.rs"
      - "kiana-core/src/ui_actions.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/ui04_action_journal_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/ui04-action-cas-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui04-action-cas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui04-action-cas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run UI-04 domain action journal fixtures
        run: cargo test -p kiana-domain --test ui04_action_journal --locked -- --test-threads=1
      - name: Run UI-04 ControlPlane source guard
        run: cargo test -p kiana-core --test ui04_action_journal_guard --locked -- --test-threads=1
      - name: Compile UI-04 workspace targets
        run: cargo check --workspace --tests --locked
