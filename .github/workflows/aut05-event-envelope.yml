name: AUT-05 automation event envelope

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/aut05_event_envelope.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/automation.rs"
      - "kiana-core/tests/aut05_event_guard.rs"
      - "docs/roadmap/automation-event-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut05-event-envelope.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/aut05_event_envelope.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/automation.rs"
      - "kiana-core/tests/aut05_event_guard.rs"
      - "docs/roadmap/automation-event-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut05-event-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run automation event envelope fixtures
        run: cargo test -p kiana-domain --test aut05_event_envelope --locked -- --test-threads=1
      - name: Run automation event source guard
        run: cargo test -p kiana-core --test aut05_event_guard --locked -- --test-threads=1
      - name: Compile AUT-05 targets
        run: cargo check --workspace --tests --locked

