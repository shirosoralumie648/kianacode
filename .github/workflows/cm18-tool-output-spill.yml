name: cm18-tool-output-spill

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/tool_output_spill.rs"
      - "kiana-domain/src/execution_output.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm18_tool_output_spill.rs"
      - "kiana-core/tests/cm18_tool_output_spill_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm18-tool-output-spill-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm18-tool-output-spill.yml"
  pull_request:
    paths:
      - "kiana-domain/src/tool_output_spill.rs"
      - "kiana-domain/src/execution_output.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm18_tool_output_spill.rs"
      - "kiana-core/tests/cm18_tool_output_spill_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm18-tool-output-spill-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm18-tool-output-spill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-output-spill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-18 tool-output spill fixtures
        run: cargo test -p kiana-domain --test cm18_tool_output_spill --locked -- --test-threads=1
      - name: Run CM-18 source guard
        run: cargo test -p kiana-core --test cm18_tool_output_spill_guard --locked -- --test-threads=1
