name: oa21-replay-diagnostics

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/replay_diagnostics.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/invocation_projection.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa21_replay_diagnostics.rs"
      - ".github/workflows/oa21-replay-diagnostics.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/replay_diagnostics.rs"
      - "kiana-core/src/audit_projection.rs"
      - "kiana-core/src/health.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/src/invocation_projection.rs"
      - "kiana-core/src/span_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa21_replay_diagnostics.rs"
      - ".github/workflows/oa21-replay-diagnostics.yml"

permissions:
  contents: read

jobs:
  oa21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa21-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-21 remote-only fixtures
        run: cargo test -p kiana-core --test oa21_replay_diagnostics --locked -- --test-threads=1
