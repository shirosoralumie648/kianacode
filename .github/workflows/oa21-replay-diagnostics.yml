name: "OA-21 replay diagnostics and audit consistency"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oa21-replay-diagnostics:
    name: "OA-21 replay diagnostics and audit consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core oa21_replay_diagnostics
        run: cargo test -p kiana-core --test oa21_replay_diagnostics --locked -- --test-threads=1
      - name: Run kiana-core oa21_replay_diagnostics_guard
        run: cargo test -p kiana-core --test oa21_replay_diagnostics_guard --locked -- --test-threads=1
      - name: Run kiana-core h25_replay_fault_guard regression
        run: cargo test -p kiana-core --test h25_replay_fault_guard --locked -- --test-threads=1
      - name: Compile kiana-core oa21_replay_diagnostics
        run: cargo test -p kiana-core --test oa21_replay_diagnostics --no-run --locked
      - name: Compile kiana-core oa21_replay_diagnostics_guard
        run: cargo test -p kiana-core --test oa21_replay_diagnostics_guard --no-run --locked
