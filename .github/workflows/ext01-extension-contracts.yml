name: EXT-01 extension contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/extension_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext01_contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/ext01_protocol.rs"
      - "docs/roadmap/extension-contracts-baseline.md"
      - ".github/workflows/ext01-extension-contracts.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/context_scope.rs"
      - "kiana-domain/src/extension_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext01_contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/ext01_protocol.rs"
      - "docs/roadmap/extension-contracts-baseline.md"
      - ".github/workflows/ext01-extension-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-01 domain fixtures
        run: cargo test -p kiana-domain --test ext01_contracts --locked -- --test-threads=1
      - name: Run EXT-01 protocol fixtures
        run: cargo test -p kiana-protocol --test ext01_protocol --locked -- --test-threads=1
