name: SC-11 entrypoint and adapter parity

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/parity.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/entrypoint_parity.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sc11_entrypoint_parity.rs"
      - "kiana-core/tests/sc11_entrypoint_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/security-entrypoint-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc11-entrypoint-parity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/parity.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/entrypoint_parity.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sc11_entrypoint_parity.rs"
      - "kiana-core/tests/sc11_entrypoint_guard.rs"
      - "kiana-daemon/src/lib.rs"
      - "docs/roadmap/security-entrypoint-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc11-entrypoint-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrypoint-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-11 parity fixture
        run: cargo test -p kiana-core --test sc11_entrypoint_parity --locked -- --test-threads=1
      - name: Run SC-11 source guard
        run: cargo test -p kiana-core --test sc11_entrypoint_guard --locked -- --test-threads=1
      - name: Compile SC-11 targets
        run: cargo check --workspace --tests --locked
