name: "CM-36 User memory workbench and bulk operations baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cm36-memory-workbench:
    name: "CM-36 User memory workbench and bulk operations baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core cm36_memory_workbench_guard
        run: cargo test -p kiana-core --test cm36_memory_workbench_guard --locked -- --test-threads=1
      - name: Run kiana-domain cm36_memory_workbench
        run: cargo test -p kiana-domain --test cm36_memory_workbench --locked -- --test-threads=1
