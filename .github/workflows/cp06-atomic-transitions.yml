name: CP-06 atomic transitions and command idempotency

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/stream.rs"
      - "kiana-eventlog/tests/cp06_atomic_transitions.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/tests/cp06_transition_guard.rs"
      - "docs/roadmap/control-plane-transition-baseline.md"
      - ".github/workflows/cp06-atomic-transitions.yml"
  pull_request:
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/stream.rs"
      - "kiana-eventlog/tests/cp06_atomic_transitions.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/approvals.rs"
      - "kiana-core/tests/cp06_transition_guard.rs"
      - "docs/roadmap/control-plane-transition-baseline.md"
      - ".github/workflows/cp06-atomic-transitions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-06 eventlog transition fixtures
        run: cargo test -p kiana-eventlog --test cp06_atomic_transitions --locked -- --test-threads=1
      - name: Run CP-06 source guard
        run: cargo test -p kiana-core --test cp06_transition_guard --locked -- --test-threads=1
