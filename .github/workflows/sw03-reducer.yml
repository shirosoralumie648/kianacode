name: SW-03 swarm status reducer

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/swarm_reducer.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sw03_reducer.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/tests/sw03_reducer_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/swarm-reducer-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw03-reducer.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/swarm_reducer.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sw03_reducer.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/tests/sw03_reducer_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/swarm-reducer-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw03-reducer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-reducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-03 reducer fixtures
        run: cargo test -p kiana-domain --test sw03_reducer --locked -- --test-threads=1
      - name: Run SW-03 source guard
        run: cargo test -p kiana-core --test sw03_reducer_guard --locked -- --test-threads=1
      - name: Compile reducer path
        run: cargo check -p kiana-domain -p kiana-protocol -p kiana-core --tests --locked
