name: AUT-21 boot recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_boot_recovery.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_boot_recovery.rs"
      - "kiana-core/src/automation_boot_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_boot_recovery_guard.rs"
      - "docs/roadmap/aut21-boot-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut21-boot-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_boot_recovery.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_boot_recovery.rs"
      - "kiana-core/src/automation_boot_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_boot_recovery_guard.rs"
      - "docs/roadmap/aut21-boot-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut21-boot-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_boot_recovery --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_boot_recovery_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
