name: AUT-21 boot recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-recovery:
    name: AUT-21 boot recovery / projection rebuild / reconcile fence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check

      # Domain contract, deny-first: a lagging projection, pending Unknown, typed reconcile cases,
      # stale/active leases, journal corruption/schema drift and old/ahead authority epochs all keep
      # Ready refused with stable codes.
      - name: Run domain boot recovery fixtures
        run: cargo test -p kiana-domain --test automation_boot_recovery --locked -- --test-threads=1
      # Core facade: no second execution loop; resume refuses a self-certified Ready and only
      # derives Ready after every barrier is clear.
      - name: Run core boot recovery guard
        run: cargo test -p kiana-core --test automation_boot_recovery_guard --locked -- --test-threads=1
      # Daemon: restart defaults to Rebooting/ReconcileRequired, dispatch stays fenced, explicit
      # operator resume routes through ControlPlane and never starts the dispatch/workflow services.
      - name: Run daemon boot recovery fixtures
        run: cargo test -p kiana-daemon --test aut21_boot_recovery --locked -- --test-threads=1

      - name: Compile domain boot recovery target
        run: cargo test -p kiana-domain --test automation_boot_recovery --no-run --locked
      - name: Compile core boot recovery guard
        run: cargo test -p kiana-core --test automation_boot_recovery_guard --no-run --locked
      - name: Compile daemon boot recovery target
        run: cargo test -p kiana-daemon --test aut21_boot_recovery --no-run --locked
