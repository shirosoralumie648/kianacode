name: SC-14 network policy and sandbox boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/network_policy.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/Cargo.toml"
      - "kiana-domain/tests/sc14_network_policy.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/harness_sandbox.rs"
      - "kiana-services/src/network_policy.rs"
      - "kiana-core/tests/sc14_network_policy_guard.rs"
      - "docs/roadmap/sc14-network-policy-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc14-network-policy.yml"
  pull_request:
    paths:
      - "kiana-domain/src/network_policy.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/Cargo.toml"
      - "kiana-domain/tests/sc14_network_policy.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-daemon/src/harness_sandbox.rs"
      - "kiana-services/src/network_policy.rs"
      - "kiana-core/tests/sc14_network_policy_guard.rs"
      - "docs/roadmap/sc14-network-policy-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc14-network-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-14 domain fixtures
        run: cargo test -p kiana-domain --test sc14_network_policy --locked -- --test-threads=1
      - name: Run SC-14 source guard
        run: cargo test -p kiana-core --test sc14_network_policy_guard --locked -- --test-threads=1
      - name: Compile SC-14 targets
        run: cargo check --workspace --tests --locked
