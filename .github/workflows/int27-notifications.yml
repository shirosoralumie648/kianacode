name: INT-27 connector notifications

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/connector_notifications.rs"
      - "kiana-domain/src/notification_events.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_notifications.rs"
      - "kiana-core/src/connector_notifications.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_materializer.rs"
      - "kiana-core/tests/int27_connector_notifications_guard.rs"
      - "docs/roadmap/int27-notifications-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int27-notifications.yml"
  pull_request:
    paths:
      - "kiana-domain/src/connector_notifications.rs"
      - "kiana-domain/src/notification_events.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/connector_notifications.rs"
      - "kiana-core/src/connector_notifications.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_materializer.rs"
      - "kiana-core/tests/int27_connector_notifications_guard.rs"
      - "docs/roadmap/int27-notifications-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int27-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run INT-27 domain fixtures
        run: cargo test -p kiana-domain --test connector_notifications --locked -- --test-threads=1
      - name: Run INT-27 Core source guard
        run: cargo test -p kiana-core --test int27_connector_notifications_guard --locked -- --test-threads=1
      - name: Compile INT-27 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
