name: oa10-operational-metrics

on:
  push:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/tests/oa10_operational_metrics.rs"
      - ".github/workflows/oa10-operational-metrics.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/observability.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/metrics.rs"
      - "kiana-core/tests/oa10_operational_metrics.rs"
      - ".github/workflows/oa10-operational-metrics.yml"

permissions:
  contents: read

jobs:
  oa10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa10-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-10 remote-only fixtures
        run: cargo test -p kiana-core --test oa10_operational_metrics --locked -- --test-threads=1
