name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and URL
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match VERSION ${version}; expected ${expected_tag}" >&2
            exit 1
          fi
          release_tag="${GITHUB_REF_NAME:-${expected_tag}}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            release_tag="${expected_tag}"
          fi
          echo "KIANA_RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "KIANA_RELEASE_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked

      - name: Install compliance tools
        shell: bash
        run: bash scripts/install-compliance-tools.sh

      - name: Run release preflight
        shell: bash
        env:
          KIANA_LIVE_SMOKE_DIR: dist/proofs/live-smoke
          KIANA_ENTITLEMENT_PROOF_OUT: dist/proofs/entitlement/entitlement-proof.json
          KIANA_ENTITLEMENT_PROOF_FILE: ${{ vars.KIANA_ENTITLEMENT_PROOF_FILE }}
          KIANA_REQUIRED_ENTITLEMENTS: ${{ vars.KIANA_REQUIRED_ENTITLEMENTS }}
          KIANA_PRODUCT_ACCEPTANCE_OUT: dist/proofs/product/product-acceptance.json
          KIANA_PRODUCT_ACCEPTANCE_FILE: ${{ vars.KIANA_PRODUCT_ACCEPTANCE_FILE }}
          KIANA_RELEASE_OPS_OUT: dist/proofs/release-ops/release-ops.json
          KIANA_RELEASE_OPS_FILE: ${{ vars.KIANA_RELEASE_OPS_FILE }}
        run: KIANA_PREFLIGHT_SKIP_COMPLIANCE=1 bash scripts/release-preflight.sh

      - name: Run release smoke
        shell: bash
        run: bash scripts/release-smoke.sh

      - name: Package release artifact
        shell: bash
        run: KIANA_PACKAGE_COMPLIANCE_MODE=full bash scripts/package-release.sh

      - name: Run package lifecycle smoke
        shell: bash
        run: bash scripts/package-lifecycle-smoke.sh

      - name: Sign release artifacts
        shell: bash
        env:
          KIANA_SIGNING_COMMAND: ${{ secrets.KIANA_SIGNING_COMMAND }}
          KIANA_RELEASE_SIGNER: ${{ vars.KIANA_RELEASE_SIGNER }}
          KIANA_MACOS_NOTARIZATION_COMMAND: ${{ secrets.KIANA_MACOS_NOTARIZATION_COMMAND }}
          KIANA_MACOS_NOTARIZATION_PROOF_FILE: ${{ secrets.KIANA_MACOS_NOTARIZATION_PROOF_FILE }}
        run: bash scripts/sign-release-artifacts.sh

      - name: Run compliance audit
        shell: bash
        run: bash scripts/compliance-audit.sh

      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c *.sha256
          else
            shasum -a 256 -c *.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kiana-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
            dist/*.signature.json
            dist/*.notarization.json
            dist/*.zip
            dist/*.msi
            dist/*.exe
            dist/proofs/**
            dist/manifests/**
            dist/compliance/*
          if-no-files-found: error

  github-release:
    name: Draft GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Regenerate combined distribution manifests
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME}"
          KIANA_RELEASE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}" \
            DIST_DIR=release-artifacts \
            MANIFEST_DIR=release-artifacts/manifests \
            bash scripts/generate-distribution-manifests.sh

      - name: Verify commercial release artifacts
        shell: bash
        run: |
          DIST_DIR=release-artifacts \
            MANIFEST_DIR=release-artifacts/manifests \
            bash scripts/verify-commercial-release-artifacts.sh

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/**
