name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install compliance tools
        shell: bash
        run: bash scripts/install-compliance-tools.sh

      - name: Run release smoke
        shell: bash
        run: bash scripts/release-smoke.sh

      - name: Package release artifact
        shell: bash
        run: KIANA_PACKAGE_COMPLIANCE_MODE=full bash scripts/package-release.sh

      - name: Run compliance audit
        shell: bash
        run: bash scripts/compliance-audit.sh

      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c *.sha256
          else
            shasum -a 256 -c *.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kiana-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/compliance/*
          if-no-files-found: error

  github-release:
    name: Draft GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
