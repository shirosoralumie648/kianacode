name: SC-00 security and compliance baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SC-00 source guard
        run: cargo test -p kiana-core --test security_baseline --locked -- --test-threads=1
