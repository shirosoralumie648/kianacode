name: P1-H-03 shared path containment

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/paths.rs"
      - "kiana-domain/tests/p1_h03_path_containment.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/p1_h03_path_containment_guard.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/execution_workspace.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/workspace_checkpoints.rs"
      - "docs/roadmap/path-containment-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-h03-path-containment.yml"
  pull_request:
    paths:
      - "kiana-domain/src/paths.rs"
      - "kiana-domain/tests/p1_h03_path_containment.rs"
      - "kiana-core/src/cell_registry.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/p1_h03_path_containment_guard.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/execution_workspace.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/workspace_checkpoints.rs"
      - "docs/roadmap/path-containment-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-h03-path-containment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-H-03 path fixture
        run: cargo test -p kiana-domain --test p1_h03_path_containment --locked -- --test-threads=1
      - name: Run P1-H-03 source guard
        run: cargo test -p kiana-core --test p1_h03_path_containment_guard --locked -- --test-threads=1
      - name: Compile containment path
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
