name: "EQ-28 runtime correctness evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq28-runtime-correctness:
    name: "EQ-28 runtime correctness evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq28_runtime
        run: cargo test -p kiana-quality --test eq28_runtime --locked -- --test-threads=1
      - name: Run kiana-quality eq28_runtime_guard
        run: cargo test -p kiana-quality --test eq28_runtime_guard --locked -- --test-threads=1
