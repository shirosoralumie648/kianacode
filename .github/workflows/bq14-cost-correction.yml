name: BQ-14 cost ledger corrections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-corrections:
    name: BQ-14 ledger and correction fixtures and guards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-14 domain ledger fixtures
        run: cargo test -p kiana-domain --test bq14_cost_correction --locked -- --test-threads=1
      - name: Run BQ-14 protocol wire fixtures
        run: cargo test -p kiana-protocol --test bq14_cost_correction_wire --locked -- --test-threads=1
      - name: Run BQ-14 core admission fixtures
        run: cargo test -p kiana-core --test bq14_cost_correction --locked -- --test-threads=1
      - name: Run BQ-14 core source guard
        run: cargo test -p kiana-core --test bq14_cost_correction_guard --locked -- --test-threads=1
      - name: Run BQ-14 query projector fixtures
        run: cargo test -p kiana-query --test bq14_cost_ledger_projector --locked -- --test-threads=1
      - name: Run BQ-14 query projector guard
        run: cargo test -p kiana-query --test bq14_cost_ledger_projector_guard --locked -- --test-threads=1
      - name: Compile BQ-14 domain target
        run: cargo test -p kiana-domain --test bq14_cost_correction --no-run --locked
      - name: Compile BQ-14 protocol target
        run: cargo test -p kiana-protocol --test bq14_cost_correction_wire --no-run --locked
      - name: Compile BQ-14 core admission target
        run: cargo test -p kiana-core --test bq14_cost_correction --no-run --locked
      - name: Compile BQ-14 core guard target
        run: cargo test -p kiana-core --test bq14_cost_correction_guard --no-run --locked
      - name: Compile BQ-14 query projector target
        run: cargo test -p kiana-query --test bq14_cost_ledger_projector --no-run --locked
      - name: Compile BQ-14 query guard target
        run: cargo test -p kiana-query --test bq14_cost_ledger_projector_guard --no-run --locked
