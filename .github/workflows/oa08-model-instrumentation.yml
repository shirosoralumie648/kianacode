name: OA-08 Provider Model Instrumentation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-instrumentation:
    name: Provider/model/stream/usage projection guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run OA-08 model instrumentation tests
        run: cargo test -p kiana-core --test oa08_model_instrumentation --locked -- --test-threads=1
      - name: Run OA-08 provider telemetry tests
        run: cargo test -p kiana-provider --test oa08_provider_telemetry --locked -- --test-threads=1
