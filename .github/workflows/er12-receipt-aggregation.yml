name: ER-12 receipt aggregation and evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-aggregation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ER-12 aggregation contract fixtures
        run: cargo test -p kiana-domain --test er12_receipt_aggregation --locked -- --test-threads=1
      - name: Run ER-12 aggregation reducer fixtures
        run: cargo test -p kiana-core --test er12_receipt_aggregation --locked -- --test-threads=1
      - name: Compile ER-12 targets
        run: cargo check --workspace --tests --locked
