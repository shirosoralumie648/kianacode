name: ER-12 receipt aggregation and evidence

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/receipt_aggregation.rs"
      - "kiana-domain/src/receipt_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er12_receipt_aggregation.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/er12_receipt_aggregation.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-aggregation-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er12-receipt-aggregation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/receipt_aggregation.rs"
      - "kiana-domain/src/receipt_contracts.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er12_receipt_aggregation.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/tests/er12_receipt_aggregation.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/event-receipt-aggregation-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er12-receipt-aggregation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-aggregation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-12 aggregation contract fixtures
        run: cargo test -p kiana-domain --test er12_receipt_aggregation --locked -- --test-threads=1
      - name: Run ER-12 aggregation reducer fixtures
        run: cargo test -p kiana-core --test er12_receipt_aggregation --locked -- --test-threads=1
      - name: Compile ER-12 targets
        run: cargo check --workspace --tests --locked
