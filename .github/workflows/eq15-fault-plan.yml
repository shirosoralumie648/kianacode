name: EQ-15 evaluation fault plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-plan:
    name: EQ-15 deterministic fault plan fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EQ-15 daemon fault-plan fixtures
        run: cargo test -p kiana-daemon --test eq15_fault_plan --locked -- --test-threads=1
      - name: Run EQ-15 Core source guard
        run: cargo test -p kiana-core --test eq15_fault_plan_guard --locked -- --test-threads=1
      - name: Compile EQ-15 daemon target
        run: cargo test -p kiana-daemon --test eq15_fault_plan --no-run --locked
      - name: Compile EQ-15 Core guard target
        run: cargo test -p kiana-core --test eq15_fault_plan_guard --no-run --locked
