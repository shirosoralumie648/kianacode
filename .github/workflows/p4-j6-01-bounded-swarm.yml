name: P4-J6-01 bounded swarm

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/swarm_reducer.rs"
      - "kiana-domain/tests/p4_j6_01_bounded_swarm.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p4_j6_01_bounded_swarm.rs"
      - "kiana-core/tests/sw02_work_graph_guard.rs"
      - "kiana-core/tests/sw03_reducer_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p4-j6-01-bounded-swarm-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j6-01-bounded-swarm.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm.rs"
      - "kiana-domain/src/swarm_graph.rs"
      - "kiana-domain/src/swarm_reducer.rs"
      - "kiana-domain/tests/p4_j6_01_bounded_swarm.rs"
      - "kiana-core/src/swarm.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p4_j6_01_bounded_swarm.rs"
      - "kiana-core/tests/sw02_work_graph_guard.rs"
      - "kiana-core/tests/sw03_reducer_guard.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p4-j6-01-bounded-swarm-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j6-01-bounded-swarm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run bounded fan-out/fan-in fixture
        run: cargo test -p kiana-domain --test p4_j6_01_bounded_swarm --locked -- --test-threads=1
      - name: Run swarm authority source guard
        run: cargo test -p kiana-core --test p4_j6_01_bounded_swarm --locked -- --test-threads=1
      - name: Run graph and reducer regressions
        run: |
          cargo test -p kiana-domain --test sw02_work_graph --locked -- --test-threads=1
          cargo test -p kiana-domain --test sw03_reducer --locked -- --test-threads=1
          cargo test -p kiana-core --test sw02_work_graph_guard --locked -- --test-threads=1
          cargo test -p kiana-core --test sw03_reducer_guard --locked -- --test-threads=1
      - name: Compile P4-J6-01 targets
        run: cargo check --workspace --tests --locked
