name: UI-08 shared reducer and entity store

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-client/src/lib.rs"
      - "kiana-client/src/ui_store.rs"
      - "kiana-client/tests/ui08_reducer_store.rs"
      - "kiana-core/tests/ui08_reducer_store_guard.rs"
      - "kiana-entrypoints/tests/ui08_store_boundary_guard.rs"
      - "docs/roadmap/ui08-reducer-store-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui08-reducer-store.yml"
  pull_request:
    paths:
      - "kiana-client/src/lib.rs"
      - "kiana-client/src/ui_store.rs"
      - "kiana-client/tests/ui08_reducer_store.rs"
      - "kiana-core/tests/ui08_reducer_store_guard.rs"
      - "kiana-entrypoints/tests/ui08_store_boundary_guard.rs"
      - "docs/roadmap/ui08-reducer-store-baseline.md"
      - "docs/roadmap/ui-entrypoints.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ui08-reducer-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui08-reducer-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run UI-08 pure reducer fixtures
        run: cargo test -p kiana-client --test ui08_reducer_store --locked -- --test-threads=1
      - name: Run UI-08 authority source guard
        run: cargo test -p kiana-core --test ui08_reducer_store_guard --locked -- --test-threads=1
      - name: Run UI-08 entrypoint boundary source guard
        run: cargo test -p kiana-entrypoints --test ui08_store_boundary_guard --locked -- --test-threads=1
      - name: Compile UI-08 workspace test targets
        run: cargo check --workspace --tests --locked
