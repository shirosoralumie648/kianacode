name: "UI-34 性能、资源上限和可访问性验收基线"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui34-resource-budget:
    name: "UI-34 性能、资源上限和可访问性验收基线"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui34_resource_budget
        run: cargo test -p kiana-client --test ui34_resource_budget --locked -- --test-threads=1
