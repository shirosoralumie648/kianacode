name: P1-C-03 role model routing

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/roles.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/prompts.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/events.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/tests/co04_role_model_routes.rs"
      - "kiana-core/tests/p1_c03_model_routing_guard.rs"
      - "docs/roadmap/role-model-routing-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-c03-model-routing.yml"
  pull_request:
    paths:
      - "kiana-domain/src/roles.rs"
      - "kiana-domain/src/model.rs"
      - "kiana-domain/src/prompts.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/events.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/tests/co04_role_model_routes.rs"
      - "kiana-core/tests/p1_c03_model_routing_guard.rs"
      - "docs/roadmap/role-model-routing-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-c03-model-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-model-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-C-03 provider route fixture
        run: cargo test -p kiana-provider --test co04_role_model_routes --locked -- --test-threads=1
      - name: Run P1-C-03 source guard
        run: cargo test -p kiana-core --test p1_c03_model_routing_guard --locked -- --test-threads=1
      - name: Compile role/model path
        run: cargo check -p kiana-domain -p kiana-provider -p kiana-core --tests --locked
