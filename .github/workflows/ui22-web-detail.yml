name: "UI-22 Web artifact, diff and receipt detail"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui22-web-detail:
    name: "UI-22 Web artifact, diff and receipt detail"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The live fixtures drive a real DaemonHost/Web router and the receipt fixture re-execs the
      # test binary as a fresh process; the project convention for daemon/entrypoint tests is a
      # 32 MiB test-thread stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      # Deny-first: refusal fixtures run before the success fixture in each target.
      - name: Run the artifact/diff/receipt fixture bindings
        run: cargo test -p kiana-entrypoints --test ui22_web_detail --locked -- --test-threads=1
      - name: Run the read-only route guard
        run: cargo test -p kiana-entrypoints --test ui22_web_detail_guard --locked -- --test-threads=1
      - name: Run the typed client projection fixtures
        run: cargo test -p kiana-client --test ui22_web_detail --locked -- --test-threads=1
      # Covers the receipt source-set fix (run.receipt/run.snapshot must not rewrite the digest),
      # the foreign-session refusal, the fresh-process recomputation and the two source guards.
      - name: Run the receipt stability and fresh-process recomputation fixtures
        run: cargo test -p kiana-core --test ui22_receipt_detail --locked -- --test-threads=1
      # Live loopback detail routes: partial-file refusal, token/host/session fences, expired
      # server cursor, binary/oversize limitations and the typed receipt digest projection.
      - name: Run the live loopback detail fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui22_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
