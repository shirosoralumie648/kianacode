name: oa27-company-governance

on:
  push:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/governance_gate.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_governance.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/oa27_company_governance_wire.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/harness_run.rs"
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - ".github/workflows/oa27-company-governance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/governance_gate.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_governance.rs"
      - "kiana-core/src/commands.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/oa27_company_governance_wire.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/src/harness_run.rs"
      - "kiana-entrypoints/src/web.rs"
      - "kiana-entrypoints/src/workbench_chat.rs"
      - ".github/workflows/oa27-company-governance.yml"

permissions:
  contents: read

jobs:
  oa27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa27-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-27 remote-only CompanyOS governance fixtures
        run: |
          cargo test -p kiana-core --test oa27_company_governance --locked -- --test-threads=1
          cargo test -p kiana-protocol --test oa27_company_governance_wire --locked -- --test-threads=1
