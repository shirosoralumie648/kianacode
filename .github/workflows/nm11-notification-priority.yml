name: NM-11 notification priority

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-priority:
    name: NM-11 server-time urgency/due/read/ACK/snooze/digest projection fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-11 notification priority fixtures
        run: cargo test -p kiana-core --test nm11_notification_priority --locked -- --test-threads=1
      - name: Run NM-11 notification priority source guard
        run: cargo test -p kiana-core --test nm11_notification_priority_guard --locked -- --test-threads=1
      - name: Compile NM-11 notification priority target
        run: cargo test -p kiana-core --test nm11_notification_priority --no-run --locked
      - name: Compile NM-11 notification priority source guard target
        run: cargo test -p kiana-core --test nm11_notification_priority_guard --no-run --locked
