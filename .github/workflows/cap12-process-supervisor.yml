name: CAP-12 process supervisor and resource budgets

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/process_supervisor.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap12_process_supervisor.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-core/tests/cap12_process_supervisor_guard.rs"
      - "docs/roadmap/cap12-process-supervisor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap12-process-supervisor.yml"
  pull_request:
    paths:
      - "kiana-domain/src/process_supervisor.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cap12_process_supervisor.rs"
      - "kiana-daemon/src/process_supervisor.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/mcp_stdio.rs"
      - "kiana-core/tests/cap12_process_supervisor_guard.rs"
      - "docs/roadmap/cap12-process-supervisor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap12-process-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run process contract fixtures
        run: cargo test -p kiana-domain --test cap12_process_supervisor --locked -- --test-threads=1
      - name: Run focused descendant stop fixture
        run: cargo test -p kiana-daemon --lib shell_timeout_terminates_descendant_processes --locked -- --test-threads=1
      - name: Run CAP-12 source guard
        run: cargo test -p kiana-core --test cap12_process_supervisor_guard --locked -- --test-threads=1
      - name: Compile CAP-12 targets
        run: cargo check --workspace --tests --locked
