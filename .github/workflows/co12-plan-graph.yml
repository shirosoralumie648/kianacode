name: "CO-12 Plan and WorkGraph proposal baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co12-plan-graph:
    name: "CO-12 Plan and WorkGraph proposal baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co12_plan_graph_guard
        run: cargo test -p kiana-core --test co12_plan_graph_guard --locked -- --test-threads=1
      - name: Run kiana-domain co12_plan_graph
        run: cargo test -p kiana-domain --test co12_plan_graph --locked -- --test-threads=1
