name: p4-j7-13-transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run P4-J7-13 transport fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run P4-J7-13 source guard
        run: cargo test -p kiana-core --test p4_j7_13_transport_guard --locked -- --test-threads=1
