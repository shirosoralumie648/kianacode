name: int02-connector-contract

on:
  push:
    paths:
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-core/src/connectors.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int02_connector_contract_guard.rs'
      - 'docs/roadmap/int02-connector-contract-baseline.md'
      - '.github/workflows/int02-connector-contract.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/connectors.rs'
      - 'kiana-core/src/connectors.rs'
      - 'kiana-daemon/src/connectors.rs'
      - 'kiana-core/tests/int02_connector_contract_guard.rs'
      - 'docs/roadmap/int02-connector-contract-baseline.md'
      - '.github/workflows/int02-connector-contract.yml'

permissions:
  contents: read

jobs:
  connector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-core --test int02_connector_contract_guard --locked -- --test-threads=1
