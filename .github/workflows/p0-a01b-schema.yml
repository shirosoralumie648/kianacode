name: P0-A-01b schema registry

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/tests/p0_a01b_schema.rs"
      - "kiana-core/tests/p0_a01b_schema_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/schema-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-a01b-schema.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/tests/p0_a01b_schema.rs"
      - "kiana-core/tests/p0_a01b_schema_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/schema-registry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p0-a01b-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P0-A-01b schema fixtures
        run: cargo test -p kiana-domain --test p0_a01b_schema --locked -- --test-threads=1
      - name: Run P0-A-01b source guard
        run: cargo test -p kiana-core --test p0_a01b_schema_guard --locked -- --test-threads=1
      - name: Compile schema registry path
        run: cargo check -p kiana-domain -p kiana-protocol -p kiana-core --tests --locked
