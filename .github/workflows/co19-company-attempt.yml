name: co19-company-attempt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_attempt.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co19_company_attempt.rs"
      - "kiana-core/tests/co19_company_attempt_guard.rs"
      - "docs/roadmap/co19-company-attempt-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co19-company-attempt.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_attempt.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/packet_graph.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co19_company_attempt.rs"
      - "kiana-core/tests/co19_company_attempt_guard.rs"
      - "docs/roadmap/co19-company-attempt-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co19-company-attempt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-19 attempt fixtures
        run: cargo test -p kiana-domain --test co19_company_attempt --locked -- --test-threads=1
      - name: Run CO-19 attempt source guard
        run: cargo test -p kiana-core --test co19_company_attempt_guard --locked -- --test-threads=1
      - name: Compile CO-19 Company targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
