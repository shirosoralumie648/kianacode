name: INT-33 connector closeout

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/tests/int33-connector-closeout-static.sh"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap/int33-connector-closeout.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int33-connector-closeout.yml"
  pull_request:
    paths:
      - "scripts/tests/int33-connector-closeout-static.sh"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap/int33-connector-closeout.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int33-connector-closeout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run INT-33 source closeout guard
        run: bash scripts/tests/int33-connector-closeout-static.sh
