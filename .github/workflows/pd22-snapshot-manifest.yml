name: pd22-snapshot-manifest

on:
  push:
    paths:
      - 'kiana-domain/src/snapshot_manifest.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd22_snapshot_manifest.rs'
      - 'kiana-daemon/tests/pd22_snapshot_manifest_guard.rs'
      - 'kiana-eventlog/tests/pd22_snapshot_manifest_guard.rs'
      - '.github/workflows/pd22-snapshot-manifest.yml'
  pull_request:
    paths:
      - 'kiana-domain/src/snapshot_manifest.rs'
      - 'kiana-domain/src/lib.rs'
      - 'kiana-domain/tests/pd22_snapshot_manifest.rs'
      - 'kiana-daemon/tests/pd22_snapshot_manifest_guard.rs'
      - 'kiana-eventlog/tests/pd22_snapshot_manifest_guard.rs'
      - '.github/workflows/pd22-snapshot-manifest.yml'

permissions:
  contents: read

jobs:
  snapshot-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test pd22_snapshot_manifest --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test pd22_snapshot_manifest_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-eventlog --test pd22_snapshot_manifest_guard --locked -- --test-threads=1
