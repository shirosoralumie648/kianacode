name: NM-18 notification recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-recovery:
    name: NM-18 cancellation, revocation, expiry and reconciliation fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run NM-18 recovery fixtures
        run: cargo test -p kiana-core --test nm18_notification_recovery --locked -- --test-threads=1
      - name: Run NM-18 source guard
        run: cargo test -p kiana-core --test nm18_notification_recovery_guard --locked -- --test-threads=1
      - name: Compile NM-18 recovery target
        run: cargo test -p kiana-core --test nm18_notification_recovery --no-run --locked
      - name: Compile NM-18 source guard target
        run: cargo test -p kiana-core --test nm18_notification_recovery_guard --no-run --locked
