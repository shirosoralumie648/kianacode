name: NM-18 notification recovery and reconciliation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_recovery.rs"
      - "kiana-core/tests/fixtures/nm18-notification-recovery.json"
      - "kiana-core/tests/nm18_notification_recovery.rs"
      - "kiana-core/tests/nm18_notification_recovery_guard.rs"
      - "docs/roadmap/nm18-notification-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm18-notification-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_recovery.rs"
      - "kiana-core/tests/fixtures/nm18-notification-recovery.json"
      - "kiana-core/tests/nm18_notification_recovery.rs"
      - "kiana-core/tests/nm18_notification_recovery_guard.rs"
      - "docs/roadmap/nm18-notification-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm18-notification-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run notification recovery fixtures
        run: cargo test -p kiana-core --test nm18_notification_recovery --locked -- --test-threads=1
      - name: Run notification recovery source guard
        run: cargo test -p kiana-core --test nm18_notification_recovery_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
