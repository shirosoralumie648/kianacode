name: SC-19 secret lease rotation and revocation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run OAuth metadata fixtures
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run SC-19 source guard
        run: cargo test -p kiana-core --test sc19_secret_rotation_guard --locked -- --test-threads=1
