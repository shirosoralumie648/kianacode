name: SC-19 secret lease rotation and revocation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-rotation:
    name: SC-19 rotation and revocation fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run OAuth metadata fixtures
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run SC-19 source guard
        run: cargo test -p kiana-core --test sc19_secret_rotation_guard --locked -- --test-threads=1
      - name: Compile OAuth metadata target
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --no-run --locked
      - name: Compile SC-19 guard target
        run: cargo test -p kiana-core --test sc19_secret_rotation_guard --no-run --locked
