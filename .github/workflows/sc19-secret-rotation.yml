name: SC-19 secret lease rotation and revocation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/resource_leases.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "kiana-core/tests/sc19_secret_rotation_guard.rs"
      - "docs/roadmap/sc19-secret-rotation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc19-secret-rotation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/tests/ci09_oauth_contracts.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/resource_leases.rs"
      - "kiana-core/tests/ci09_oauth_guard.rs"
      - "kiana-core/tests/sc19_secret_rotation_guard.rs"
      - "docs/roadmap/sc19-secret-rotation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc19-secret-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run OAuth metadata fixtures
        run: cargo test -p kiana-domain --test ci09_oauth_contracts --locked -- --test-threads=1
      - name: Run SC-19 source guard
        run: cargo test -p kiana-core --test sc19_secret_rotation_guard --locked -- --test-threads=1
      - name: Compile SC-19 targets
        run: cargo check --workspace --tests --locked
