name: H23 compaction commit diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compaction-commit:
    name: H23 artifact-first commit fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt -p kiana-domain -p kiana-core --check
      - name: Run domain compaction commit fixtures
        run: cargo test -p kiana-domain --test h23_compaction_commit --locked -- --test-threads=1
      - name: Run core compaction commit guard
        run: cargo test -p kiana-core --test h23_compaction_commit_guard --locked -- --test-threads=1
      - name: Run named H23 behavior fixtures
        run: |
          for fixture in \
            crash_before_compaction_commit_keeps_old_context \
            stale_summary_cannot_overwrite_new_steering \
            revoked_source_invalidates_summary \
            native_opaque_compaction_requires_provider_capability_and_recompiles_on_model_switch \
            compacted_context_rebuilds_to_same_view_after_restart; do
            cargo test -p kiana-domain --test h23_compaction_commit "$fixture" --locked -- --exact --test-threads=1 || exit 1
          done
      - name: Compile domain compaction commit target
        run: cargo test -p kiana-domain --test h23_compaction_commit --no-run --locked
      - name: Compile core compaction commit guard target
        run: cargo test -p kiana-core --test h23_compaction_commit_guard --no-run --locked
