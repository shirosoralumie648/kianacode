name: "EQ-36 dimension aggregation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq36-aggregation:
    name: "EQ-36 dimension aggregation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq36_aggregation
        run: cargo test -p kiana-quality --test eq36_aggregation --locked -- --test-threads=1
      - name: Run kiana-quality eq36_aggregation_guard
        run: cargo test -p kiana-quality --test eq36_aggregation_guard --locked -- --test-threads=1
