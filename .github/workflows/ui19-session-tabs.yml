name: "UI-19 Web session ownership and multi-tab concurrency"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui19-session-tabs:
    name: "UI-19 Web session ownership and multi-tab concurrency"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The runtime fixtures drive a real DaemonHost/Web router with two tabs over loopback; the
      # project convention for daemon/entrypoint tests is a 32 MiB test-thread stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the multi-tab fixture, catalogue and typed-projection binding
        run: cargo test -p kiana-entrypoints --test ui19_session_tabs --locked -- --test-threads=1
      - name: Run the deny-first ownership and payload-binding guard
        run: cargo test -p kiana-entrypoints --test ui19_session_tabs_guard --locked -- --test-threads=1
      - name: Run the live loopback owner/observer/replay/rotation fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui19_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
