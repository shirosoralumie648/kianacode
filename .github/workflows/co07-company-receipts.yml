name: CO-07 company receipts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_receipts.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co07_receipt.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/authority.rs"
      - "kiana-core/tests/co07_receipt_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-receipts-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co07-company-receipts.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_receipts.rs"
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co07_receipt.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/authority.rs"
      - "kiana-core/tests/co07_receipt_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-receipts-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co07-company-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-07 receipt fixtures
        run: cargo test -p kiana-domain --test co07_receipt --locked -- --test-threads=1
      - name: Run CO-07 source guard
        run: cargo test -p kiana-core --test co07_receipt_guard --locked -- --test-threads=1
      - name: Compile Company receipt path
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-core -p kiana-daemon --tests --locked
