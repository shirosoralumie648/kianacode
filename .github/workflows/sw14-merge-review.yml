name: SW-14 swarm merge review

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_merge_review.rs"
      - "kiana-domain/src/swarm_merge_reducer.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_merge_review.rs"
      - "kiana-core/src/swarm_merge_review.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw14_merge_review_guard.rs"
      - "docs/roadmap/sw14-merge-review-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw14-merge-review.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_merge_review.rs"
      - "kiana-domain/src/swarm_merge_reducer.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_merge_review.rs"
      - "kiana-core/src/swarm_merge_review.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw14_merge_review_guard.rs"
      - "docs/roadmap/sw14-merge-review-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw14-merge-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-merge-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-14 domain fixtures
        run: cargo test -p kiana-domain --test swarm_merge_review --locked -- --test-threads=1
      - name: Run SW-14 Core source guard
        run: cargo test -p kiana-core --test sw14_merge_review_guard --locked -- --test-threads=1
      - name: Compile SW-14 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
