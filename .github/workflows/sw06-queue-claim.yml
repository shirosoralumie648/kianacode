name: SW-06 queue claim and fencing

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_queue.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_queue.rs"
      - "kiana-core/src/swarm_queue.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_queue_guard.rs"
      - "docs/roadmap/sw06-queue-claim-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw06-queue-claim.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_queue.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_queue.rs"
      - "kiana-core/src/swarm_queue.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_queue_guard.rs"
      - "docs/roadmap/sw06-queue-claim-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw06-queue-claim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-06 domain queue fixtures
        run: cargo test -p kiana-domain --test swarm_queue --locked -- --test-threads=1
      - name: Run SW-06 Core source guard
        run: cargo test -p kiana-core --test swarm_queue_guard --locked -- --test-threads=1
      - name: Compile SW-06 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
