name: cm26-memory-distillation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cm26_memory_distillation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/src/memory_proposals.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/tests/cm26_memory_distillation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm26-memory-distillation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm26-memory-distillation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cm26_memory_distillation.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/src/memory_proposals.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-core/tests/cm26_memory_distillation_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm26-memory-distillation-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm26-memory-distillation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-distillation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-26 domain fixtures
        run: cargo test -p kiana-domain --test cm26_memory_distillation --locked -- --test-threads=1
      - name: Run CM-26 source guard
        run: cargo test -p kiana-core --test cm26_memory_distillation_guard --locked -- --test-threads=1
