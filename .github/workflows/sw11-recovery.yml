name: SW-11 replay and re-admission

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_recovery.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_recovery.rs"
      - "kiana-core/src/swarm_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_recovery_guard.rs"
      - "docs/roadmap/sw11-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw11-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_recovery.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_recovery.rs"
      - "kiana-core/src/swarm_recovery.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/swarm_recovery_guard.rs"
      - "docs/roadmap/sw11-recovery-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw11-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-11 domain recovery fixtures
        run: cargo test -p kiana-domain --test swarm_recovery --locked -- --test-threads=1
      - name: Run SW-11 Core source guard
        run: cargo test -p kiana-core --test swarm_recovery_guard --locked -- --test-threads=1
      - name: Compile SW-11 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
