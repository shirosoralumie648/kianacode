name: SW-18 swarm release gate

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_release_gate.rs"
      - "kiana-domain/src/swarm_projection.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_release_gate.rs"
      - "kiana-core/src/swarm_release_gate.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw18_release_gate_guard.rs"
      - "docs/roadmap/sw18-release-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw18-release-gate.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_release_gate.rs"
      - "kiana-domain/src/swarm_projection.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_release_gate.rs"
      - "kiana-core/src/swarm_release_gate.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw18_release_gate_guard.rs"
      - "docs/roadmap/sw18-release-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw18-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-18 domain fixtures
        run: cargo test -p kiana-domain --test swarm_release_gate --locked -- --test-threads=1
      - name: Run SW-18 Core source guard
        run: cargo test -p kiana-core --test sw18_release_gate_guard --locked -- --test-threads=1
      - name: Compile SW-18 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
