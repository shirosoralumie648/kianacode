name: "EQ-31 recovery and replay evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq31-recovery-replay:
    name: "EQ-31 recovery and replay evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq31_recovery
        run: cargo test -p kiana-quality --test eq31_recovery --locked -- --test-threads=1
      - name: Run kiana-quality eq31_recovery_guard
        run: cargo test -p kiana-quality --test eq31_recovery_guard --locked -- --test-threads=1
