name: "UI-38 协议/入口 conformance 集成门基线"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui38-conformance:
    name: "UI-38 协议/入口 conformance 集成门基线"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui38_conformance
        run: cargo test -p kiana-client --test ui38_conformance --locked -- --test-threads=1
