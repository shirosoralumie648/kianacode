name: BQ-20 ledger projector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-projector:
    name: BQ-20 cursor fence, quarantine, rollup and rebuild fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-20 domain fixtures
        run: cargo test -p kiana-domain --test bq20_ledger_projection --locked -- --test-threads=1
      - name: Run BQ-20 core fence fixtures and source guard
        run: cargo test -p kiana-core --test bq20_ledger_projector_guard --locked -- --test-threads=1
      - name: Run BQ-20 EventLog source fixtures
        run: cargo test -p kiana-eventlog --test bq20_ledger_source --locked -- --test-threads=1
      - name: Run BQ-20 query projection fixtures
        run: cargo test -p kiana-query --test bq20_ledger_projector --locked -- --test-threads=1
      - name: Run BQ-20 query source guard
        run: cargo test -p kiana-query --test bq20_ledger_projector_guard --locked -- --test-threads=1
      - name: Compile BQ-20 domain target
        run: cargo test -p kiana-domain --test bq20_ledger_projection --no-run --locked
      - name: Compile BQ-20 core target
        run: cargo test -p kiana-core --test bq20_ledger_projector_guard --no-run --locked
      - name: Compile BQ-20 EventLog target
        run: cargo test -p kiana-eventlog --test bq20_ledger_source --no-run --locked
      - name: Compile BQ-20 query projection target
        run: cargo test -p kiana-query --test bq20_ledger_projector --no-run --locked
      - name: Compile BQ-20 query guard target
        run: cargo test -p kiana-query --test bq20_ledger_projector_guard --no-run --locked
