name: P4-J3-05 terminal memory distillation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/tests/p4_j3_05_distillation.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/src/memory_proposals.rs"
      - "kiana-core/tests/p4_j3_05_distillation.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-domain/tests/p1_j3_03_memory_proposal.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p4-j3-05-distillation-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j3-05-distillation.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/tests/p4_j3_05_distillation.rs"
      - "kiana-core/src/events.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/src/memory_distillation.rs"
      - "kiana-core/src/memory_proposals.rs"
      - "kiana-core/tests/p4_j3_05_distillation.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-domain/tests/p1_j3_03_memory_proposal.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p4-j3-05-distillation-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j3-05-distillation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distillation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run the lesson candidate fixture
        run: cargo test -p kiana-domain --test p4_j3_05_distillation --locked -- --test-threads=1
      - name: Run distillation source guard
        run: cargo test -p kiana-core --test p4_j3_05_distillation --locked -- --test-threads=1
      - name: Run memory proposal regression
        run: cargo test -p kiana-domain --test p1_j3_03_memory_proposal --locked -- --test-threads=1
      - name: Compile P4-J3-05 targets
        run: cargo check --workspace --tests --locked
