name: PD-15 workspace artifact checkpoint

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-core/tests/pd15_workspace_artifact_guard.rs"
      - "docs/roadmap/pd15-workspace-artifact-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd15-workspace-artifact.yml"
  pull_request:
    paths:
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/src/artifacts.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-core/tests/pd15_workspace_artifact_guard.rs"
      - "docs/roadmap/pd15-workspace-artifact-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd15-workspace-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run workspace artifact source guard
        run: cargo test -p kiana-core --test pd15_workspace_artifact_guard --locked -- --test-threads=1
      - name: Compile PD-15 targets
        run: cargo check --workspace --tests --locked
