name: co35-closing-receipt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/closing_receipt.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co35_closing_receipt.rs"
      - "kiana-core/src/closing_receipt.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co35_closing_receipt_guard.rs"
      - "docs/roadmap/co35-closing-receipt-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co35-closing-receipt.yml"
  pull_request:
    paths:
      - "kiana-domain/src/closing_receipt.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co35_closing_receipt.rs"
      - "kiana-core/src/closing_receipt.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co35_closing_receipt_guard.rs"
      - "docs/roadmap/co35-closing-receipt-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co35-closing-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closing-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-35 close-kind fixtures
        run: cargo test -p kiana-domain --test co35_closing_receipt --locked -- --test-threads=1
      - name: Run CO-35 closing source guard
        run: cargo test -p kiana-core --test co35_closing_receipt_guard --locked -- --test-threads=1
      - name: Compile CO-35 closing targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
