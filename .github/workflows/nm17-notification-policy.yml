name: NM-17 notification policy and escalation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_policy.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_policy.rs"
      - "kiana-core/tests/fixtures/nm17-notification-policy.json"
      - "kiana-core/tests/nm17_notification_policy.rs"
      - "kiana-core/tests/nm17_notification_policy_guard.rs"
      - "docs/roadmap/nm17-notification-policy-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm17-notification-policy.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_policy.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_policy.rs"
      - "kiana-core/tests/fixtures/nm17-notification-policy.json"
      - "kiana-core/tests/nm17_notification_policy.rs"
      - "kiana-core/tests/nm17_notification_policy_guard.rs"
      - "docs/roadmap/nm17-notification-policy-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm17-notification-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run notification policy fixtures
        run: cargo test -p kiana-core --test nm17_notification_policy --locked -- --test-threads=1
      - name: Run notification policy source guard
        run: cargo test -p kiana-core --test nm17_notification_policy_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
