name: EXT-04 deterministic extension catalog

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/extension_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext04_catalog.rs"
      - "kiana-skills/src/catalog.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/tests/ext04_catalog.rs"
      - "docs/roadmap/catalog-baseline.md"
      - ".github/workflows/ext04-catalog.yml"
  pull_request:
    paths:
      - "kiana-domain/src/extension_catalog.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ext04_catalog.rs"
      - "kiana-skills/src/catalog.rs"
      - "kiana-skills/src/lib.rs"
      - "kiana-skills/tests/ext04_catalog.rs"
      - "docs/roadmap/catalog-baseline.md"
      - ".github/workflows/ext04-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-04 domain catalog fixtures
        run: cargo test -p kiana-domain --test ext04_catalog --locked -- --test-threads=1
      - name: Run EXT-04 skills catalog fixtures
        run: cargo test -p kiana-skills --test ext04_catalog --locked -- --test-threads=1
