name: "UI-33 reconnect/replay/gap/crash recovery 基线"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui33-recovery-contract:
    name: "UI-33 reconnect/replay/gap/crash recovery 基线"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-client ui33_recovery
        run: cargo test -p kiana-client --test ui33_recovery --locked -- --test-threads=1
