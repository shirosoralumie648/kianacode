name: P3-I-06 Company fake-model golden loop

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/company_closeout.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_business.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-daemon/tests/p3_i06_company_golden.rs"
      - "kiana-core/tests/p3_i06_company_golden.rs"
      - "kiana-core/tests/p3_i05_closeout_outcome.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i06-company-golden-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i06-company-golden.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/company_closeout.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/src/company_business.rs"
      - "kiana-core/src/collaboration.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/model_client.rs"
      - "kiana-daemon/tests/p3_i06_company_golden.rs"
      - "kiana-core/tests/p3_i06_company_golden.rs"
      - "kiana-core/tests/p3_i05_closeout_outcome.rs"
      - "kiana-core/tests/oa27_company_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i06-company-golden-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i06-company-golden.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run the fake-model Company golden loop
        run: cargo test -p kiana-daemon --test p3_i06_company_golden --locked -- --test-threads=1
      - name: Run the Company golden-loop source guard
        run: cargo test -p kiana-core --test p3_i06_company_golden --locked -- --test-threads=1
      - name: Run closeout and governance regressions
        run: |
          cargo test -p kiana-core --test p3_i05_closeout_outcome --locked -- --test-threads=1
          cargo test -p kiana-core --test oa27_company_governance --locked -- --test-threads=1
      - name: Compile P3-I-06 targets
        run: cargo check --workspace --tests --locked
