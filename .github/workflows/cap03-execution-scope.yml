name: CAP-03 immutable execution scope

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/execution_scope.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-core/src/invocation_projection.rs"
      - "kiana-domain/tests/cap03_execution_scope.rs"
      - "kiana-core/tests/cap03_execution_scope_guard.rs"
      - "docs/roadmap/capability-execution-scope-baseline.md"
      - ".github/workflows/cap03-execution-scope.yml"
  pull_request:
    paths:
      - "kiana-domain/src/execution_scope.rs"
      - "kiana-domain/src/capabilities.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-core/src/invocation_projection.rs"
      - "kiana-domain/tests/cap03_execution_scope.rs"
      - "kiana-core/tests/cap03_execution_scope_guard.rs"
      - "docs/roadmap/capability-execution-scope-baseline.md"
      - ".github/workflows/cap03-execution-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CAP-03 scope fixtures
        run: cargo test -p kiana-domain --test cap03_execution_scope --locked -- --test-threads=1
      - name: Run CAP-03 source guard
        run: cargo test -p kiana-core --test cap03_execution_scope_guard --locked -- --test-threads=1
