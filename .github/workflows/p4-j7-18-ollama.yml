name: p4-j7-18-ollama

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ollama-ndjson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run P4-J7-18 Ollama response fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run Ollama profile timeout fixtures
        run: cargo test -p kiana-provider --test p4_j7_08_config --locked -- --test-threads=1
      - name: Run P4-J7-18 source guard
        run: cargo test -p kiana-core --test p4_j7_18_ollama_guard --locked -- --test-threads=1
