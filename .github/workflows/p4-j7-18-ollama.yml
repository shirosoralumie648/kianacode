name: p4-j7-18-ollama

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/p4_j7_08_config.rs"
      - "kiana-core/tests/p4_j7_18_ollama_guard.rs"
      - "kiana-runner/src/harness.rs"
      - "docs/roadmap/p4-j7-18-ollama-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-18-ollama.yml"
  pull_request:
    paths:
      - "kiana-domain/src/model.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/request.rs"
      - "kiana-provider/src/response.rs"
      - "kiana-provider/tests/p4_j7_08_config.rs"
      - "kiana-core/tests/p4_j7_18_ollama_guard.rs"
      - "kiana-runner/src/harness.rs"
      - "docs/roadmap/p4-j7-18-ollama-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-18-ollama.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ollama-ndjson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-18 Ollama response fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run Ollama profile timeout fixtures
        run: cargo test -p kiana-provider --test p4_j7_08_config --locked -- --test-threads=1
      - name: Run P4-J7-18 source guard
        run: cargo test -p kiana-core --test p4_j7_18_ollama_guard --locked -- --test-threads=1
