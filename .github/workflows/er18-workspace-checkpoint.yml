name: ER-18 workspace checkpoint transaction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-checkpoint:
    name: ER-18 checkpoint and restore fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run checkpoint fixture
        run: cargo test -p kiana-core --test p2_k4_01_checkpoint --locked -- --test-threads=1
      - name: Run CP-18 snapshot guard
        run: cargo test -p kiana-core --test cp18_run_snapshot_guard --locked -- --test-threads=1
      - name: Run ER-18 source guard
        run: cargo test -p kiana-core --test er18_workspace_checkpoint_guard --locked -- --test-threads=1
      - name: Compile ER-18 checkpoint target
        run: cargo test -p kiana-core --test p2_k4_01_checkpoint --no-run --locked
      - run: cargo test -p kiana-core --test cp18_run_snapshot_guard --no-run --locked
      - name: Compile ER-18 source guard target
        run: cargo test -p kiana-core --test er18_workspace_checkpoint_guard --no-run --locked
