name: CI-07 secret store and credential lease

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-capability-broker/tests/ci07_credential_lease.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/ci07_secret_store.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "docs/roadmap/ci07-secret-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci07-secret-store.yml"
  pull_request:
    paths:
      - "kiana-domain/src/credentials.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/ci07_credential_lease.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-capability-broker/src/lib.rs"
      - "kiana-capability-broker/tests/ci07_credential_lease.rs"
      - "kiana-provider/src/credentials.rs"
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-provider/tests/ci07_secret_store.rs"
      - "kiana-core/tests/ci07_secret_store.rs"
      - "docs/roadmap/ci07-secret-store-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ci07-secret-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain lease fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run provider store fixtures
        run: cargo test -p kiana-provider --lib credentials::tests --locked -- --test-threads=1
      - name: Run provider projection fixtures
        run: cargo test -p kiana-provider --test ci07_secret_store --locked -- --test-threads=1
      - name: Run broker lease fixtures
        run: cargo test -p kiana-capability-broker --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run credential boundary source guard
        run: cargo test -p kiana-core --test ci07_secret_store --locked -- --test-threads=1
      - name: Compile CI-07 targets
        run: cargo check --workspace --tests --locked
