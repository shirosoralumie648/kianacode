name: CI-07 secret store and credential lease

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-boundary:
    name: CI-07 focused credential boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run domain lease fixtures
        run: cargo test -p kiana-domain --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run provider SecretStore unit fixtures
        run: cargo test -p kiana-provider --lib credentials::tests --locked -- --test-threads=1
      - name: Run provider projection fixtures
        run: cargo test -p kiana-provider --test ci07_secret_store --locked -- --test-threads=1
      - name: Run Broker lease fixtures
        run: cargo test -p kiana-capability-broker --test ci07_credential_lease --locked -- --test-threads=1
      - name: Run connector credential binding regression
        run: cargo test -p kiana-domain --test int06_connector_credential --locked -- --test-threads=1
      - name: Run connector port lease regression
        run: cargo test -p kiana-ports --test int07_connector_ports --test int11_https_connector --locked -- --test-threads=1
      - name: Run core credential boundary guard
        run: cargo test -p kiana-core --test ci07_secret_store --locked -- --test-threads=1
      - name: Compile domain lease target
        run: cargo test -p kiana-domain --test ci07_credential_lease --no-run --locked
      - name: Compile provider projection target
        run: cargo test -p kiana-provider --test ci07_secret_store --no-run --locked
      - name: Compile Broker lease target
        run: cargo test -p kiana-capability-broker --test ci07_credential_lease --no-run --locked
      - name: Compile core credential guard target
        run: cargo test -p kiana-core --test ci07_secret_store --no-run --locked
