name: oa13-observability-queue

on:
  push:
    paths:
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/src/observability_queue.rs"
      - "kiana-ports/tests/oa13_observability_queue.rs"
      - "kiana-daemon/src/lib.rs"
      - ".github/workflows/oa13-observability-queue.yml"
  pull_request:
    paths:
      - "kiana-ports/src/lib.rs"
      - "kiana-ports/src/observability_queue.rs"
      - "kiana-ports/tests/oa13_observability_queue.rs"
      - "kiana-daemon/src/lib.rs"
      - ".github/workflows/oa13-observability-queue.yml"

permissions:
  contents: read

jobs:
  oa13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oa13-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fetch --locked
      - name: Run OA-13 remote-only fixtures
        run: cargo test -p kiana-ports --test oa13_observability_queue --locked -- --test-threads=1
