name: CO-06 artifact evidence and Company integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-evidence:
    name: CO-06 scoped artifact and evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check source formatting
        run: cargo fmt --all --check
      - name: Run CO-06 domain artifact fixtures
        run: cargo test -p kiana-domain --test co06_artifact --locked -- --test-threads=1
      - name: Run CO-06 artifact content port fixtures
        run: cargo test -p kiana-ports --test co06_artifact_port --locked -- --test-threads=1
      - name: Run CO-06 core artifact boundary guard
        run: cargo test -p kiana-core --test co06_artifact_guard --locked -- --test-threads=1
      - name: Run CO-06 core Company wiring guard
        run: cargo test -p kiana-core --test co06_company_artifact_wiring_guard --locked -- --test-threads=1
      - name: Run CO-06 local artifact store fixtures
        run: cargo test -p kiana-daemon --test co06_local_artifact_store --locked -- --test-threads=1
      - name: Run CO-06 Company historical artifact fixture
        run: cargo test -p kiana-daemon --test co06_company_artifact_history --locked -- --test-threads=1
      - name: Compile CO-06 domain target
        run: cargo test -p kiana-domain --test co06_artifact --no-run --locked
      - name: Compile CO-06 ports target
        run: cargo test -p kiana-ports --test co06_artifact_port --no-run --locked
      - name: Compile CO-06 Core guard targets
        run: |
          cargo test -p kiana-core --test co06_artifact_guard --no-run --locked
          cargo test -p kiana-core --test co06_company_artifact_wiring_guard --no-run --locked
      - name: Compile CO-06 daemon targets
        run: |
          cargo test -p kiana-daemon --test co06_local_artifact_store --no-run --locked
          cargo test -p kiana-daemon --test co06_company_artifact_history --no-run --locked
