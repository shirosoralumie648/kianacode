name: co30-change-contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/change_contract.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co30_change_contract.rs"
      - "kiana-core/src/change_contract.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co30_change_contract_guard.rs"
      - "docs/roadmap/co30-change-contract-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co30-change-contract.yml"
  pull_request:
    paths:
      - "kiana-domain/src/change_contract.rs"
      - "kiana-domain/src/company_business.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co30_change_contract.rs"
      - "kiana-core/src/change_contract.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co30_change_contract_guard.rs"
      - "docs/roadmap/co30-change-contract-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co30-change-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-30 change fixtures
        run: cargo test -p kiana-domain --test co30_change_contract --locked -- --test-threads=1
      - name: Run CO-30 change source guard
        run: cargo test -p kiana-core --test co30_change_contract_guard --locked -- --test-threads=1
      - name: Compile CO-30 change targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
