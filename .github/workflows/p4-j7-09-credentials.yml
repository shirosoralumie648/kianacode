name: P4-J7-09 provider credentials and endpoints

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/tests/p4_j7_09_credentials.rs"
      - "kiana-core/tests/p4_j7_09_credentials_guard.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap/provider-credentials-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-09-credentials.yml"
  pull_request:
    paths:
      - "kiana-provider/src/config.rs"
      - "kiana-provider/src/transport.rs"
      - "kiana-provider/tests/p4_j7_09_credentials.rs"
      - "kiana-core/tests/p4_j7_09_credentials_guard.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap/provider-credentials-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-09-credentials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P4-J7-09 credential fixtures
        run: cargo test -p kiana-provider --test p4_j7_09_credentials --locked -- --test-threads=1
      - name: Run P4-J7-09 source guard
        run: cargo test -p kiana-core --test p4_j7_09_credentials_guard --locked -- --test-threads=1
      - name: Compile provider endpoint path
        run: cargo check -p kiana-provider -p kiana-daemon -p kiana-core --tests --locked
