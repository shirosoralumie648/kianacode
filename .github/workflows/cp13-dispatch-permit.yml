name: CP-13 execution permit and dispatch barrier

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/dispatch.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cp13_dispatch_permit.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/cp13_dispatch_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "docs/roadmap/control-plane-dispatch-permit-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp13-dispatch-permit.yml"
  pull_request:
    paths:
      - "kiana-domain/src/dispatch.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/cp13_dispatch_permit.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/cp13_dispatch_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "docs/roadmap/control-plane-dispatch-permit-baseline.md"
      - "docs/roadmap/control-plane.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp13-dispatch-permit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-permit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CP-13 permit fixtures
        run: cargo test -p kiana-domain --test cp13_dispatch_permit --locked -- --test-threads=1
      - name: Run CP-13 source guard
        run: cargo test -p kiana-core --test cp13_dispatch_guard --locked -- --test-threads=1
      - name: Compile CP-13 targets
        run: cargo check --workspace --tests --locked
