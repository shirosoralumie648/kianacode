name: CP-13 execution permit and dispatch barrier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-permit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CP-13 permit fixtures
        run: cargo test -p kiana-domain --test cp13_dispatch_permit --locked -- --test-threads=1
      - name: Run CP-13 source guard
        run: cargo test -p kiana-core --test cp13_dispatch_guard --locked -- --test-threads=1
      - name: Compile CP-13 targets
        run: cargo check --workspace --tests --locked
