name: PD-02 storage schema and upcast

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/storage_schema.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/pd02_schema.rs"
      - "kiana-core/tests/pd02_schema_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/persistence-schema-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd02-schema.yml"
  pull_request:
    paths:
      - "kiana-domain/src/storage_schema.rs"
      - "kiana-domain/src/memory.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/pd02_schema.rs"
      - "kiana-core/tests/pd02_schema_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/persistence-schema-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd02-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run PD-02 schema fixtures
        run: cargo test -p kiana-domain --test pd02_schema --locked -- --test-threads=1
      - name: Run PD-02 source guard
        run: cargo test -p kiana-core --test pd02_schema_guard --locked -- --test-threads=1
      - name: Compile storage schema path
        run: cargo check -p kiana-domain -p kiana-protocol -p kiana-core --tests --locked
