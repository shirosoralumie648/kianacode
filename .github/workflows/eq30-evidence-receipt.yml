name: "EQ-30 evidence and receipt evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq30-evidence-receipt:
    name: "EQ-30 evidence and receipt evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq30_evidence
        run: cargo test -p kiana-quality --test eq30_evidence --locked -- --test-threads=1
      - name: Run kiana-quality eq30_evidence_guard
        run: cargo test -p kiana-quality --test eq30_evidence_guard --locked -- --test-threads=1
