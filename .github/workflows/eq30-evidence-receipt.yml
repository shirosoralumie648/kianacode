name: EQ-30 evidence receipt evaluator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-evidence-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq30-evidence-receipt.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-evidence-receipt-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq30-evidence-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-30 evidence fixtures
        run: cargo test -p kiana-quality --test eq30_evidence --locked -- --test-threads=1
      - name: Run EQ-30 source guard
        run: cargo test -p kiana-quality --test eq30_evidence_guard --locked -- --test-threads=1
      - name: Compile EQ-30 targets
        run: cargo check --workspace --tests --locked
