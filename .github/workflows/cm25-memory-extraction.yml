name: cm25-memory-extraction

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/memory_extraction.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm25_memory_extraction.rs"
      - "kiana-core/tests/cm25_memory_extraction_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm25-memory-extraction-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm25-memory-extraction.yml"
  pull_request:
    paths:
      - "kiana-domain/src/memory_extraction.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm25_memory_extraction.rs"
      - "kiana-core/tests/cm25_memory_extraction_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm25-memory-extraction-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm25-memory-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-25 extraction fixtures
        run: cargo test -p kiana-domain --test cm25_memory_extraction --locked -- --test-threads=1
      - name: Run CM-25 source guard
        run: cargo test -p kiana-core --test cm25_memory_extraction_guard --locked -- --test-threads=1
