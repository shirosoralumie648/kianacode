name: EQ-07 quality ports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run EQ-07 quality port fixture
        run: cargo test -p kiana-ports --test eq07_quality_ports --locked -- --test-threads=1
      - name: Run EQ-07 source guard
        run: cargo test -p kiana-core --test eq07_quality_ports_guard --locked -- --test-threads=1
      - name: Compile EQ-07 ports target
        run: cargo test -p kiana-ports --test eq07_quality_ports --no-run --locked
      - name: Compile EQ-07 Core guard target
        run: cargo test -p kiana-core --test eq07_quality_ports_guard --no-run --locked
