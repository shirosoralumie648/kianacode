name: PD-34 persistence capacity budgets

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/persistence_capacity.rs"
      - "kiana-domain/src/persistence_capacity_evidence.rs"
      - "kiana-domain/tests/pd34_persistence_capacity_evidence.rs"
      - "kiana-domain/src/performance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/pd34_persistence_capacity.rs"
      - "kiana-core/tests/pd34_persistence_capacity_guard.rs"
      - "kiana-core/tests/oa25_capacity_migration.rs"
      - "docs/roadmap/pd34-persistence-capacity-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd34-persistence-capacity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/persistence_capacity.rs"
      - "kiana-domain/src/persistence_capacity_evidence.rs"
      - "kiana-domain/tests/pd34_persistence_capacity_evidence.rs"
      - "kiana-domain/src/performance.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/pd34_persistence_capacity.rs"
      - "kiana-core/tests/pd34_persistence_capacity_guard.rs"
      - "kiana-core/tests/oa25_capacity_migration.rs"
      - "docs/roadmap/pd34-persistence-capacity-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/pd34-persistence-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run PD-34 capacity fixture
        run: cargo test -p kiana-domain --test pd34_persistence_capacity --locked -- --test-threads=1
      - name: Run PD-34 capacity evidence fixture
        run: cargo test -p kiana-domain --test pd34_persistence_capacity_evidence --locked -- --test-threads=1
      - name: Run PD-34 source guard
        run: cargo test -p kiana-core --test pd34_persistence_capacity_guard --locked -- --test-threads=1
      - name: Run existing performance baseline fixture
        run: cargo test -p kiana-core --test oa25_capacity_migration --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
