name: DEP-09 supervisor port

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/supervisor.rs"
      - "kiana-domain/src/process_supervisor.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep09_supervisor.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/deployment_supervisor.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep09_supervisor_guard.rs"
      - "kiana-daemon/src/supervisor_adapters.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep09_supervisor_adapter_guard.rs"
      - "docs/roadmap/dep09-supervisor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep09-supervisor.yml"
  pull_request:
    paths:
      - "kiana-domain/src/supervisor.rs"
      - "kiana-domain/src/process_supervisor.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep09_supervisor.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/deployment_supervisor.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep09_supervisor_guard.rs"
      - "kiana-daemon/src/supervisor_adapters.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep09_supervisor_adapter_guard.rs"
      - "docs/roadmap/dep09-supervisor-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep09-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-09 domain fixtures
        run: cargo test -p kiana-domain --test dep09_supervisor --locked -- --test-threads=1
      - name: Run DEP-09 Core guard
        run: cargo test -p kiana-core --test dep09_supervisor_guard --locked -- --test-threads=1
      - name: Run DEP-09 daemon guard
        run: cargo test -p kiana-daemon --test dep09_supervisor_adapter_guard --locked -- --test-threads=1
      - name: Compile DEP-09 targets
        run: cargo check -p kiana-domain -p kiana-ports -p kiana-core -p kiana-daemon --tests --locked
