name: co39-company-inbox

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_inbox.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/tests/co39_company_inbox.rs"
      - "kiana-core/src/company_inbox.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co39_company_inbox_guard.rs"
      - "docs/roadmap/co39-company-inbox-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co39-company-inbox.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_inbox.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/tests/co39_company_inbox.rs"
      - "kiana-core/src/company_inbox.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co39_company_inbox_guard.rs"
      - "docs/roadmap/co39-company-inbox-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co39-company-inbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-39 Human Inbox fixtures
        run: cargo test -p kiana-domain --test co39_company_inbox --locked -- --test-threads=1
      - name: Run CO-39 HumanTask boundary guard
        run: cargo test -p kiana-core --test co39_company_inbox_guard --locked -- --test-threads=1
      - name: Compile CO-39 inbox targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
