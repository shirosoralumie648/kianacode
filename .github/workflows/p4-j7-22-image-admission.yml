name: p4-j7-22-image-admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run P4-J7-22 domain image admission fixtures
        run: cargo test -p kiana-domain --test p4_j7_22_image_admission --locked -- --test-threads=1
      - name: Run P4-J7-22 provider image fixtures
        run: cargo test -p kiana-provider --lib --locked -- --test-threads=1
      - name: Run P4-J7-22 source guard
        run: cargo test -p kiana-core --test p4_j7_22_image_admission_guard --locked -- --test-threads=1
