name: cm33-code-graph

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/code_graph.rs"
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm33_code_graph.rs"
      - "kiana-query/src/repo_map.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm33_code_graph_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm33-code-graph-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm33-code-graph.yml"
  pull_request:
    paths:
      - "kiana-domain/src/code_graph.rs"
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/cm33_code_graph.rs"
      - "kiana-query/src/repo_map.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-core/tests/cm33_code_graph_guard.rs"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap/cm33-code-graph-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm33-code-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CM-33 graph fixtures
        run: cargo test -p kiana-domain --test cm33_code_graph --locked -- --test-threads=1
      - name: Run CM-33 source guard
        run: cargo test -p kiana-core --test cm33_code_graph_guard --locked -- --test-threads=1
