name: P0-A-01a ID contract registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  id-contracts:
    name: P0-A-01a ID contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      RUST_MIN_STACK: "33554432"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: symbols
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ID registry unit contracts
        run: cargo test -p kiana-domain --lib contracts::tests --locked -- --test-threads=1
      - name: Compile ID registry unit contracts
        run: cargo test -p kiana-domain --lib contracts::tests --no-run --locked
