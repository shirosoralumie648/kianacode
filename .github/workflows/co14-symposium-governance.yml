name: co14-symposium-governance

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/symposium_governance.rs"
      - "kiana-domain/src/symposiums.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co14_symposium_governance.rs"
      - "kiana-core/tests/co14_symposium_governance_guard.rs"
      - "docs/roadmap/co14-symposium-governance-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co14-symposium-governance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/symposium_governance.rs"
      - "kiana-domain/src/symposiums.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co14_symposium_governance.rs"
      - "kiana-core/tests/co14_symposium_governance_guard.rs"
      - "docs/roadmap/co14-symposium-governance-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co14-symposium-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symposium-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-14 symposium governance fixtures
        run: cargo test -p kiana-domain --test co14_symposium_governance --locked -- --test-threads=1
      - name: Run CO-14 symposium source guard
        run: cargo test -p kiana-core --test co14_symposium_governance_guard --locked -- --test-threads=1
      - name: Compile CO-14 symposium targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
