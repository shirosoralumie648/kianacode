name: "CO-14 symposium, blackboard and decision governance baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co14-symposium-governance:
    name: "CO-14 symposium, blackboard and decision governance baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co14_symposium_governance_guard
        run: cargo test -p kiana-core --test co14_symposium_governance_guard --locked -- --test-threads=1
      - name: Run kiana-domain co14_symposium_governance
        run: cargo test -p kiana-domain --test co14_symposium_governance --locked -- --test-threads=1
