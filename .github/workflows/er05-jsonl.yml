name: ER-05 JSONL v2 journal boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonl-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ER-05 JSONL v2 fixtures
        run: cargo test -p kiana-eventlog --test er05_jsonl_v2 --locked -- --test-threads=1
      - name: Compile ER-05 targets
        run: cargo check --workspace --tests --locked
