name: ER-05 JSONL v2 journal boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/tests/er05_jsonl_v2.rs"
      - "kiana-eventlog/JOURNAL.md"
      - "docs/roadmap/event-receipt-jsonl-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er05-jsonl.yml"
  pull_request:
    paths:
      - "kiana-domain/src/journal.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/tests/er05_jsonl_v2.rs"
      - "kiana-eventlog/JOURNAL.md"
      - "docs/roadmap/event-receipt-jsonl-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er05-jsonl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonl-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-05 JSONL v2 fixtures
        run: cargo test -p kiana-eventlog --test er05_jsonl_v2 --locked -- --test-threads=1
      - name: Compile ER-05 targets
        run: cargo check --workspace --tests --locked
