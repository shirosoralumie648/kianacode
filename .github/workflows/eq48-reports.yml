name: eq48-reports

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/quality_report.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_report.rs"
      - "kiana-core/src/quality_report.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_report_guard.rs"
      - "docs/roadmap/evaluation-report-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq48-reports.yml"
  pull_request:
    paths:
      - "kiana-domain/src/quality_report.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/quality_report.rs"
      - "kiana-core/src/quality_report.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/quality_report_guard.rs"
      - "docs/roadmap/evaluation-report-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq48-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-48 report fixtures
        run: cargo test -p kiana-domain --test quality_report --locked -- --test-threads=1
      - name: Run EQ-48 report boundary guard
        run: cargo test -p kiana-core --test quality_report_guard --locked -- --test-threads=1
      - name: Compile EQ-48 affected targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
