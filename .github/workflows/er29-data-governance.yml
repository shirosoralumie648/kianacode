name: ER-29 data governance and deletion propagation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-governance:
    name: ER-29 data governance fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ER-29 domain contract fixtures
        run: cargo test -p kiana-domain --test er29_data_governance --locked -- --test-threads=1
      - name: Run ER-29 Core deny fixtures
        run: cargo test -p kiana-core --test er29_data_governance --locked -- --test-threads=1
      - name: Run ER-29 reconciliation evidence fixtures
        run: cargo test -p kiana-core --test er29_reconciliation_evidence --locked -- --test-threads=1
      - name: Run ER-29 source guard
        run: cargo test -p kiana-core --test er29_data_governance_guard --locked -- --test-threads=1
      - name: Run ER-29 eventlog propagation fixtures
        run: cargo test -p kiana-eventlog --test er29_data_propagation_store --locked -- --test-threads=1
      - name: Run ER-29 query index fixtures
        run: cargo test -p kiana-query --test er29_data_governance --locked -- --test-threads=1
      - name: Run ER-29 artifact invalidation fixtures
        run: cargo test -p kiana-daemon --test er29_artifact_invalidation --locked -- --test-threads=1
      - name: Compile selected ER-29 targets
        run: cargo test -p kiana-domain --test er29_data_governance --no-run --locked
      - run: cargo test -p kiana-core --test er29_data_governance --no-run --locked
      - run: cargo test -p kiana-core --test er29_reconciliation_evidence --no-run --locked
      - run: cargo test -p kiana-core --test er29_data_governance_guard --no-run --locked
      - run: cargo test -p kiana-eventlog --test er29_data_propagation_store --no-run --locked
      - run: cargo test -p kiana-query --test er29_data_governance --no-run --locked
      - run: cargo test -p kiana-daemon --test er29_artifact_invalidation --no-run --locked
