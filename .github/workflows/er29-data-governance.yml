name: er29-data-governance

on:
  push:
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/er29_data_governance.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/deletion.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er29_data_governance.rs"
      - "kiana-core/tests/er29_data_governance_guard.rs"
      - "kiana-eventlog/src/artifact_store.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/governance_contract.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/src/memory_store.rs"
      - "kiana-eventlog/src/retention_store.rs"
      - "kiana-eventlog/tests/er29_data_propagation_store.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-query/src/cache_policy.rs"
      - "kiana-query/src/index_invalidation.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/er29_data_governance.rs"
      - "docs/roadmap/er29-data-governance-baseline.md"
      - ".github/workflows/er29-data-governance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/er29_data_governance.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/deletion.rs"
      - "kiana-core/src/receipts.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er29_data_governance.rs"
      - "kiana-core/tests/er29_data_governance_guard.rs"
      - "kiana-eventlog/src/artifact_store.rs"
      - "kiana-eventlog/src/event_store_core.rs"
      - "kiana-eventlog/src/governance_contract.rs"
      - "kiana-eventlog/src/lib.rs"
      - "kiana-eventlog/src/memory_store.rs"
      - "kiana-eventlog/src/retention_store.rs"
      - "kiana-eventlog/tests/er29_data_propagation_store.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-query/src/cache_policy.rs"
      - "kiana-query/src/index_invalidation.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/er29_data_governance.rs"
      - "docs/roadmap/er29-data-governance-baseline.md"
      - ".github/workflows/er29-data-governance.yml"

permissions:
  contents: read

jobs:
  er29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --all --check
      - name: domain governance fixtures
        run: cargo test -p kiana-domain --test er29_data_governance --locked -- --test-threads=1
      - name: core governance fixtures
        run: cargo test -p kiana-core --test er29_data_governance --locked -- --test-threads=1
      - name: core source guard
        run: cargo test -p kiana-core --test er29_data_governance_guard --locked -- --test-threads=1
      - name: eventlog propagation fixtures
        run: cargo test -p kiana-eventlog --test er29_data_propagation_store --locked -- --test-threads=1
      - name: query invalidation fixtures
        run: cargo test -p kiana-query --test er29_data_governance --locked -- --test-threads=1
      - name: workspace test target compile
        run: cargo check --workspace --tests --locked

