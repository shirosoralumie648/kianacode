name: CO-08 company replay and migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-replay:
    name: Company replay, migration and reducer guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CO-08 domain replay fixtures
        run: cargo test -p kiana-domain --test co08_replay --locked -- --test-threads=1
      - name: Run CO-08 core replay source guard
        run: cargo test -p kiana-core --test co08_replay_guard --locked -- --test-threads=1
      - name: Compile CO-08 domain replay target
        run: cargo test -p kiana-domain --test co08_replay --no-run --locked
      - name: Compile CO-08 core replay guard target
        run: cargo test -p kiana-core --test co08_replay_guard --no-run --locked
