name: CO-08 company replay and migration

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-replay-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co08-company-replay.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/company-replay-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/module-map.md"
      - "docs/roadmap/README.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co08-company-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-08 replay fixtures
        run: cargo test -p kiana-domain --test co08_replay --locked -- --test-threads=1
      - name: Run CO-08 reducer source guard
        run: cargo test -p kiana-core --test co08_replay_guard --locked -- --test-threads=1
      - name: Compile Company replay path
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
