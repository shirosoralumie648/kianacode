name: DEP-08 deployment config

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_config.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep08_deployment_config.rs"
      - "kiana-core/src/deployment_config.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep08_deployment_config_guard.rs"
      - "docs/roadmap/dep08-deployment-config-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep08-deployment-config.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_config.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep08_deployment_config.rs"
      - "kiana-core/src/deployment_config.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep08_deployment_config_guard.rs"
      - "docs/roadmap/dep08-deployment-config-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep08-deployment-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-08 domain fixtures
        run: cargo test -p kiana-domain --test dep08_deployment_config --locked -- --test-threads=1
      - name: Run DEP-08 source guard
        run: cargo test -p kiana-core --test dep08_deployment_config_guard --locked -- --test-threads=1
      - name: Compile DEP-08 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
