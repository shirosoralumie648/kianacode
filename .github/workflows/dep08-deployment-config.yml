name: "DEP-08 · Deployment config baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep08-deployment-config:
    name: "DEP-08 · Deployment config baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep08_deployment_config_guard
        run: cargo test -p kiana-core --test dep08_deployment_config_guard --locked -- --test-threads=1
      - name: Run kiana-domain dep08_deployment_config
        run: cargo test -p kiana-domain --test dep08_deployment_config --locked -- --test-threads=1
