name: h28-progress-stall

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/progress_stall.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h28_progress.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/src/lib.rs"
      - "kiana-runner/src/progress.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h28_progress.rs"
      - "kiana-core/tests/h28_progress_guard.rs"
      - "docs/roadmap/h28-progress-stall-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h28-progress-stall.yml"
  pull_request:
    paths:
      - "kiana-domain/src/progress_stall.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/h28_progress.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/src/lib.rs"
      - "kiana-runner/src/progress.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h28_progress.rs"
      - "kiana-core/tests/h28_progress_guard.rs"
      - "docs/roadmap/h28-progress-stall-baseline.md"
      - "docs/roadmap/harness.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h28-progress-stall.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress-stall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H28 domain fixtures
        run: cargo test -p kiana-domain --test h28_progress --locked -- --test-threads=1
      - name: Run H28 protocol fixtures
        run: cargo test -p kiana-protocol --test h28_progress --locked -- --test-threads=1
      - name: Run H28 core and runner source guard
        run: cargo test -p kiana-core --test h28_progress_guard --locked -- --test-threads=1
