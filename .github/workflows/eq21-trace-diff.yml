name: EQ-21 trace diff

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-diff-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq21-trace-diff.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-trace-diff-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq21-trace-diff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run first-divergence fixtures
        run: cargo test -p kiana-quality --test eq21_trace_diff --locked -- --test-threads=1
      - name: Run trace diff source guard
        run: cargo test -p kiana-quality --test eq21_trace_diff_guard --locked -- --test-threads=1
      - name: Compile EQ-21 targets
        run: cargo check --workspace --tests --locked
