name: SC-43 security status and review closeout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Validate SC-43 review and status handoff
        run: bash scripts/validate-sc43-security-closeout.sh
      - name: Run SC-43 source guard
        run: cargo test -p kiana-core --test sc43_security_closeout_guard --locked -- --test-threads=1
      - run: git diff --check
      - run: cargo check --workspace --tests --locked
