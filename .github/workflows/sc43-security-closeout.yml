name: SC-43 security status and review closeout

on:
  push:
    branches: [main, master]
    paths:
      - "docs/security/sc43-security-review.md"
      - "docs/module-map.md"
      - "docs/roadmap/sc43-security-closeout-baseline.md"
      - "scripts/validate-sc43-security-closeout.sh"
      - "kiana-core/tests/sc43_security_closeout_guard.rs"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc43-security-closeout.yml"
  pull_request:
    paths:
      - "docs/security/sc43-security-review.md"
      - "docs/module-map.md"
      - "docs/roadmap/sc43-security-closeout-baseline.md"
      - "scripts/validate-sc43-security-closeout.sh"
      - "kiana-core/tests/sc43_security_closeout_guard.rs"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc43-security-closeout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Validate SC-43 review and status handoff
        run: bash scripts/validate-sc43-security-closeout.sh
      - name: Run SC-43 source guard
        run: cargo test -p kiana-core --test sc43_security_closeout_guard --locked -- --test-threads=1
      - run: git diff --check
      - run: cargo check --workspace --tests --locked
