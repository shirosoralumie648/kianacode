name: "DEP-01 · Deployment profile baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep01-deployment-profile:
    name: "DEP-01 · Deployment profile baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep01_deployment_guard
        run: cargo test -p kiana-core --test dep01_deployment_guard --locked -- --test-threads=1
      - name: Run kiana-domain dep01_deployment
        run: cargo test -p kiana-domain --test dep01_deployment --locked -- --test-threads=1
