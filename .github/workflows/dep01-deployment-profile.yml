name: DEP-01 deployment profile

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep01_deployment.rs"
      - "kiana-core/tests/dep01_deployment_guard.rs"
      - "docs/roadmap/dep01-deployment-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep01-deployment-profile.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep01_deployment.rs"
      - "kiana-core/tests/dep01_deployment_guard.rs"
      - "docs/roadmap/dep01-deployment-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep01-deployment-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-01 domain fixtures
        run: cargo test -p kiana-domain --test dep01_deployment --locked -- --test-threads=1
      - name: Run DEP-01 source guard
        run: cargo test -p kiana-core --test dep01_deployment_guard --locked -- --test-threads=1
      - name: Compile DEP-01 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
