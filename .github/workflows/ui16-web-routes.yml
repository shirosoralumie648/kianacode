name: "UI-16 Web routes and request guards"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui16-web-routes:
    name: "UI-16 Web routes and request guards"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
      # The live loopback fixtures drive a real DaemonHost/Web router; the project
      # convention for daemon/entrypoint tests is a 32 MiB test-thread stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run the route/auth/limit fixture and router binding
        run: cargo test -p kiana-entrypoints --test ui16_web_routes --locked -- --test-threads=1
      - name: Run the authority, health-redaction and error-catalogue guard
        run: cargo test -p kiana-entrypoints --test ui16_web_routes_guard --locked -- --test-threads=1
      - name: Run the live loopback HTTP boundary fixtures
        run: cargo test -p kiana-entrypoints --lib web::tests::ui16_ --locked -- --test-threads=1
      - name: Compile the affected targets without running
        run: cargo test -p kiana-entrypoints --no-run --locked
