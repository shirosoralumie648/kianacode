name: "CO-26 packet-level acceptance baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co26-packet-acceptance:
    name: "CO-26 packet-level acceptance baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co26_packet_acceptance_guard
        run: cargo test -p kiana-core --test co26_packet_acceptance_guard --locked -- --test-threads=1
      - name: Run kiana-domain co26_packet_acceptance
        run: cargo test -p kiana-domain --test co26_packet_acceptance --locked -- --test-threads=1
