name: NM-21 cross-entry notification parity

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_parity.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_parity.rs"
      - "kiana-core/tests/fixtures/nm21-notification-parity.json"
      - "kiana-core/tests/nm21_notification_parity.rs"
      - "kiana-core/tests/nm21_notification_parity_guard.rs"
      - "docs/roadmap/nm21-notification-parity-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm21-notification-parity.yml"
  pull_request:
    paths:
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/notification_parity.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/notification_parity.rs"
      - "kiana-core/tests/fixtures/nm21-notification-parity.json"
      - "kiana-core/tests/nm21_notification_parity.rs"
      - "kiana-core/tests/nm21_notification_parity_guard.rs"
      - "docs/roadmap/nm21-notification-parity-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/nm21-notification-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run cross-entry notification parity fixtures
        run: cargo test -p kiana-core --test nm21_notification_parity --locked -- --test-threads=1
      - name: Run cross-entry parity source guard
        run: cargo test -p kiana-core --test nm21_notification_parity_guard --locked -- --test-threads=1
      - run: cargo check --workspace --tests --locked
