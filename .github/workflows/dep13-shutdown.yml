name: DEP-13 unified shutdown

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_shutdown.rs"
      - "kiana-domain/src/operation_lifecycle.rs"
      - "kiana-domain/src/cancellation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep13_shutdown.rs"
      - "kiana-core/src/deployment_shutdown.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep13_shutdown_guard.rs"
      - "kiana-daemon/src/deployment_shutdown.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep13_shutdown_route_guard.rs"
      - "docs/roadmap/dep13-shutdown-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep13-shutdown.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_shutdown.rs"
      - "kiana-domain/src/operation_lifecycle.rs"
      - "kiana-domain/src/cancellation.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep13_shutdown.rs"
      - "kiana-core/src/deployment_shutdown.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep13_shutdown_guard.rs"
      - "kiana-daemon/src/deployment_shutdown.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep13_shutdown_route_guard.rs"
      - "docs/roadmap/dep13-shutdown-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep13-shutdown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shutdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run DEP-13 domain fixtures
        run: cargo test -p kiana-domain --test dep13_shutdown --locked -- --test-threads=1
      - name: Run DEP-13 Core guard
        run: cargo test -p kiana-core --test dep13_shutdown_guard --locked -- --test-threads=1
      - name: Run DEP-13 daemon route guard
        run: cargo test -p kiana-daemon --test dep13_shutdown_route_guard --locked -- --test-threads=1
      - name: Compile DEP-13 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
