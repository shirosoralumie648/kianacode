name: "EQ-44 shadow admission baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq44-shadow:
    name: "EQ-44 shadow admission baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq44_shadow
        run: cargo test -p kiana-quality --test eq44_shadow --locked -- --test-threads=1
      - name: Run kiana-quality eq44_shadow_guard
        run: cargo test -p kiana-quality --test eq44_shadow_guard --locked -- --test-threads=1
