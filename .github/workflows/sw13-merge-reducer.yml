name: SW-13 swarm merge reducer

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_merge_reducer.rs"
      - "kiana-domain/src/swarm_child_result.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_merge_reducer.rs"
      - "kiana-core/src/swarm_merge_reducer.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw13_merge_reducer_guard.rs"
      - "docs/roadmap/sw13-merge-reducer-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw13-merge-reducer.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_merge_reducer.rs"
      - "kiana-domain/src/swarm_child_result.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_merge_reducer.rs"
      - "kiana-core/src/swarm_merge_reducer.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw13_merge_reducer_guard.rs"
      - "docs/roadmap/sw13-merge-reducer-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw13-merge-reducer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-merge-reducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-13 domain fixtures
        run: cargo test -p kiana-domain --test swarm_merge_reducer --locked -- --test-threads=1
      - name: Run SW-13 Core source guard
        run: cargo test -p kiana-core --test sw13_merge_reducer_guard --locked -- --test-threads=1
      - name: Compile SW-13 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
