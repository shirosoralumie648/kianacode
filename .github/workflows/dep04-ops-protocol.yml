name: "DEP-04 · Ops protocol baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep04-ops-protocol:
    name: "DEP-04 · Ops protocol baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep04_ops_protocol_guard
        run: cargo test -p kiana-core --test dep04_ops_protocol_guard --locked -- --test-threads=1
      - name: Run kiana-protocol dep04_ops
        run: cargo test -p kiana-protocol --test dep04_ops --locked -- --test-threads=1
