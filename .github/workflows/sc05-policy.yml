name: SC-05 policy bundle and decision trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run SC-05 policy fixture
        run: cargo test -p kiana-policy --test sc05_policy --locked -- --test-threads=1
      - name: Run SC-05 source guard
        run: cargo test -p kiana-core --test sc05_policy_guard --locked -- --test-threads=1
      - name: Compile SC-05 policy target
        run: cargo test -p kiana-policy --test sc05_policy --no-run --locked
      - name: Compile SC-05 Core guard target
        run: cargo test -p kiana-core --test sc05_policy_guard --no-run --locked
