name: co33-delivery-manifest

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/delivery_manifest.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co33_delivery_manifest.rs"
      - "kiana-core/src/delivery_manifest.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co33_delivery_manifest_guard.rs"
      - "docs/roadmap/co33-delivery-manifest-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co33-delivery-manifest.yml"
  pull_request:
    paths:
      - "kiana-domain/src/delivery_manifest.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co33_delivery_manifest.rs"
      - "kiana-core/src/delivery_manifest.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co33_delivery_manifest_guard.rs"
      - "docs/roadmap/co33-delivery-manifest-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co33-delivery-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-33 DeliveryManifest fixtures
        run: cargo test -p kiana-domain --test co33_delivery_manifest --locked -- --test-threads=1
      - name: Run CO-33 Broker boundary guard
        run: cargo test -p kiana-core --test co33_delivery_manifest_guard --locked -- --test-threads=1
      - name: Compile CO-33 delivery targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
