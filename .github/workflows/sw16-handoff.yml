name: SW-16 directed swarm handoff

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_handoff.rs"
      - "kiana-domain/src/swarm_merge_review.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_handoff.rs"
      - "kiana-core/src/swarm_handoff.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw16_handoff_guard.rs"
      - "docs/roadmap/sw16-handoff-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw16-handoff.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_handoff.rs"
      - "kiana-domain/src/swarm_merge_review.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_handoff.rs"
      - "kiana-core/src/swarm_handoff.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw16_handoff_guard.rs"
      - "docs/roadmap/sw16-handoff-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw16-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-16 domain fixtures
        run: cargo test -p kiana-domain --test swarm_handoff --locked -- --test-threads=1
      - name: Run SW-16 Core source guard
        run: cargo test -p kiana-core --test sw16_handoff_guard --locked -- --test-threads=1
      - name: Compile SW-16 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
