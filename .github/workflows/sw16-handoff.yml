name: "SW-16 directed swarm handoff baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sw16-handoff:
    name: "SW-16 directed swarm handoff baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core sw16_handoff_guard
        run: cargo test -p kiana-core --test sw16_handoff_guard --locked -- --test-threads=1
