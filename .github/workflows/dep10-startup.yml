name: DEP-10 startup coordinator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run DEP-10 domain fixtures
        run: cargo test -p kiana-domain --test dep10_startup --locked -- --test-threads=1
      - name: Run DEP-10 Core guard
        run: cargo test -p kiana-core --test dep10_startup_guard --locked -- --test-threads=1
      - name: Run DEP-10 daemon guard
        run: cargo test -p kiana-daemon --test dep10_startup_guard --locked -- --test-threads=1
      - name: Compile DEP-10 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
