name: DEP-10 startup coordinator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/deployment_startup.rs"
      - "kiana-domain/src/deployment_release.rs"
      - "kiana-domain/src/deployment_compatibility.rs"
      - "kiana-domain/src/storage_preflight.rs"
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep10_startup.rs"
      - "kiana-core/src/deployment_startup.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep10_startup_guard.rs"
      - "kiana-daemon/src/startup_coordinator.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep10_startup_guard.rs"
      - "docs/roadmap/dep10-startup-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep10-startup.yml"
  pull_request:
    paths:
      - "kiana-domain/src/deployment_startup.rs"
      - "kiana-domain/src/deployment_release.rs"
      - "kiana-domain/src/deployment_compatibility.rs"
      - "kiana-domain/src/storage_preflight.rs"
      - "kiana-domain/src/operation_lease.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/dep10_startup.rs"
      - "kiana-core/src/deployment_startup.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/dep10_startup_guard.rs"
      - "kiana-daemon/src/startup_coordinator.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/dep10_startup_guard.rs"
      - "docs/roadmap/dep10-startup-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/dep10-startup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run DEP-10 domain fixtures
        run: cargo test -p kiana-domain --test dep10_startup --locked -- --test-threads=1
      - name: Run DEP-10 Core guard
        run: cargo test -p kiana-core --test dep10_startup_guard --locked -- --test-threads=1
      - name: Run DEP-10 daemon guard
        run: cargo test -p kiana-daemon --test dep10_startup_guard --locked -- --test-threads=1
      - name: Compile DEP-10 targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
