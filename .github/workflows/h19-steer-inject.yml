name: H19 steer inject

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/inbox_contract.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h19_steer_inject.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/h19_steer_inject_guard.rs"
      - "kiana-runner-protocol/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h19_steer_inject.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-steer-inject-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h19-steer-inject.yml"
  pull_request:
    paths:
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/inbox_contract.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-protocol/src/lib.rs"
      - "kiana-protocol/tests/h19_steer_inject.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/h19_steer_inject_guard.rs"
      - "kiana-runner-protocol/src/lib.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-runner/tests/h19_steer_inject.rs"
      - "docs/roadmap/harness.md"
      - "docs/roadmap/harness-steer-inject-baseline.md"
      - "docs/roadmap.md"
      - "docs/roadmap/README.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/h19-steer-inject.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steer-inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run H19 protocol fixtures
        run: cargo test -p kiana-protocol --test h19_steer_inject --locked -- --test-threads=1
      - name: Run H19 runner fixtures
        run: cargo test -p kiana-runner --test h19_steer_inject --locked -- --test-threads=1
      - name: Run H19 core source guard
        run: cargo test -p kiana-core --test h19_steer_inject_guard --locked -- --test-threads=1
      - name: Compile H19 targets
        run: cargo check --workspace --tests --locked
