name: P3-I-01 Company object contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p3_i01_company_objects.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p3_i01_company_objects_guard.rs"
      - "docs/roadmap/company-object-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i01-company-objects.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/tests/p3_i01_company_objects.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p3_i01_company_objects_guard.rs"
      - "docs/roadmap/company-object-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i01-company-objects.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P3-I-01 object fixtures
        run: cargo test -p kiana-domain --test p3_i01_company_objects --locked -- --test-threads=1
      - name: Run P3-I-01 source guard
        run: cargo test -p kiana-core --test p3_i01_company_objects_guard --locked -- --test-threads=1
      - name: Compile Company object path
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
