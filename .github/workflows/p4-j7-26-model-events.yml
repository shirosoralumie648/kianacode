name: P4-J7-26 model events and redaction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run model event lifecycle, redaction and correlation fixtures
        run: cargo test -p kiana-domain --test p4_j7_26_model_events --locked -- --test-threads=1
      - name: Run model event boundary source guard
        run: cargo test -p kiana-core --test p4_j7_26_model_events_guard --locked -- --test-threads=1
      - name: Compile touched crates with tests
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
