name: "DEP-00 · Deployment and operations source inventory baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep00-deployment-baseline:
    name: "DEP-00 · Deployment and operations source inventory baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core dep00_deployment_guard
        run: cargo test -p kiana-core --test dep00_deployment_guard --locked -- --test-threads=1
