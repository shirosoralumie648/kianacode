name: P2-K7-01 data governance and deletion propagation

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/tests/p2_k7_01_data_governance.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/p2_k7_01_data_governance.rs"
      - "kiana-core/tests/oa20_data_governance_projection.rs"
      - "kiana-daemon/src/data_governance.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/context_query.rs"
      - "kiana-domain/tests/oa20_data_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k7-01-data-governance-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k7-01-data-governance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/tests/p2_k7_01_data_governance.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/p2_k7_01_data_governance.rs"
      - "kiana-core/tests/oa20_data_governance_projection.rs"
      - "kiana-daemon/src/data_governance.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "kiana-daemon/src/context_query.rs"
      - "kiana-domain/tests/oa20_data_governance.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p2-k7-01-data-governance-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p2-k7-01-data-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run data governance fixture
        run: cargo test -p kiana-domain --test p2_k7_01_data_governance --locked -- --test-threads=1
      - name: Run data governance source guard
        run: cargo test -p kiana-core --test p2_k7_01_data_governance --locked -- --test-threads=1
      - name: Run domain governance regression
        run: cargo test -p kiana-domain --test oa20_data_governance --locked -- --test-threads=1
      - name: Run core projection regression
        run: cargo test -p kiana-core --test oa20_data_governance_projection --locked -- --test-threads=1
      - name: Compile P2-K7-01 targets
        run: cargo check --workspace --tests --locked
