name: CAP-32 Windows backend probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: C:\\kiana-target
  CARGO_INCREMENTAL: 0

jobs:
  windows-compile-and-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -p kiana-domain -p kiana-ports -p kiana-daemon -- --check
      - name: Run CAP-32 source guard
        run: cargo test -p kiana-core --test cap32_windows_backend_guard --locked -- --test-threads=1
      - name: Run CAP-32 platform disposition fixture
        run: cargo test -p kiana-domain --test cap32_platform_backend --locked -- --test-threads=1
