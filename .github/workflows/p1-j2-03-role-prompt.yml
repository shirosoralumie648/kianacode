name: P1-J2-03 role prompt

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/src/roles.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/p1_j2_03_role_prompt_guard.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-03-role-prompt-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-03-role-prompt.yml"
  pull_request:
    paths:
      - "kiana-domain/src/prompts.rs"
      - "kiana-domain/src/roles.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-core/tests/p1_j2_03_role_prompt_guard.rs"
      - "kiana-runner/src/harness.rs"
      - "kiana-daemon/src/model_client.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p1-j2-03-role-prompt-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p1-j2-03-role-prompt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run P1-J2-03 source guard
        run: cargo test -p kiana-core --test p1_j2_03_role_prompt_guard --locked -- --test-threads=1
      - name: Compile P1-J2-03 targets
        run: cargo check --workspace --tests --locked
