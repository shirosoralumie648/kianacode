name: CAP-07 environment backend probe and plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-backend:
    name: CAP-07 environment backend fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run environment and scope fixtures
        run: cargo test -p kiana-daemon --test eq09_eval_runtime --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test eq09_eval_runtime_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test cap03_execution_scope --locked -- --test-threads=1
      - name: Run CAP-07 source guard
        run: cargo test -p kiana-core --test cap07_environment_backend_guard --locked -- --test-threads=1
      - name: Compile daemon and Core targets
        run: cargo test -p kiana-daemon --test eq09_eval_runtime --no-run --locked
      - run: cargo test -p kiana-core --test eq09_eval_runtime_guard --no-run --locked
      - name: Compile domain and CAP-07 guard targets
        run: cargo test -p kiana-domain --test cap03_execution_scope --no-run --locked
      - run: cargo test -p kiana-core --test cap07_environment_backend_guard --no-run --locked
