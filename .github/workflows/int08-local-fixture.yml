name: "INT-08 local fixture baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int08-local-fixture:
    name: "INT-08 local fixture baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check

      # Domain fixture contract: schema, bounds, hash pinning, canonical payload matching and
      # deterministic receipts (succeeded/failed/unknown) with deny-first coverage.
      - name: Run domain local fixture fixtures
        run: cargo test -p kiana-domain --test int08_local_fixture --locked -- --test-threads=1
      - name: Run domain connector contract regression
        run: cargo test -p kiana-domain --test p4_k8_01_connector --locked -- --test-threads=1
      - name: Run core local fixture source guard
        run: cargo test -p kiana-core --test int08_local_fixture_guard --locked -- --test-threads=1
      - name: Run core connector control-plane guard
        run: cargo test -p kiana-core --test p4_k8_01_connector --locked -- --test-threads=1
      # Daemon behaviour through the production DaemonHost → ControlPlane → Broker → EventStore
      # path: fixture bind/invoke/replay/reconcile plus replaced bytes, unknown and unregistered
      # operations, each proving zero effect.
      - name: Run daemon local fixture behaviour fixtures
        run: cargo test -p kiana-daemon --test int08_local_fixture --locked -- --test-threads=1

      - name: Compile domain local fixture target
        run: cargo test -p kiana-domain --test int08_local_fixture --no-run --locked
      - name: Compile core local fixture guard target
        run: cargo test -p kiana-core --test int08_local_fixture_guard --no-run --locked
      - name: Compile daemon local fixture target
        run: cargo test -p kiana-daemon --test int08_local_fixture --no-run --locked
