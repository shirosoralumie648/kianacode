name: BQ-01 billing contracts

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/billing_contracts.rs"
      - "kiana-domain/tests/bq01_billing_contracts.rs"
      - "kiana-core/tests/bq01_billing_contract_guard.rs"
      - "docs/roadmap/billing-quota-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq01-billing-contracts.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/billing_contracts.rs"
      - "kiana-domain/tests/bq01_billing_contracts.rs"
      - "kiana-core/tests/bq01_billing_contract_guard.rs"
      - "docs/roadmap/billing-quota-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq01-billing-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run billing contract fixtures
        run: cargo test -p kiana-domain --test bq01_billing_contracts --locked -- --test-threads=1
      - name: Run billing contract source guard
        run: cargo test -p kiana-core --test bq01_billing_contract_guard --locked -- --test-threads=1
      - name: Compile BQ-01 targets
        run: cargo check --workspace --tests --locked
