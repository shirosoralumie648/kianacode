name: EQ-49 evaluation scripts

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/eval-curated.sh"
      - "scripts/eval-deep.sh"
      - "scripts/eval-capture-golden.sh"
      - "scripts/eval-compare.sh"
      - "scripts/tests/eq49-eval-scripts-static.sh"
      - "docs/roadmap/evaluation-scripts-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq49-eval-scripts.yml"
  pull_request:
    paths:
      - "scripts/eval-curated.sh"
      - "scripts/eval-deep.sh"
      - "scripts/eval-capture-golden.sh"
      - "scripts/eval-compare.sh"
      - "scripts/tests/eq49-eval-scripts-static.sh"
      - "docs/roadmap/evaluation-scripts-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq49-eval-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check EQ-49 shell syntax and static guards
        run: bash scripts/tests/eq49-eval-scripts-static.sh
