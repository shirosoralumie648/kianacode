name: co37-company-knowledge

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company_knowledge.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/tests/co37_company_knowledge.rs"
      - "kiana-core/src/company_knowledge.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co37_company_knowledge_guard.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "docs/roadmap/co37-company-knowledge-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co37-company-knowledge.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company_knowledge.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/memory_distillation.rs"
      - "kiana-domain/src/memory_proposals.rs"
      - "kiana-domain/tests/co37_company_knowledge.rs"
      - "kiana-core/src/company_knowledge.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co37_company_knowledge_guard.rs"
      - "kiana-daemon/src/harness_memory.rs"
      - "docs/roadmap/co37-company-knowledge-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co37-company-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-37 Company knowledge fixtures
        run: cargo test -p kiana-domain --test co37_company_knowledge --locked -- --test-threads=1
      - name: Run CO-37 Memory boundary guard
        run: cargo test -p kiana-core --test co37_company_knowledge_guard --locked -- --test-threads=1
      - name: Compile CO-37 knowledge targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
