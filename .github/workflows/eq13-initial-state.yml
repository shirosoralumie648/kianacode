name: EQ-13 evaluation initial state

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-daemon/src/eval_runtime.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/eq13_initial_state.rs"
      - "kiana-core/tests/eq13_initial_state_guard.rs"
      - "docs/roadmap/evaluation-initial-state-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq13-initial-state.yml"
  pull_request:
    paths:
      - "kiana-daemon/src/eval_runtime.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/eq13_initial_state.rs"
      - "kiana-core/tests/eq13_initial_state_guard.rs"
      - "docs/roadmap/evaluation-initial-state-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq13-initial-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initial-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run initial state fixtures
        run: cargo test -p kiana-daemon --test eq13_initial_state --locked -- --test-threads=1
      - name: Run initial state source guard
        run: cargo test -p kiana-core --test eq13_initial_state_guard --locked -- --test-threads=1
      - name: Compile EQ-13 targets
        run: cargo check --workspace --tests --locked
