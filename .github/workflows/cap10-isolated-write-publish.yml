name: CAP-10 isolated write and controlled publication

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-daemon/src/execution_workspace.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/cap07_environment_backend_guard.rs"
      - "kiana-core/tests/cap08_path_resolver_guard.rs"
      - "kiana-core/tests/cap09_linux_file_view_guard.rs"
      - "kiana-core/tests/cap10_isolated_write_publish_guard.rs"
      - "kiana-daemon/tests/harness_runtime.rs"
      - "kiana-daemon/tests/h15_output_limits.rs"
      - "docs/roadmap/cap10-isolated-write-publish-baseline.md"
      - "docs/roadmap/capability.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap10-isolated-write-publish.yml"
  pull_request:
    paths:
      - "kiana-daemon/src/execution_workspace.rs"
      - "kiana-daemon/src/apply_patch.rs"
      - "kiana-daemon/src/execution_control.rs"
      - "kiana-daemon/src/harness_capabilities.rs"
      - "kiana-core/src/workspace_checkpoints.rs"
      - "kiana-core/tests/cap07_environment_backend_guard.rs"
      - "kiana-core/tests/cap08_path_resolver_guard.rs"
      - "kiana-core/tests/cap09_linux_file_view_guard.rs"
      - "kiana-core/tests/cap10_isolated_write_publish_guard.rs"
      - "kiana-daemon/tests/harness_runtime.rs"
      - "kiana-daemon/tests/h15_output_limits.rs"
      - "docs/roadmap/cap10-isolated-write-publish-baseline.md"
      - "docs/roadmap/capability.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cap10-isolated-write-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-write-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run workspace and output fixtures
        run: cargo test -p kiana-daemon --test harness_runtime --locked -- --test-threads=1
      - run: cargo test -p kiana-daemon --test h15_output_limits --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cap07_environment_backend_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cap08_path_resolver_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test cap09_linux_file_view_guard --locked -- --test-threads=1
      - name: Run CAP-10 source guard
        run: cargo test -p kiana-core --test cap10_isolated_write_publish_guard --locked -- --test-threads=1
      - name: Compile CAP-10 targets
        run: cargo check --workspace --tests --locked
