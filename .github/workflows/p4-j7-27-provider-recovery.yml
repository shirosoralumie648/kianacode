name: P4-J7-27 provider round recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run complete-round recovery and in-flight reconciliation fixtures
        run: cargo test -p kiana-domain --test p4_j7_27_provider_recovery --locked -- --test-threads=1
      - name: Run provider recovery boundary source guard
        run: cargo test -p kiana-core --test p4_j7_27_provider_recovery_guard --locked -- --test-threads=1
      - name: Compile touched crates with tests
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
