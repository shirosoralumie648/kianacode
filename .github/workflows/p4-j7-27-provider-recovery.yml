name: P4-J7-27 provider complete-round recovery

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/provider_recovery.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_27_provider_recovery.rs"
      - "kiana-core/tests/p4_j7_27_provider_recovery_guard.rs"
      - "kiana-core/src/history.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-provider/src/request.rs"
      - "docs/roadmap/p4-j7-27-provider-recovery-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-27-provider-recovery.yml"
  pull_request:
    paths:
      - "kiana-domain/src/provider_recovery.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/p4_j7_27_provider_recovery.rs"
      - "kiana-core/tests/p4_j7_27_provider_recovery_guard.rs"
      - "kiana-core/src/history.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/src/lifecycle.rs"
      - "kiana-provider/src/request.rs"
      - "docs/roadmap/p4-j7-27-provider-recovery-baseline.md"
      - "docs/roadmap/provider.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p4-j7-27-provider-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run provider recovery domain fixtures
        run: cargo test -p kiana-domain --test p4_j7_27_provider_recovery --locked -- --test-threads=1
      - name: Run provider recovery source guard
        run: cargo test -p kiana-core --test p4_j7_27_provider_recovery_guard --locked -- --test-threads=1
      - name: Compile P4-J7-27 targets
        run: cargo check --workspace --tests --locked
