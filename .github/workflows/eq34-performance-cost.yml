name: "EQ-34 performance and cost evaluator baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq34-performance-cost:
    name: "EQ-34 performance and cost evaluator baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-quality eq34_metrics
        run: cargo test -p kiana-quality --test eq34_metrics --locked -- --test-threads=1
      - name: Run kiana-quality eq34_metrics_guard
        run: cargo test -p kiana-quality --test eq34_metrics_guard --locked -- --test-threads=1
