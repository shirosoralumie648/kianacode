name: EQ-34 performance cost evaluator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-performance-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq34-performance-cost.yml"
  pull_request:
    paths:
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-performance-cost-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/eq34-performance-cost.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EQ-34 performance cost fixtures
        run: cargo test -p kiana-quality --test eq34_metrics --locked -- --test-threads=1
      - name: Run EQ-34 source guard
        run: cargo test -p kiana-quality --test eq34_metrics_guard --locked -- --test-threads=1
      - name: Compile EQ-34 targets
        run: cargo check --workspace --tests --locked
