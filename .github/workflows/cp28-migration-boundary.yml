name: CP-28 migration and compatibility boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/storage_schema.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/tests/p0_a01b_schema.rs"
      - "kiana-domain/tests/er01_event_contract.rs"
      - "kiana-domain/tests/pd02_schema.rs"
      - "kiana-domain/tests/ci04_ingress.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/tests/p0_a01b_schema_guard.rs"
      - "kiana-core/tests/pd02_schema_guard.rs"
      - "kiana-core/tests/pd06_jsonl_guard.rs"
      - "kiana-core/tests/p0_g03_resume_guard.rs"
      - "kiana-core/tests/p0_g04_projection_guard.rs"
      - "kiana-core/tests/dependency_boundaries.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "kiana-daemon/tests/eq12_daemon_spine.rs"
      - "kiana-entrypoints/src/harness_run.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/tests/cli_architecture.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-core/tests/cp28_migration_boundary_guard.rs"
      - "docs/roadmap/cp28-migration-boundary-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp28-migration-boundary.yml"
  pull_request:
    paths:
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/event_contracts.rs"
      - "kiana-domain/src/storage_schema.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/tests/p0_a01b_schema.rs"
      - "kiana-domain/tests/er01_event_contract.rs"
      - "kiana-domain/tests/pd02_schema.rs"
      - "kiana-domain/tests/ci04_ingress.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "kiana-eventlog/src/journal_core.rs"
      - "kiana-eventlog/src/memory.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-core/src/recovery.rs"
      - "kiana-core/tests/p0_a01b_schema_guard.rs"
      - "kiana-core/tests/pd02_schema_guard.rs"
      - "kiana-core/tests/pd06_jsonl_guard.rs"
      - "kiana-core/tests/p0_g03_resume_guard.rs"
      - "kiana-core/tests/p0_g04_projection_guard.rs"
      - "kiana-core/tests/dependency_boundaries.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/src/journal_approvals.rs"
      - "kiana-daemon/tests/eq12_daemon_spine.rs"
      - "kiana-entrypoints/src/harness_run.rs"
      - "kiana-entrypoints/src/cli.rs"
      - "kiana-entrypoints/tests/cli_architecture.rs"
      - "kiana-client/src/lib.rs"
      - "kiana-core/tests/cp28_migration_boundary_guard.rs"
      - "docs/roadmap/cp28-migration-boundary-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp28-migration-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run domain schema and event fixtures
        run: cargo test -p kiana-domain --test p0_a01b_schema --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test er01_event_contract --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test pd02_schema --locked -- --test-threads=1
      - run: cargo test -p kiana-domain --test ci04_ingress --locked -- --test-threads=1
      - name: Run core schema and journal guards
        run: cargo test -p kiana-core --test p0_a01b_schema_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd02_schema_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test pd06_jsonl_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p0_g03_resume_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test p0_g04_projection_guard --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test dependency_boundaries --locked -- --test-threads=1
      - name: Run eventlog package fixtures
        run: cargo test -p kiana-eventlog --locked -- --test-threads=1
      - name: Run daemon spine and CLI architecture fixtures
        run: cargo test -p kiana-daemon --test eq12_daemon_spine --locked -- --test-threads=1
      - run: cargo test -p kiana-entrypoints --test cli_architecture --locked -- --test-threads=1
      - name: Run CP-28 source guard
        run: cargo test -p kiana-core --test cp28_migration_boundary_guard --locked -- --test-threads=1
      - name: Compile CP-28 targets
        run: cargo check --workspace --tests --locked
