name: CM-06 source dependencies and governance epoch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run dependency graph fixture
        run: cargo test -p kiana-domain --test cm06_source_dependencies --locked -- --test-threads=1
      - name: Run governance source guard
        run: cargo test -p kiana-core --test cm06_source_dependencies --locked -- --test-threads=1
      - name: Compile CM-06 domain target
        run: cargo test -p kiana-domain --test cm06_source_dependencies --no-run --locked
      - name: Compile CM-06 Core target
        run: cargo test -p kiana-core --test cm06_source_dependencies --no-run --locked
