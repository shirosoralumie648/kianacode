name: CM-06 source dependencies and governance epoch

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/tests/cm06_source_dependencies.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/tests/cm06_source_dependencies.rs"
      - "docs/roadmap/cm06-source-dependencies-baseline.md"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm06-source-dependencies.yml"
  pull_request:
    paths:
      - "kiana-domain/src/source_dependencies.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/src/governance.rs"
      - "kiana-domain/tests/cm06_source_dependencies.rs"
      - "kiana-core/src/data_governance.rs"
      - "kiana-core/tests/cm06_source_dependencies.rs"
      - "docs/roadmap/cm06-source-dependencies-baseline.md"
      - "docs/roadmap/context-memory.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cm06-source-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run dependency graph fixture
        run: cargo test -p kiana-domain --test cm06_source_dependencies --locked -- --test-threads=1
      - name: Run governance source guard
        run: cargo test -p kiana-core --test cm06_source_dependencies --locked -- --test-threads=1
      - name: Compile CM-06 targets
        run: cargo check --workspace --tests --locked
