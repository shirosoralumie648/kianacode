name: INT-12 OAuth account lifecycle

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/src/oauth_accounts.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int12_oauth_account.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-ports/src/oauth_accounts.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/oauth_accounts.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/int12_oauth_store.rs"
      - "kiana-query/src/oauth_accounts.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/int12_oauth_projection.rs"
      - "kiana-core/tests/int12_oauth_guard.rs"
      - "docs/roadmap/int12-oauth-account-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int12-oauth-account.yml"
  pull_request:
    paths:
      - "kiana-domain/src/oauth.rs"
      - "kiana-domain/src/oauth_accounts.rs"
      - "kiana-domain/src/identity_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/int12_oauth_account.rs"
      - "kiana-provider/src/oauth.rs"
      - "kiana-provider/src/lib.rs"
      - "kiana-ports/src/oauth_accounts.rs"
      - "kiana-ports/src/lib.rs"
      - "kiana-daemon/src/oauth_accounts.rs"
      - "kiana-daemon/src/lib.rs"
      - "kiana-daemon/tests/int12_oauth_store.rs"
      - "kiana-query/src/oauth_accounts.rs"
      - "kiana-query/src/lib.rs"
      - "kiana-query/tests/int12_oauth_projection.rs"
      - "kiana-core/tests/int12_oauth_guard.rs"
      - "docs/roadmap/int12-oauth-account-baseline.md"
      - "docs/roadmap/integrations-connectors.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/int12-oauth-account.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run OAuth account domain fixtures
        run: cargo test -p kiana-domain --test int12_oauth_account --locked -- --test-threads=1
      - name: Run provider PKCE and refresh fixtures
        run: cargo test -p kiana-provider --lib oauth::tests --locked -- --test-threads=1
      - name: Run account store fixtures
        run: cargo test -p kiana-daemon --test int12_oauth_store --locked -- --test-threads=1
      - name: Run account query fixtures
        run: cargo test -p kiana-query --test int12_oauth_projection --locked -- --test-threads=1
      - name: Run OAuth account source guard
        run: cargo test -p kiana-core --test int12_oauth_guard --locked -- --test-threads=1
      - name: Compile CI-12 targets
        run: cargo check --workspace --tests --locked
