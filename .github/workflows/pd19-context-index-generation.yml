name: pd19-context-index-generation

on:
  push:
    paths:
      - 'kiana-query/src/index_generation.rs'
      - 'kiana-query/src/index.rs'
      - 'kiana-query/src/lib.rs'
      - 'kiana-query/tests/pd19_context_index_generation.rs'
      - 'kiana-query/tests/pd19_context_index_generation_guard.rs'
      - '.github/workflows/pd19-context-index-generation.yml'
  pull_request:
    paths:
      - 'kiana-query/src/index_generation.rs'
      - 'kiana-query/src/index.rs'
      - 'kiana-query/src/lib.rs'
      - 'kiana-query/tests/pd19_context_index_generation.rs'
      - 'kiana-query/tests/pd19_context_index_generation_guard.rs'
      - '.github/workflows/pd19-context-index-generation.yml'

permissions:
  contents: read

jobs:
  context-index-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-query --test pd19_context_index_generation --locked -- --test-threads=1
      - run: cargo test -p kiana-query --test pd19_context_index_generation_guard --locked -- --test-threads=1
