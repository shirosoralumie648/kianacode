name: P4-J7-28 provider diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run provider diagnostics domain fixtures
        run: cargo test -p kiana-domain --test p4_j7_28_provider_diagnostics --locked -- --test-threads=1
      - name: Run provider diagnostics client fixtures
        run: cargo test -p kiana-client --test p4_j7_28_provider_diagnostics --locked -- --test-threads=1
      - name: Run provider diagnostics surface fixtures
        run: cargo test -p kiana-entrypoints --test p4_j7_28_provider_surfaces --locked -- --test-threads=1
      - name: Run provider diagnostics source guard
        run: cargo test -p kiana-core --test p4_j7_28_provider_diagnostics_guard --locked -- --test-threads=1
      - name: Compile touched crates with tests
        run: cargo check -p kiana-domain -p kiana-client -p kiana-protocol -p kiana-core -p kiana-entrypoints --tests --locked
