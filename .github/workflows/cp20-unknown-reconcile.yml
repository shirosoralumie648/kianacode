name: CP-20 unknown reconciliation and retry boundary

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/errors.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/effect_observation.rs"
      - "kiana-domain/tests/p4_k8_01_connector.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/p2_k6_01_reliability.rs"
      - "kiana-core/tests/cp20_unknown_reconcile_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "docs/roadmap/cp20-unknown-reconcile-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp20-unknown-reconcile.yml"
  pull_request:
    paths:
      - "kiana-domain/src/errors.rs"
      - "kiana-domain/src/platform.rs"
      - "kiana-domain/src/connectors.rs"
      - "kiana-domain/src/effect_observation.rs"
      - "kiana-domain/tests/p4_k8_01_connector.rs"
      - "kiana-ports/src/model.rs"
      - "kiana-core/src/platform.rs"
      - "kiana-core/src/dispatch.rs"
      - "kiana-core/src/capabilities.rs"
      - "kiana-core/tests/p2_k6_01_reliability.rs"
      - "kiana-core/tests/cp20_unknown_reconcile_guard.rs"
      - "kiana-daemon/src/connectors.rs"
      - "docs/roadmap/cp20-unknown-reconcile-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/cp20-unknown-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unknown-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run reliability fixture
        run: cargo test -p kiana-core --test p2_k6_01_reliability --locked -- --test-threads=1
      - name: Run connector contract fixture
        run: cargo test -p kiana-domain --test p4_k8_01_connector --locked -- --test-threads=1
      - name: Run CP-20 source guard
        run: cargo test -p kiana-core --test cp20_unknown_reconcile_guard --locked -- --test-threads=1
      - name: Compile CP-20 targets
        run: cargo check --workspace --tests --locked
