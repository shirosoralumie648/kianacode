name: OA-03 Redaction and Bounded Signal Encoding

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redaction:
    name: Redaction profile guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run OA-03 redaction contract tests
        run: cargo test -p kiana-domain --test oa03_redaction --locked -- --test-threads=1
