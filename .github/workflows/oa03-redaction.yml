name: OA-03 Redaction and bounded signal encoding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redaction:
    name: Redaction profile guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run OA-03 redaction contract tests
        run: cargo test -p kiana-domain --test oa03_redaction --locked -- --test-threads=1
      - name: Compile OA-03 redaction target
        run: cargo test -p kiana-domain --test oa03_redaction --no-run --locked
