name: CI-03 identity and credential ports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CI-03 port fixtures
        run: cargo test -p kiana-ports --test ci03_ports --locked -- --test-threads=1
      - name: Run CI-03 source guard
        run: cargo test -p kiana-core --test ci03_ports_guard --locked -- --test-threads=1
      - name: Compile CI-03 ports target
        run: cargo test -p kiana-ports --test ci03_ports --no-run --locked
      - name: Compile CI-03 Core guard target
        run: cargo test -p kiana-core --test ci03_ports_guard --no-run --locked
