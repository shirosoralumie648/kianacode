name: er33-capacity-migration

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/er33_capacity_migration.rs"
      - "kiana-domain/src/persistence_capacity.rs"
      - "kiana-domain/src/migration_preflight.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er33_capacity_migration.rs"
      - "kiana-core/src/er33_capacity_migration.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er33_capacity_migration_guard.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "docs/roadmap/er33-capacity-migration-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er33-capacity-migration.yml"
  pull_request:
    paths:
      - "kiana-domain/src/er33_capacity_migration.rs"
      - "kiana-domain/src/persistence_capacity.rs"
      - "kiana-domain/src/migration_preflight.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/er33_capacity_migration.rs"
      - "kiana-core/src/er33_capacity_migration.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/er33_capacity_migration_guard.rs"
      - "kiana-eventlog/src/jsonl.rs"
      - "docs/roadmap/er33-capacity-migration-baseline.md"
      - "docs/roadmap/event-receipt-recovery.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/er33-capacity-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  er33-capacity-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run ER-33 capacity/migration drill fixtures
        run: cargo test -p kiana-domain --test er33_capacity_migration --locked -- --test-threads=1
      - name: Run ER-33 storage boundary guard
        run: cargo test -p kiana-core --test er33_capacity_migration_guard --locked -- --test-threads=1
      - name: Compile ER-33 affected targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-eventlog --tests --locked
