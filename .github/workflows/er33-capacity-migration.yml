name: "ER-33 Event/Receipt/Recovery capacity and migration drill baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  er33-capacity-migration:
    name: "ER-33 Event/Receipt/Recovery capacity and migration drill baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core er33_capacity_migration_guard
        run: cargo test -p kiana-core --test er33_capacity_migration_guard --locked -- --test-threads=1
      - name: Run kiana-domain er33_capacity_migration
        run: cargo test -p kiana-domain --test er33_capacity_migration --locked -- --test-threads=1
