name: AUT-16 retry classifier

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/automation_retry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_retry.rs"
      - "kiana-core/src/automation_retry.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_retry_guard.rs"
      - "docs/roadmap/aut16-retry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut16-retry.yml"
  pull_request:
    paths:
      - "kiana-domain/src/automation_retry.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/automation_retry.rs"
      - "kiana-core/src/automation_retry.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/automation_retry_guard.rs"
      - "docs/roadmap/aut16-retry-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/aut16-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p kiana-domain --test automation_retry --locked -- --test-threads=1
      - run: cargo test -p kiana-core --test automation_retry_guard --locked -- --test-threads=1
      - run: cargo check -p kiana-domain -p kiana-core --tests --locked
