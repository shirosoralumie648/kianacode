name: ER-01 event contract acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: ER-01 ${{ matrix.crate }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: kiana-domain
            target: er01_event_contract
          - crate: kiana-core
            target: er01_event_contract_guard
          - crate: kiana-core
            target: control_plane
            selector: er01_real_
          - crate: kiana-eventlog
            target: full-crate
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run complete event contract target
        env:
          CONTRACT_CRATE: ${{ matrix.crate }}
          CONTRACT_TARGET: ${{ matrix.target }}
          CONTRACT_SELECTOR: ${{ matrix.selector }}
        run: |
          if [ "$CONTRACT_TARGET" = "full-crate" ]; then
            cargo test -p "$CONTRACT_CRATE" --locked -- --test-threads=1
          elif [ -n "$CONTRACT_SELECTOR" ]; then
            cargo test -p "$CONTRACT_CRATE" --test "$CONTRACT_TARGET" --locked "$CONTRACT_SELECTOR" -- --test-threads=1
          else
            cargo test -p "$CONTRACT_CRATE" --test "$CONTRACT_TARGET" --locked -- --test-threads=1
          fi
