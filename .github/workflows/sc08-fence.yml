name: SC-08 authority and session fencing

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/fencing.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/security_reasons.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc08_fence.rs"
      - "kiana-core/src/security_fence.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/authority.rs"
      - "kiana-core/tests/sc08_fence_guard.rs"
      - "docs/roadmap/security-fence-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc08-fence.yml"
  pull_request:
    paths:
      - "kiana-domain/src/fencing.rs"
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/security_reasons.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc08_fence.rs"
      - "kiana-core/src/security_fence.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/src/authority.rs"
      - "kiana-core/tests/sc08_fence_guard.rs"
      - "docs/roadmap/security-fence-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc08-fence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-08 domain fence fixture
        run: cargo test -p kiana-domain --test sc08_fence --locked -- --test-threads=1
      - name: Run SC-08 source guard
        run: cargo test -p kiana-core --test sc08_fence_guard --locked -- --test-threads=1
      - name: Compile SC-08 targets
        run: cargo check --workspace --tests --locked
