name: P3-I-02 company commands and events

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p3_i02_company_commands.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i02-company-commands-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i02-company-commands.yml"
  pull_request:
    paths:
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/company_replay.rs"
      - "kiana-domain/src/company_policy.rs"
      - "kiana-domain/tests/co08_replay.rs"
      - "kiana-core/src/company.rs"
      - "kiana-core/tests/p3_i02_company_commands.rs"
      - "kiana-core/tests/co08_replay_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap.md"
      - "docs/roadmap/p3-i02-company-commands-baseline.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/p3-i02-company-commands.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-command-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run company command/event source guard
        run: cargo test -p kiana-core --test p3_i02_company_commands --locked -- --test-threads=1
      - name: Run Company replay regression
        run: cargo test -p kiana-domain --test co08_replay --locked -- --test-threads=1
      - name: Run core replay wiring guard
        run: cargo test -p kiana-core --test co08_replay_guard --locked -- --test-threads=1
      - name: Run Company policy regression
        run: cargo test -p kiana-domain --test co05_policy --locked -- --test-threads=1
      - name: Compile P3-I-02 targets
        run: cargo check --workspace --tests --locked
