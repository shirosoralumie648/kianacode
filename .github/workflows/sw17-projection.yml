name: SW-17 swarm projection

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/swarm_projection.rs"
      - "kiana-domain/src/swarm_handoff.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_projection.rs"
      - "kiana-core/src/swarm_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw17_projection_guard.rs"
      - "docs/roadmap/sw17-projection-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw17-projection.yml"
  pull_request:
    paths:
      - "kiana-domain/src/swarm_projection.rs"
      - "kiana-domain/src/swarm_handoff.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/swarm_projection.rs"
      - "kiana-core/src/swarm_projection.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/sw17_projection_guard.rs"
      - "docs/roadmap/sw17-projection-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sw17-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SW-17 domain fixtures
        run: cargo test -p kiana-domain --test swarm_projection --locked -- --test-threads=1
      - name: Run SW-17 Core source guard
        run: cargo test -p kiana-core --test sw17_projection_guard --locked -- --test-threads=1
      - name: Compile SW-17 targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
