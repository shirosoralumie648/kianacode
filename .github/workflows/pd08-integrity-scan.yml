name: PD-08 EventStore integrity scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-scan:
    name: PD-08 integrity scan fixtures and guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run PD-08 eventlog integrity fixtures
        run: cargo test -p kiana-eventlog --test pd08_integrity_scan --locked -- --test-threads=1
      - name: Run PD-08 Core source guard
        run: cargo test -p kiana-core --test pd08_integrity_guard --locked -- --test-threads=1
      - name: Compile PD-08 eventlog target
        run: cargo test -p kiana-eventlog --test pd08_integrity_scan --no-run --locked
      - name: Compile PD-08 Core guard target
        run: cargo test -p kiana-core --test pd08_integrity_guard --no-run --locked
