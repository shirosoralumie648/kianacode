name: "CO-31 project pause, resume and cancellation propagation baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co31-project-control:
    name: "CO-31 project pause, resume and cancellation propagation baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co31_project_control_guard
        run: cargo test -p kiana-core --test co31_project_control_guard --locked -- --test-threads=1
      - name: Run kiana-domain co31_project_control
        run: cargo test -p kiana-domain --test co31_project_control --locked -- --test-threads=1
