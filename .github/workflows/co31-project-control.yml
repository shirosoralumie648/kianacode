name: co31-project-control

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/project_control.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co31_project_control.rs"
      - "kiana-core/src/project_control.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co31_project_control_guard.rs"
      - "docs/roadmap/co31-project-control-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co31-project-control.yml"
  pull_request:
    paths:
      - "kiana-domain/src/project_control.rs"
      - "kiana-domain/src/company.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co31_project_control.rs"
      - "kiana-core/src/project_control.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co31_project_control_guard.rs"
      - "docs/roadmap/co31-project-control-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co31-project-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-31 project control fixtures
        run: cargo test -p kiana-domain --test co31_project_control --locked -- --test-threads=1
      - name: Run CO-31 single-spine source guard
        run: cargo test -p kiana-core --test co31_project_control_guard --locked -- --test-threads=1
      - name: Compile CO-31 project control targets
        run: cargo check -p kiana-domain -p kiana-core --tests --locked
