name: ER-11 receipt DTO and redacted view

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-dto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run ER-11 receipt contract fixtures
        run: cargo test -p kiana-domain --test er11_receipt_contracts --locked -- --test-threads=1
      - name: Run ER-11 receipt source guard
        run: cargo test -p kiana-core --test er11_receipt_guard --locked -- --test-threads=1
      - name: Compile ER-11 targets
        run: cargo check --workspace --tests --locked
