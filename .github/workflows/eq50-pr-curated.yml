name: EQ-50 PR curated evaluation lane

on:
  pull_request:
    paths:
      - "scripts/eval-*.sh"
      - "scripts/tests/eq49-eval-scripts-static.sh"
      - "kiana-commands/**"
      - "kiana-core/**"
      - "kiana-daemon/**"
      - "kiana-quality/**"
      - "docs/roadmap/evaluation-scripts-baseline.md"
      - "docs/roadmap/evaluation-ci-lanes-baseline.md"
      - ".github/workflows/eq50-pr-curated.yml"
      - "scripts/tests/eq50-ci-lanes-static.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check script and lane guards
        run: |
          bash scripts/tests/eq49-eval-scripts-static.sh
          bash scripts/tests/eq50-ci-lanes-static.sh
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Compile curated package targets
        run: cargo check -p kiana-commands -p kiana-core -p kiana-daemon -p kiana-quality --tests --locked
      - name: Run daemon and core fixtures serially
        run: |
          cargo test -p kiana-core --tests --locked -- --test-threads=1
          cargo test -p kiana-daemon --tests --locked -- --test-threads=1
