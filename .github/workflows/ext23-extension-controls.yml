name: EXT-23 extension control changes

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/extension_lifecycle.rs"
      - "kiana-domain/tests/ext23_extension_controls.rs"
      - "kiana-core/tests/ext23_extension_controls_guard.rs"
      - "kiana-daemon/src/extensions.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext23-extension-controls-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext23-extension-controls.yml"
  pull_request:
    paths:
      - "kiana-domain/src/extension_lifecycle.rs"
      - "kiana-domain/tests/ext23_extension_controls.rs"
      - "kiana-core/tests/ext23_extension_controls_guard.rs"
      - "kiana-daemon/src/extensions.rs"
      - "docs/roadmap/skills-plugins-hooks.md"
      - "docs/roadmap/ext23-extension-controls-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/ext23-extension-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run EXT-23 domain fixtures
        run: cargo test -p kiana-domain --test ext23_extension_controls --locked -- --test-threads=1
      - name: Run EXT-23 source guard
        run: cargo test -p kiana-core --test ext23_extension_controls_guard --locked -- --test-threads=1
      - name: Compile EXT-23 target
        run: cargo check -p kiana-daemon --tests --locked
