name: BQ-09 admission estimator

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/billing_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq09_admission_estimator.rs"
      - "kiana-core/tests/bq09_admission_guard.rs"
      - "docs/roadmap/billing-admission-estimator-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq09-admission-estimator.yml"
  pull_request:
    paths:
      - "kiana-domain/src/billing_admission.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/bq09_admission_estimator.rs"
      - "kiana-core/tests/bq09_admission_guard.rs"
      - "docs/roadmap/billing-admission-estimator-baseline.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/bq09-admission-estimator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run admission estimator fixtures
        run: cargo test -p kiana-domain --test bq09_admission_estimator --locked -- --test-threads=1
      - name: Run admission estimator source guard
        run: cargo test -p kiana-core --test bq09_admission_guard --locked -- --test-threads=1
      - name: Compile BQ-09 targets
        run: cargo check --workspace --tests --locked
