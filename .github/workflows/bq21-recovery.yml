name: BQ-21 recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: BQ-21 restart, continue, replay, reconcile and fencing fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run BQ-21 domain fixtures
        run: cargo test -p kiana-domain --test billing_recovery --locked -- --test-threads=1
      - name: Run BQ-21 core admission fixtures and source guard
        run: cargo test -p kiana-core --test billing_recovery_guard --locked -- --test-threads=1
      - name: Compile BQ-21 domain target
        run: cargo test -p kiana-domain --test billing_recovery --no-run --locked
      - name: Compile BQ-21 core target
        run: cargo test -p kiana-core --test billing_recovery_guard --no-run --locked
