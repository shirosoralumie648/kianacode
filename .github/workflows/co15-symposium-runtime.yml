name: "CO-15 bounded symposium runtime baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co15-symposium-runtime:
    name: "CO-15 bounded symposium runtime baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co15_symposium_runtime_guard
        run: cargo test -p kiana-core --test co15_symposium_runtime_guard --locked -- --test-threads=1
      - name: Run kiana-domain co15_symposium_runtime
        run: cargo test -p kiana-domain --test co15_symposium_runtime --locked -- --test-threads=1
