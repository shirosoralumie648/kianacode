name: SC-02 security IDs and schema contract

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/security_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc02_security_contract.rs"
      - "kiana-core/tests/sc02_security_contract_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/security-contract-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc02-security-contract.yml"
  pull_request:
    paths:
      - "kiana-domain/src/ids.rs"
      - "kiana-domain/src/contracts.rs"
      - "kiana-domain/src/security_contracts.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/sc02_security_contract.rs"
      - "kiana-core/tests/sc02_security_contract_guard.rs"
      - "kiana-protocol/src/lib.rs"
      - "docs/roadmap/security-contract-baseline.md"
      - "docs/roadmap/security-compliance.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/sc02-security-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run SC-02 domain fixture
        run: cargo test -p kiana-domain --test sc02_security_contract --locked -- --test-threads=1
      - name: Run SC-02 source guard
        run: cargo test -p kiana-core --test sc02_security_contract_guard --locked -- --test-threads=1
      - name: Compile SC-02 targets
        run: cargo check -p kiana-domain --tests --locked
