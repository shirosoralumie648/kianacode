name: co28-project-acceptance

on:
  push:
    branches: [main, master]
    paths:
      - "kiana-domain/src/project_acceptance.rs"
      - "kiana-domain/src/milestone_acceptance.rs"
      - "kiana-domain/src/company_review.rs"
      - "kiana-domain/src/company_closeout.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co28_project_acceptance.rs"
      - "kiana-core/src/project_acceptance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co28_project_acceptance_guard.rs"
      - "docs/roadmap/co28-project-acceptance-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co28-project-acceptance.yml"
  pull_request:
    paths:
      - "kiana-domain/src/project_acceptance.rs"
      - "kiana-domain/src/milestone_acceptance.rs"
      - "kiana-domain/src/company_review.rs"
      - "kiana-domain/src/company_closeout.rs"
      - "kiana-domain/src/lib.rs"
      - "kiana-domain/tests/co28_project_acceptance.rs"
      - "kiana-core/src/project_acceptance.rs"
      - "kiana-core/src/lib.rs"
      - "kiana-core/tests/co28_project_acceptance_guard.rs"
      - "docs/roadmap/co28-project-acceptance-baseline.md"
      - "docs/roadmap/companyos.md"
      - "docs/roadmap.md"
      - "CURRENT_STATUS.md"
      - ".github/workflows/co28-project-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Run CO-28 project acceptance fixtures
        run: cargo test -p kiana-domain --test co28_project_acceptance --locked -- --test-threads=1
      - name: Run CO-28 project acceptance source guard
        run: cargo test -p kiana-core --test co28_project_acceptance_guard --locked -- --test-threads=1
      - name: Compile CO-28 acceptance targets
        run: cargo check -p kiana-domain -p kiana-core -p kiana-daemon --tests --locked
