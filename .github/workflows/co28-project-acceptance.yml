name: "CO-28 project acceptance, rejection and waiver baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co28-project-acceptance:
    name: "CO-28 project acceptance, rejection and waiver baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format gate
        run: cargo fmt --all --check
      - name: Run kiana-core co28_project_acceptance_guard
        run: cargo test -p kiana-core --test co28_project_acceptance_guard --locked -- --test-threads=1
      - name: Run kiana-domain co28_project_acceptance
        run: cargo test -p kiana-domain --test co28_project_acceptance --locked -- --test-threads=1
