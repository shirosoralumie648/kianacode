[package]
name = "kiana-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
kiana-domain.workspace = true
kiana-gates.workspace = true
kiana-policy.workspace = true
kiana-ports.workspace = true
kiana-runner-protocol.workspace = true
kiana-workflow.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
libc.workspace = true

# Durable path locks need an OS-level shared/exclusive lock on Windows as well; `flock(2)` is
# Unix-only.  Target-scoped, same pinned version as the other workspace members, so Unix builds
# are unchanged.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
kiana-capability-broker.workspace = true
kiana-eventlog.workspace = true
kiana-provider.workspace = true
kiana-query.workspace = true
kiana-runner.workspace = true
async-trait.workspace = true
tokio.workspace = true
sha2 = "0.10"
