[package]
name = "kiana-entrypoints"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
publish = false

[features]
default = []
native-computer-use = ["kiana-computer-mcp/native"]

[[bin]]
name = "kiana"
path = "src/bin/kiana.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
rustyline = "14.0"
colored = "2"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.8"
kiana-services = { path = "../kiana-services", version = "0.1.0" }
kiana-bootstrap = { path = "../kiana-bootstrap", version = "0.1.0" }
kiana-tools = { path = "../kiana-tools", version = "0.1.0" }
kiana-skills = { path = "../kiana-skills", version = "0.1.0" }
kiana-query = { path = "../kiana-query", version = "0.1.0" }
kiana-commands = { path = "../kiana-commands", version = "0.1.0" }
kiana-bridge = { path = "../kiana-bridge", version = "0.1.0" }
kiana-screens = { path = "../kiana-screens", version = "0.1.0" }
kiana-chrome-mcp = { path = "../kiana-chrome-mcp", version = "0.1.0" }
kiana-computer-mcp = { path = "../kiana-computer-mcp", version = "0.1.0" }
kiana-remote = { path = "../kiana-remote", version = "0.1.0" }
kiana-types = { path = "../kiana-types", version = "0.1.0" }
kiana-url-handler = { path = "../kiana-url-handler", version = "0.1.0" }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
url = "2.5"
