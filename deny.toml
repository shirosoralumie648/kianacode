[graph]
all-features = false
no-default-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # 2026-09-09：syntect / kiana-tui 归档后，yaml-rust（RUSTSEC-2024-0320）与
    # bincode（RUSTSEC-2025-0141）的忽略项已无来源，删除。
    # 以下两条仍可从产品依赖链到达，保留并注明路径：
    # - async-std via chromiumoxide <- kiana-chrome-mcp <- kiana-entrypoints
    # - paste via ratatui <- kiana-screens <- kiana-entrypoints
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0052",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 内部 crate 走 path 依赖（[workspace.dependencies] 不带 version），属于正常
# workspace 布局，不是外部通配符。该开关只放宽 path 依赖，registry 依赖仍按 deny。
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
