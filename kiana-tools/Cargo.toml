[package]
name = "kiana-tools"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
regex = "1"
glob = "0.3"
walkdir = "2"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"
url = "2.5"
kiana-services = { path = "../kiana-services", version = "0.1.0" }
kiana-skills = { path = "../kiana-skills", version = "0.1.0" }
kiana-types = { path = "../kiana-types", version = "0.1.0" }
kiana-query = { path = "../kiana-query", version = "0.1.0" }
