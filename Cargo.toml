[workspace]
resolver = "2"
members = [
    "kiana-bootstrap",
    "kiana-capability-broker",
    "kiana-capability-governance-supervisor",
    "kiana-bridge",
    "kiana-chrome-mcp",
    "kiana-client",
    "kiana-color-diff",
    "kiana-commands",
    "kiana-components",
    "kiana-computer-input",
    "kiana-computer-mcp",
    "kiana-constants",
    "kiana-coordinator",
    "kiana-core",
    "kiana-daemon",
    "kiana-domain",
    "kiana-entrypoints",
    "kiana-eventlog",
    "kiana-gates",
    "kiana-ink",
    "kiana-modifiers",
    "kiana-policy",
    "kiana-ports",
    "kiana-protocol",
    "kiana-query",
    "kiana-remote",
    "kiana-runner",
    "kiana-runner-protocol",
    "kiana-screen-capture",
    "kiana-screens",
    "kiana-services",
    "kiana-skills",
    "kiana-tasks",
    "kiana-tools",
    "kiana-tui",
    "kiana-types",
    "kiana-url-handler",
    "kiana-workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
authors = ["Kiana Project Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kiana-project/kiana"
homepage = "https://github.com/kiana-project/kiana"
description = "Kiana Code AI coding assistant workspace component."
readme = "README.md"

[workspace.dependencies]
# 共享依赖
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
chrono = "0.4"
uuid = { version = "1.11", features = ["v4"] }
regex = "1.11"
libc = "0.2"
enigo = "0.6"
rdev = "0.5"
xcap = "0.9"
syntect = "5.3"
similar = "3.1"

# 内部 crate
kiana-types = { path = "kiana-types" }
kiana-constants = { path = "kiana-constants" }
kiana-coordinator = { path = "kiana-coordinator" }
kiana-bootstrap = { path = "kiana-bootstrap" }
kiana-capability-broker = { path = "kiana-capability-broker" }
kiana-client = { path = "kiana-client" }
kiana-core = { path = "kiana-core" }
kiana-daemon = { path = "kiana-daemon" }
kiana-domain = { path = "kiana-domain" }
kiana-eventlog = { path = "kiana-eventlog" }
kiana-gates = { path = "kiana-gates" }
kiana-policy = { path = "kiana-policy" }
kiana-ports = { path = "kiana-ports" }
kiana-protocol = { path = "kiana-protocol" }
kiana-query = { path = "kiana-query" }
kiana-runner = { path = "kiana-runner" }
kiana-runner-protocol = { path = "kiana-runner-protocol" }
kiana-workflow = { path = "kiana-workflow" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
