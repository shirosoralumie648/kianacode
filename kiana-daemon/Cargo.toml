[package]
name = "kiana-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
publish = false

[dependencies]
ring = "0.17.14"
kiana-capability-broker.workspace = true
kiana-core.workspace = true
kiana-domain.workspace = true
kiana-eventlog.workspace = true
kiana-gates.workspace = true
kiana-policy.workspace = true
kiana-ports.workspace = true
kiana-protocol.workspace = true
kiana-provider.workspace = true
kiana-query.workspace = true
kiana-runner.workspace = true
kiana-runner-protocol.workspace = true
kiana-services = { path = "../kiana-services", version = "0.1.0" }
kiana-skills = { path = "../kiana-skills", version = "0.1.0" }
kiana-types.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tokio.workspace = true
libc.workspace = true

# The workspace patch lock needs an OS-level exclusive lock on Windows as well; `flock(2)` only
# exists on Unix, so the Windows path uses `LockFileEx` from the same crate version the other
# workspace members already pin.  This is a target-scoped dependency, so Unix builds are unchanged.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
kiana-client.workspace = true
kiana-skills = { path = "../kiana-skills", version = "0.1.0" }
